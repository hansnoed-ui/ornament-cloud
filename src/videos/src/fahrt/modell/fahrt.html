<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Fahrt</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Bühne für eine 360°-Kamerafahrt um ein GLB-Modell: Schwarz, Raumlicht (RoomEnvironment) und ein Streiflicht, Kamera auf einer Kreisbahn.
// window.fahrt.bild(winkelGrad, hoeheGrad) zeichnet einen Blick; das Bild hängt nur von den Winkeln ab.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search), B = Number(q.get("b") ?? 1080), H = Number(q.get("h") ?? 1350);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(B, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
// Grund: ein dunkles Grau statt Schwarz, sonst verschwindet der dunkle Turban (Farbe mit ?grund=, z. B. 151412)
const szene = new THREE.Scene(); szene.background = new THREE.Color(`#${q.get("grund") ?? "242424"}`);
const pmrem = new THREE.PMREMGenerator(renderer);
szene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; szene.environmentIntensity = 0.9;
// Die Lichter fahren mit der Kamera (Drehbühne): Hauptlicht schräg von vorn oben, zwei Kantenlichter von hinten (eines im Blau des Labs)
const kamera = new THREE.PerspectiveCamera(30, B / H, 0.01, 100); szene.add(kamera);
const licht = (farbe, staerke, x, y, z) => { const l = new THREE.DirectionalLight(farbe, staerke); l.position.set(x, y, z); l.target.position.set(0, 0, -3); kamera.add(l, l.target); };
licht(0xffffff, 1.6, -1.6, 1.8, 1.5);
licht(0xffffff, 3.0, -2.6, 1.2, -5.5);
licht(0x8fb0ff, 3.0, 2.6, 0.8, -5.5);
const gltf = await new GLTFLoader().loadAsync(q.get("glb") ?? "/3d/trellis.glb");
const modell = gltf.scene;
// ?material=gips: ein Modell ohne Textur (nur Form) als heller Gips
// ?material=matt: Textur behalten, aber nicht metallisch (Stable Fast 3D liefert Chrom)
if (q.get("material") === "matt") modell.traverse((o) => { if (o.isMesh) { o.material.metalness = 0; o.material.metalnessMap = null; o.material.roughness = 0.75; o.material.roughnessMap = null; o.material.needsUpdate = true; } });
if (q.get("material") === "gips") modell.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xe9e5dd, roughness: 0.62, metalness: 0 }); });
// in die Mitte, auf Höhe 1
const box = new THREE.Box3().setFromObject(modell), groesse = box.getSize(new THREE.Vector3()), mitte = box.getCenter(new THREE.Vector3());
const s = 1 / Math.max(groesse.x, groesse.y, groesse.z);
modell.scale.setScalar(s); modell.position.copy(mitte).multiplyScalar(-s);
const halter = new THREE.Group(); halter.add(modell); szene.add(halter);
const kugel = new THREE.Box3().setFromObject(halter).getBoundingSphere(new THREE.Sphere());
const abstand = (kugel.radius / Math.sin(THREE.MathUtils.degToRad(kamera.fov / 2))) * 0.92;
window.fahrt = {
  masse: { x: groesse.x * s, y: groesse.y * s, z: groesse.z * s },
  bild(winkel, hoehe = 12, nah = 1) {
    const w = THREE.MathUtils.degToRad(winkel), h = THREE.MathUtils.degToRad(hoehe), r = abstand * nah;
    kamera.position.set(Math.sin(w) * Math.cos(h) * r, Math.sin(h) * r, Math.cos(w) * Math.cos(h) * r);
    kamera.lookAt(0, 0, 0);
    renderer.render(szene, kamera);
  },
  png: () => renderer.domElement.toDataURL("image/png"),
};
window.bereit = true;
</script>
</body>
</html>
