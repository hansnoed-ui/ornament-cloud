      Aufbau: OMNA COLOR zum direkten Spielen (eingebettet aus alpha/omna-color/, seit 4. Oktober 2026 statt des Stellenfelds), sonst nichts.
      Die Einbettung ist eine freigegebene Ausnahme von REGELN §14 (4. Oktober 2026); der Beitrag zu OMNA COLOR bleibt auf der Seite «Web», das Stellenfeld ebenfalls dort.
      Zettelkasten, Apps, Masterprompts und Web stehen im Menü oben (Neuordnung vom 2. Oktober 2026). Die Karten (<article class="card">) liegen dort.
    -->
    <figure class="omna">
      <iframe src="alpha/omna-color/" title="OMNA COLOR: zwei Farbräder drehen gegeneinander und wählen eine von 180 Gestaltungsübungen. Drehen mit dem Knopf oder durch Ziehen am Rad."></iframe>
      <figcaption>OMNA COLOR: Zwei Farbräder drehen gegeneinander. Zeigen sie zwei Farben, verbindet die Übung beide Themen, zeigen sie dieselbe Farbe, bleibt es beim reinen Thema. Drehen mit dem Knopf oder durch Ziehen am Rad. Mehr dazu unter <a href="web/">Web</a>.</figcaption>

  <script>
    // OMNA COLOR eingebettet: der Rahmen ist so hoch wie das Spiel (Rad, Übung, Hinweise) und hat keinen eigenen Bildlauf
    (function () {
      var f = document.querySelector(".omna iframe");
      if (!f) return;
      function passe() { try { f.style.height = Math.ceil(f.contentDocument.body.getBoundingClientRect().height) + "px"; } catch (e) {} }
      function an() { passe(); try { new ResizeObserver(passe).observe(f.contentDocument.body); } catch (e) {} }
      f.addEventListener("load", an);
      try { if (f.contentDocument && f.contentDocument.readyState === "complete" && f.contentDocument.body.childElementCount) an(); } catch (e) {}
    })();
  </script>
