<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Social-Paket: Szene</title>
<!--
  Die Szene der Filme aus tools/social-paket.mjs: ein 2D-Canvas, Bild für Bild gezeichnet (kein Echtzeit-Mitschnitt, keine Uhr, kein Zufall).
    window.einrichten({ breite, hoehe, cover, bilder, name, titel, unterzeile, adresse, striche: [0–1 × 96], tiefe: [0–1 je Bild] })
    window.bild(i)       zeichnet Bild i (gleiches i → gleiches Bild)
    window.bildJpeg(i)   zeichnet Bild i und gibt es als JPEG (Data-URL) zurück
  Grund: das Cover weichgezeichnet und abgedunkelt, mit dunklem Verlauf oben und unten und der Schrift – einmal gerechnet. Je Bild kommen nur das
  scharfe Cover (atmet mit dem Tiefenanteil, höchstens 2,5 %) und die Strichzeile (Hüllkurve des Ausschnitts als Fortschritt) dazu.
  Im 9:16 bleiben die obersten 250 px und die untersten 340 px frei von Wichtigem (dort liegen die Bedienelemente von Instagram und TikTok).
-->
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const HELL = "#ece8e1", AKZENT = "#ffd84d", SCHRIFT = '"Instrument Sans", system-ui, sans-serif';
let S = null;

const bildLaden = (src) => new Promise((ok, nein) => { const b = new Image(); b.onload = () => ok(b); b.onerror = () => nein(new Error("Cover lädt nicht: " + src)); b.src = src; });
const rund = (x, px, py, w, h, r) => { x.beginPath(); x.roundRect(px, py, w, h, r); };

/** Masse je Format: alles hängt an der Lage des Covers; Schrift und Striche sind links an seiner Kante ausgerichtet */
function masse(breite, hoehe) {
  if (hoehe > breite * 1.3) {   // 9:16 – zwischen 250 px oben und 340 px unten
    const cover = Math.round(breite * 0.84), x = Math.round((breite - cover) / 2), y = 338;
    return { cover, x, y, name: 296, nameGr: 32, strichY: y + cover + 46, strichH: 64, strichB: 3, titel: y + cover + 192, titelGr: 70, unter: y + cover + 246, unterGr: 34, adresse: hoehe - 362, adresseGr: 32 };
  }
  const cover = Math.round(hoehe * 0.58), x = Math.round((breite - cover) / 2), y = 98;   // 1:1
  return { cover, x, y, name: 68, nameGr: 30, strichY: y + cover + 38, strichH: 46, strichB: 2.5, titel: y + cover + 164, titelGr: 64, unter: y + cover + 212, unterGr: 32, adresse: hoehe - 42, adresseGr: 30 };
}

window.einrichten = async (d) => {
  const c = document.getElementById("c"); c.width = d.breite; c.height = d.hoehe;
  const x = c.getContext("2d", { alpha: false });
  const m = masse(d.breite, d.hoehe), cover = await bildLaden(d.cover);
  await Promise.all([document.fonts.load(`500 ${m.titelGr}px "Instrument Sans"`, d.titel + d.name), document.fonts.load(`400 ${m.unterGr}px "Instrument Sans"`, d.unterzeile + d.adresse)]);
  await document.fonts.ready;
  if (!document.fonts.check(`500 ${m.titelGr}px "Instrument Sans"`)) throw new Error("Instrument Sans ist nicht geladen");

  // Grund, einmal: Cover flächenfüllend, weich und dunkel; Verlauf oben und unten; Schrift
  const g = new OffscreenCanvas(d.breite, d.hoehe), gx = g.getContext("2d", { alpha: false });
  gx.fillStyle = "#0c0c0c"; gx.fillRect(0, 0, d.breite, d.hoehe);
  const weich = Math.round(d.breite * 0.06), seite = Math.max(d.breite, d.hoehe) + 6 * weich;   // grösser als die Fläche: der Rand der Unschärfe liegt ausserhalb
  gx.filter = `blur(${weich}px) brightness(0.45)`;
  gx.drawImage(cover, (d.breite - seite) / 2, (d.hoehe - seite) / 2, seite, seite);
  gx.filter = "none";
  const verlauf = (y0, y1, staerke) => { const v = gx.createLinearGradient(0, y0, 0, y1); v.addColorStop(0, `rgba(8,8,8,${staerke})`); v.addColorStop(1, "rgba(8,8,8,0)"); gx.fillStyle = v; gx.fillRect(0, Math.min(y0, y1), d.breite, Math.abs(y1 - y0)); };
  verlauf(0, m.y + m.cover * 0.25, 0.55);
  verlauf(d.hoehe, m.y + m.cover * 0.8, 0.72);

  gx.fillStyle = HELL; gx.textBaseline = "alphabetic"; gx.textAlign = "left";
  const zeile = (text, y, groesse, gewicht, { sperrung = 0, deckung = 1, kleinst = groesse } = {}) => {
    if (!text) return;
    let gr = groesse;
    gx.letterSpacing = `${sperrung * gr}px`; gx.font = `${gewicht} ${gr}px ${SCHRIFT}`;
    while (gr > kleinst && gx.measureText(text).width > m.cover) { gr -= 2; gx.letterSpacing = `${sperrung * gr}px`; gx.font = `${gewicht} ${gr}px ${SCHRIFT}`; }
    gx.globalAlpha = deckung; gx.fillText(text, m.x, y, m.cover); gx.globalAlpha = 1; gx.letterSpacing = "0px";
  };
  zeile(d.name, m.name, m.nameGr, 500, { sperrung: 0.22, deckung: 0.92 });
  zeile(d.titel, m.titel, m.titelGr, 500, { sperrung: -0.012, kleinst: 44 });
  zeile(d.unterzeile, m.unter, m.unterGr, 400, { deckung: 0.78, kleinst: 28 });
  zeile(d.adresse, m.adresse, m.adresseGr, 400, { sperrung: 0.01, deckung: 0.78, kleinst: 26 });

  // das scharfe Cover in seiner Zielgrösse, einmal fein verkleinert (je Bild wird es nur noch um höchstens 2,5 % skaliert)
  const gr = Math.round(m.cover * 1.025), k = new OffscreenCanvas(gr, gr), kx = k.getContext("2d");
  kx.imageSmoothingQuality = "high";
  const q = Math.min(cover.naturalWidth, cover.naturalHeight);
  kx.drawImage(cover, (cover.naturalWidth - q) / 2, (cover.naturalHeight - q) / 2, q, q, 0, 0, gr, gr);

  S = { d, m, c, x, grund: g, cover: k };
  window.bild(0);
  return { breite: d.breite, hoehe: d.hoehe, bilder: d.bilder };
};

window.bild = (i) => {
  const { d, m, x, grund, cover } = S;
  i = Math.max(0, Math.min(d.bilder - 1, Math.round(i)));
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = "none";
  x.drawImage(grund, 0, 0);

  // Cover: atmet mit dem Tiefenanteil
  const s = 1 + 0.025 * Math.max(0, Math.min(1, d.tiefe[i] ?? 0)), w = m.cover * s, px = m.x + (m.cover - w) / 2, py = m.y + (m.cover - w) / 2;
  x.save();
  x.shadowColor = "rgba(0,0,0,0.5)"; x.shadowBlur = 48; x.shadowOffsetY = 16; x.fillStyle = "#000";
  rund(x, px, py, w, w, 6); x.fill();
  x.restore();
  x.save();
  rund(x, px, py, w, w, 6); x.clip();
  x.imageSmoothingQuality = "high";
  x.drawImage(cover, px, py, w, w);
  x.restore();

  // Strichzeile: gespielt hell, der aktuelle im Akzent, kommende gedämpft
  const n = d.striche.length, jetzt = Math.min(n - 1, Math.floor((i / d.bilder) * n)), schritt = (m.cover - m.strichB) / (n - 1), mitte = m.strichY + m.strichH / 2, kleinst = Math.max(6, m.strichH * 0.12);
  x.lineCap = "round"; x.lineWidth = m.strichB;
  for (let k = 0; k < n; k++) {
    const h = kleinst + (m.strichH - kleinst) * Math.max(0, Math.min(1, d.striche[k])), sx = m.x + m.strichB / 2 + k * schritt;
    x.strokeStyle = k === jetzt ? AKZENT : HELL; x.globalAlpha = k <= jetzt ? 1 : 0.3;
    x.beginPath(); x.moveTo(sx, mitte - (h - m.strichB) / 2); x.lineTo(sx, mitte + (h - m.strichB) / 2); x.stroke();
  }
  x.globalAlpha = 1;
};

window.bildJpeg = (i) => { window.bild(i); return S.c.toDataURL("image/jpeg", 0.93); };
</script>
</body>
</html>
