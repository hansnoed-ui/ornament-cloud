<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Hörseite der Maxi «directer» von the i (10. November 2026, Wunsch von Christian): nur per Direktlink für Freunde, nicht in der Sitemap, für Suchmaschinen gesperrt.
       Alles Veränderliche steht in ep.json (Anzeigename, EP-Titel, Cover, Audioquelle, Tracktitel und Trackmarken). Titel und Beschreibung hier unten
       sind für Linkvorschauen (die lesen kein JavaScript) und müssen zu ep.json passen; tests/ep-directer.test.mjs prüft das. Anleitung: docs/ep-directer.md -->
  <meta name="robots" content="noindex">
  <title>the i – directer</title>
  <meta name="description" content="the i – directer. Die Maxi zum Hören, drei Tracks am Stück.">
  <meta property="og:title" content="the i – directer">
  <meta property="og:description" content="Die Maxi zum Hören, drei Tracks am Stück.">
  <!-- Linkvorschau (Facebook, WhatsApp, Signal, X): og:type «website», weil Facebook «music.album» nur mit weiteren music:-Angaben annimmt und die Karte sonst
       weglässt. Bild 1200 × 630 (das Cover mittig auf seinem unscharfen Abbild), unter 300 KB für WhatsApp. Neues Motiv immer unter neuem Dateinamen,
       sonst zeigen Plattformen das zwischengespeicherte alte; danach bei Facebook im Sharing Debugger «Erneut scrapen». -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ornament.cloud">
  <meta property="og:locale" content="de_CH">
  <meta property="og:url" content="https://ornament.cloud/listen/directer/">
  <meta property="og:image" content="https://ornament.cloud/listen/directer/og-directer.jpg">
  <meta property="og:image:secure_url" content="https://ornament.cloud/listen/directer/og-directer.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cover: the i – directer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="the i – directer">
  <meta name="twitter:description" content="Die Maxi zum Hören, drei Tracks am Stück.">
  <meta name="twitter:image" content="https://ornament.cloud/listen/directer/og-directer.jpg">
  <meta name="theme-color" content="#121110">
  <link rel="stylesheet" href="player.css?v=3">
  <script type="module" src="player.js?v=4"></script>
</head>
<body>
  <main class="ep" id="ep">
    <figure class="cover">
      <img id="cover" alt="Cover der Maxi" width="1000" height="1000" decoding="async">
    </figure>

    <header class="kopf unsichtbar">
      <p class="name" id="name">the i</p>
      <h1 class="titel" id="titel">directer</h1>
    </header>

    <div class="inapp" id="inapp" hidden></div>

    <section class="steuerung" aria-label="Wiedergabe">
      <button class="play" id="play" type="button" aria-label="Abspielen" disabled>
        <svg class="symbol-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="symbol-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
      </button>
      <div class="jetzt">
        <p class="jetzt-titel" id="jetzt-titel">&nbsp;</p>
        <p class="jetzt-zeit" id="jetzt-zeit"><span id="zeit-track">0:00</span> / <span id="dauer-track">–:––</span></p>
      </div>
    </section>

    <div class="regler">
      <input type="range" id="regler" min="0" max="0" step="0.1" value="0" aria-label="Position in der Maxi" disabled>
      <div class="marken" id="marken" aria-hidden="true"></div>
    </div>

    <ol class="tracks" id="tracks" aria-label="Tracks"></ol>

    <p class="hinweis" id="hinweis" role="status" hidden></p>
    <p class="platzhalter" id="platzhalter" hidden></p>

    <audio id="audio" preload="metadata"></audio>
    <noscript><p class="hinweis">Zum Hören bitte JavaScript einschalten.</p></noscript>
  </main>
</body>
</html>
