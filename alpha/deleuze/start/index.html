<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<title>the deleuzian scheme</title>
<link rel="stylesheet" href="../gemeinsam/zwischentitel.css?v=1">
<link rel="stylesheet" href="start.css?v=4">
</head>
<body>
<!-- Masterseite in der Gestaltung «Zwischentitel» (docs/GESTALTUNG.md):
     der Kristall der Eingänge, daneben die Operatoren als Schnittfolge. -->
<header class="zt-band kopf">
  <b>the deleuzian scheme</b>
  <nav class="zt-sprachen" aria-label="Sprache"><button data-lang="de">de</button><button data-lang="en">en</button><button data-lang="fr">fr</button></nav>
</header>

<main class="seite">
  <section class="eingang" aria-labelledby="leitsatz">
    <div class="kristall-huelle">
      <canvas id="kristall" class="kristall" role="img" data-t-aria="kristallAria"></canvas>
    </div>
    <p class="untertitel" id="untertitel" aria-live="polite"></p>
    <h1 class="leitsatz" id="leitsatz" data-t="leitsatz">Begriffe als Verfahren, angewendet auf dein eigenes Material.</h1>
    <div class="material">
      <span class="zt-kennung" data-t="material">Material</span>
      <div class="material-wahl">
        <button class="zt-taste" id="m-kamera" data-t="kamera">Kamera</button>
        <label class="zt-taste" id="m-datei"><span data-t="datei">Foto oder Video</span><input type="file" id="datei" accept="image/*,video/*" hidden></label>
        <button class="zt-taste" id="m-beispiel" data-t="beispiel" aria-pressed="true">Beispiel</button>
      </div>
    </div>
  </section>

  <nav class="folge-huelle" aria-labelledby="folge-titel">
    <h2 class="zt-kennung folge-titel" id="folge-titel" data-t="folgeTitel">Phase 1 · acht Begriffe</h2>
    <ol class="folge" id="folge"></ol>
  </nav>
</main>

<p class="meldung" id="meldung" hidden></p>
<script type="module" src="start.js?v=3"></script>
</body>
</html>
