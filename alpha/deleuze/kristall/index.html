<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050506">
<title>Kristallbild · the deleuzian scheme</title>
<link rel="stylesheet" href="kristall.css?v=7">
</head>
<body>
<main class="buehne" id="buehne">
  <canvas id="leinwand" aria-label="Kristallbild"></canvas>

  <section class="auftakt" id="auftakt">
    <p class="marke">the deleuzian scheme</p>
    <h1 data-t="titel">Kristallbild</h1>
    <p class="satz" data-t="satz">Die Gegenwart spaltet sich in jedem Augenblick.</p>
    <div class="wahl">
      <button class="haupt" id="kamera" data-t="kamera">Kamera</button>
      <label class="neben"><span data-t="video">Video oder Fotos</span><input type="file" id="datei" accept="video/*,image/*" multiple hidden></label>
      <button class="neben" id="beispiel" data-t="beispiel">Beispiel</button>
    </div>
    <p class="hinweis" data-t="hinweis">Alles bleibt auf deinem Gerät.</p>
  </section>

  <header class="kopf" id="kopf" hidden>
    <span class="marke">the deleuzian scheme · <b data-t="titel">Kristallbild</b></span>
    <nav class="sprachen" aria-label="Sprache">
      <button data-lang="de">DE</button><button data-lang="en">EN</button><button data-lang="fr">FR</button>
    </nav>
  </header>

  <section class="regler" id="regler" hidden>
    <nav class="formen" aria-label="Schliff">
      <button data-form="brillant" data-t="brillant">Brillant</button><button data-form="oval" data-t="oval">Oval</button><button data-form="smaragd" data-t="smaragd">Smaragd</button><button data-form="bergkristall" data-t="bergkristall">Bergkristall</button><button data-form="stein" data-t="stein">Stein</button>
    </nav>
    <label id="zeile-facetten"><span data-t="facetten">Facetten</span><input type="range" id="r-facetten" min="8" max="24" step="1" value="18"></label>
    <label><span data-t="tiefe">Zeittiefe</span><input type="range" id="r-tiefe" min="0.3" max="8" step="0.1" value="3"></label>
    <label><span data-t="brechung">Brechung</span><input type="range" id="r-brechung" min="0" max="1" step="0.01" value="0.35"></label>
    <div class="knoepfe">
      <button id="begriff-auf" data-t="begriff">Begriff</button>
      <button id="standbild" data-t="standbild">Standbild</button>
      <button id="aufnahme" data-t="aufnahme">Aufnahme</button>
    </div>
  </section>

  <p class="geste" id="geste" hidden data-t="geste">Ziehen dreht den Kristall.</p>
</main>

<aside class="begriff" id="begriff" hidden aria-labelledby="begriff-titel">
  <button class="zu" id="begriff-zu" aria-label="Schliessen">×</button>
  <p class="familie" data-t="familie">Zeit · Cinéma 2, Kapitel 4</p>
  <h2 id="begriff-titel" data-t="b-titel">Das Kristallbild</h2>
  <p class="fr">l’image-cristal</p>
  <div class="text" data-t="b-text"></div>
  <p class="frage" data-t="b-frage"></p>
  <p class="quelle" data-t="b-quelle"></p>
</aside>

<p class="meldung" id="meldung" hidden></p>
<script type="module" src="kristall.js?v=7"></script>
</body>
</html>
