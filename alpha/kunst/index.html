<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kunst – Hypertext · Ornament Cloud · Alpha</title>
  <!--
    Alpha-Bereich: öffentlich erreichbar, nicht in der Sitemap, für Suchmaschinen gesperrt (REGELN §14).
    «Kunst» steht für sich, nur per Direktlink (Wunsch von Christian, 1. November 2026; Ausnahme in tests/navigation.test.mjs):
    alle freigegebenen Facebook-Beiträge mit dem Stichwort «Kunst» als Hypertext im Stil von Obsidian, schwarz und weiss, hell und dunkel.
    Bis zu vier Beiträge markieren, daraus eine Montage machen und weiterschreiben; dazu ein Zettel aus «Zu seiner Zeit» und eine ORNA-Begegnung.
    Logik: verknuepfung.js, Oberfläche: kunst.js, Daten: beitraege.js (tools/build-kunst.mjs), jev.js (tools/build-jev-kunst.ts).
  -->
  <meta name="robots" content="noindex">
  <meta name="description" content="Facebook-Beiträge von Christian Strickler zum Stichwort Kunst als Hypertext: verknüpft über Schlagwörter, markieren, montieren, weiterschreiben.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../../vendor/fonts/fonts.css">
  <link rel="stylesheet" href="kunst.css?v=1">
  <script>
    // Modus vor dem ersten Anstrich setzen (gemerkt pro Gerät, sonst wie das Gerät)
    try { const m = localStorage.getItem("ornament.kunst.modus"); if (m === "hell" || m === "dunkel") document.documentElement.dataset.modus = m; } catch (e) {}
  </script>
</head>
<body>
  <header class="kopf">
    <a class="marke" href="/b/">Ornament Cloud</a>
    <span class="kopf-titel">Kunst <span class="leise">· Hypertext</span></span>
    <button class="knopf-klein nur-schmal" id="liste-auf" type="button" aria-controls="seite-links" aria-expanded="false">Beiträge</button>
    <button class="knopf-klein" id="modus" type="button" aria-label="Hell oder dunkel"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor"/><path d="M8 1a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
  </header>

  <div class="raum">
    <aside class="links" id="seite-links" aria-label="Beiträge und Schlagwörter">
      <div class="suche">
        <input id="suche" type="search" placeholder="Suchen …" autocomplete="off" aria-label="Beiträge durchsuchen">
      </div>
      <div class="reiter" role="tablist">
        <button role="tab" id="reiter-beitraege" aria-selected="true" type="button">Beiträge</button>
        <button role="tab" id="reiter-woerter" aria-selected="false" type="button">Schlagwörter</button>
      </div>
      <div class="jahre" id="jahre" aria-label="Nach Jahr filtern"></div>
      <ol class="liste" id="liste"></ol>
      <p class="anzahl leise" id="anzahl"></p>
    </aside>

    <main class="mitte" id="mitte" tabindex="-1">
      <div id="ansicht"></div>
    </main>

    <aside class="rechts" aria-label="Verknüpfungen">
      <h2 class="klein">Lokaler Graph</h2>
      <canvas id="graph" width="320" height="260" aria-label="Graph: der offene Beitrag, verwandte Beiträge und gemeinsame Schlagwörter"></canvas>
      <h2 class="klein">Verwandte Beiträge</h2>
      <ol class="verweise" id="verwandte"></ol>
      <h2 class="klein">Schlagwörter</h2>
      <p class="marken" id="marken"></p>
    </aside>
  </div>

  <div class="leiste" id="leiste" hidden>
    <span id="leiste-text"></span>
    <span class="leiste-knoepfe">
      <button class="knopf-klein" id="leeren" type="button">Leeren</button>
      <button class="knopf" id="montieren" type="button">Neuen Beitrag montieren</button>
    </span>
  </div>

  <dialog class="werkbank" id="werkbank" aria-labelledby="werkbank-titel">
    <form method="dialog" class="werkbank-kopf">
      <h2 id="werkbank-titel">Neuer Beitrag</h2>
      <button class="knopf-klein" value="zu" aria-label="Schliessen">✕</button>
    </form>
    <div class="werkbank-raum">
      <section class="spalte-quellen" aria-label="Markierte Beiträge">
        <h3 class="klein">Aus</h3>
        <ol class="quellen" id="quellen"></ol>
      </section>
      <section class="spalte-text">
        <p class="leise hinweis">Die Montage nimmt Sätze aus den markierten Beiträgen im Wechsel, unverändert. Schreib sie hier weiter.</p>
        <textarea id="entwurf" rows="14" aria-label="Neuer Beitrag"></textarea>
        <p class="werkbank-knoepfe">
          <button class="knopf-klein" id="mischen" type="button">Neu mischen</button>
          <button class="knopf-klein" id="kopieren" type="button">Kopieren</button>
          <button class="knopf-klein" id="laden" type="button">Als Markdown sichern</button>
          <span class="leise" id="meldung" role="status"></span>
        </p>
        <div class="zuordnung" id="zuordnung"></div>
      </section>
    </div>
  </dialog>

  <script type="module" src="kunst.js?v=1"></script>
</body>
</html>
