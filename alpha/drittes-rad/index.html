  <!-- Alpha-Bereich: öffentlich erreichbar, nicht in der Sitemap, für Suchmaschinen gesperrt (REGELN §14).
       Das Dritte Rad: Zeit (Zu seiner Zeit), Form (ORNA) und Farbe (OMNA COLOR) drehen auf einer Achse. Jede der drei Karten führt weiter
       (Strophe, Konstellation, Übung); dort erscheint über ?rad=1 die Auswahl aus weiter.js (zwei Wege und «Zurück zum Start»).

       Bewusst dunkel und mystisch gestaltet (auf Wunsch, 2. Oktober 2026); die ruhige Gestaltung nach REGELN §5 gilt für ORNA, nicht für diese Seite.

<main>
  <header>
    <h1>Das Dritte Rad</h1>
    <p>Drei Ringe drehen auf einer Achse: aussen die Zeit, in der Mitte die Form, innen die Farbe. Wenn sie stehen, öffnet jede Karte einen Weg weiter, und du schreibst einen Satz, der alle drei verbindet.</p>
  </header>
  <div class="stage">
    <section class="wheelbox" aria-label="Rad">
      <div class="wheel" id="wheel" role="button" tabindex="0" aria-label="Drehen. Aussen Zeit, mittig Form, innen Farbe.">
        <svg viewBox="-120 -120 240 240" id="svg">
          <defs><radialGradient id="glow" r="1"><stop offset="0" stop-color="#c9a45c" stop-opacity=".32"/><stop offset=".62" stop-color="#6a4fc9" stop-opacity=".12"/><stop offset="1" stop-color="#6a4fc9" stop-opacity="0"/></radialGradient></defs>
          <circle r="124" fill="url(#glow)"></circle>
          <g id="sternenband" class="halo" style="transform-origin: 0 0"></g>
          <g id="tierkreis" class="halo gegen" style="transform-origin: 0 0"></g>
          <g id="schriftring" class="halo" style="transform-origin: 0 0"></g>

          <g id="siegel"></g>
          <g class="pulse" style="transform-origin: 0 0"><circle class="core" r="15"></circle><g id="sonne"></g></g>
          <path class="tick" d="M 0 -108 L 3.4 -116 L 0 -124 L -3.4 -116 Z"></path>

<script type="module">
import { symbolMarkup, SYMBOL_COUNT } from "../../portfolio/nebeneinander-nacheinander/js/symbols.js";
import { ZYKLEN, THEMEN, PERSONEN, nameVon, nrVon, ziehung, bruecke, faeden, adresse, strophe, paar, uebung } from "./engine.js";

const JEV_URL = "";   // Adresse des Proxys zu api.typesafe.ai (der Schlüssel liegt nur dort); leer = Schalter bleibt verborgen
const GOETHE = ["schön", "edel", "gut", "nützlich", "gemein", "Phantasie", "unnötig"];   // Goethe 1809: Eigenschaften je Farbe (Rot bis Violett); Phantasie steht dort für den blauvioletten Bereich
// Tierkreis: zwölf Zeichen als eigene Linien (kein Schriftzeichen, damit sie überall gleich aussehen)
const TIERKREIS = [
  "M0,4.5 V-0.5 M0,-0.5 C0,-5 -4.6,-5 -4.6,-1.8 M0,-0.5 C0,-5 4.6,-5 4.6,-1.8",
  "M-4.4,-4.6 C-4.4,-0.8 4.4,-0.8 4.4,-4.6 M2.5,2 A2.5,2.5 0 1 1 -2.5,2 A2.5,2.5 0 1 1 2.5,2",
  "M-2.6,-3.2 V3.2 M2.6,-3.2 V3.2 M-4.8,-4.4 C-2,-2.6 2,-2.6 4.8,-4.4 M-4.8,4.4 C-2,2.6 2,2.6 4.8,4.4",
  "M-1.2,-1.6 A1.5,1.5 0 1 1 -4.2,-1.6 A1.5,1.5 0 1 1 -1.2,-1.6 M4.2,1.6 A1.5,1.5 0 1 1 1.2,1.6 A1.5,1.5 0 1 1 4.2,1.6 M-4.2,-1.6 C-4,-4.8 2,-5.2 4.8,-2.4 M4.2,1.6 C4,4.8 -2,5.2 -4.8,2.4",
  "M-1.2,1.6 A1.6,1.6 0 1 1 -4.4,1.6 A1.6,1.6 0 1 1 -1.2,1.6 M-1.8,0 C-1.2,-3 0.6,-4.8 2.6,-4.8 C5,-4.8 5,-1.6 3.2,0.4 C1.8,2 2.6,4.2 4.6,4.2",
  "M-4.8,-3.4 C-3.6,-4.4 -2.6,-3.6 -2.6,-2 V3.6 M-2.6,-2 C-2.6,-4.2 0.2,-4.2 0.2,-2 V3.6 M0.2,-2 C0.2,-4.2 3,-4.2 3,-2 V1.6 C3,4.2 5,4.6 5,2.4 C5,1 3.6,0.6 2.4,2.6",
  "M-4.8,3.6 H4.8 M-4.8,0.8 H-1.8 C-1.8,-4.4 1.8,-4.4 1.8,0.8 H4.8",
  "M-4.8,-3.4 C-3.6,-4.4 -2.6,-3.6 -2.6,-2 V3.6 M-2.6,-2 C-2.6,-4.2 0.2,-4.2 0.2,-2 V3.6 M0.2,-2 C0.2,-4.2 3,-4.2 3,-2 V3.6 L5,2 M3,3.6 L4.6,4.8",
  "M-4.4,4.4 L4.4,-4.4 M0.4,-4.4 H4.4 V-0.4 M-3.4,-0.8 L0.8,3.4",
  "M-4.8,-3.6 L-3.4,-3.6 C-2.2,-3.6 -1.6,0 -0.8,3.6 L1,-3.8 C1.6,-5 3.6,-4.6 3.6,-2.6 C3.6,-0.2 1,0.6 1,3 C1,5 3.8,5 3.8,3",
  "M-4.8,-1.2 L-2.8,-3 L-0.8,-1.2 L1.2,-3 L3.2,-1.2 L4.8,-2.6 M-4.8,3 L-2.8,1.2 L-0.8,3 L1.2,1.2 L3.2,3 L4.8,1.6",
  "M-3.4,-4.6 C-0.6,-2.4 -0.6,2.4 -3.4,4.6 M3.4,-4.6 C0.6,-2.4 0.6,2.4 3.4,4.6 M-4.8,0 H4.8",
];

const $ = (id) => document.getElementById(id);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const pt = (r, d) => { const a = d * Math.PI / 180; return [+(r * Math.sin(a)).toFixed(3), +(-r * Math.cos(a)).toFixed(3)]; };
const sector = (r1, r2, a0, a1) => { const [x1, y1] = pt(r2, a0), [x2, y2] = pt(r2, a1), [x3, y3] = pt(r1, a1), [x4, y4] = pt(r1, a0); return `M${x1} ${y1} A${r2} ${r2} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 0 0 ${x4} ${y4} Z`; };
const NZ = ZYKLEN.length, NF = SYMBOL_COUNT, NC = THEMEN.length;
const SZ = 360 / NZ, SF = 360 / NF, SC = 360 / NC;
const h = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a)) n === "class" ? (e.className = v) : n === "text" ? (e.textContent = v) : e.setAttribute(n, v); e.append(...k.filter((x) => x != null)); return e; };

// ---- Sternenband (Tierkreis-Rand): feste Sterne, damit das Bild bei jedem Laden gleich ist ----
{
  let z = 7; const r = () => ((z = (z * 16807) % 2147483647) / 2147483647);
  let s = `<circle class="hair" r="119"/><circle class="hair" r="113.4"/>`;
  for (let i = 0; i < 64; i++) { const [x, y] = pt(113.9 + r() * 4.6, r() * 360); s += `<circle class="stern" cx="${x}" cy="${y}" r="${(.22 + r() * .5).toFixed(2)}" opacity="${(.5 + r() * .5).toFixed(2)}"/>`; }
  for (let i = 0; i < 12; i++) { const [x, y] = pt(116.2, i * 30 + 15); s += `<path class="stern" d="M${x} ${y - 1.9}l.45 1.45 1.45.45-1.45.45-.45 1.45-.45-1.45-1.45-.45 1.45-.45z"/>`; }
  $("sternenband").innerHTML = s;
}
// ---- Tierkreis: zwölf Felder mit den zwölf Zeichen ----
$("tierkreis").innerHTML = `<circle class="hair" r="112.6"/><circle class="hair" r="100.6"/>` +
  TIERKREIS.map((d, i) => { const [a, b] = pt(100.6, i * 30), [c, e] = pt(112.6, i * 30), [x, y] = pt(106.6, i * 30 + 15);
    return `<path class="fine" d="M${a} ${b}L${c} ${e}"/><g transform="translate(${x} ${y}) rotate(${i * 30 + 15}) scale(.56)"><path class="zeichen" d="${d}"/></g>`; }).join("");
// ---- Schriftring (Alchemie-Kreis): lateinisch Zeit, Form, Farbe ----
{
  const U = 2 * Math.PI * 97.2, T = "SOLVE ET COAGULA · TEMPUS FORMA COLOR · UT SUPRA SIC INFRA · ".repeat(2).trim();
  $("schriftring").innerHTML = `<circle class="hair" r="100.2"/><circle class="hair" r="94.4"/>
    <path id="schriftpfad" d="M0 -97.2 A97.2 97.2 0 1 1 -0.01 -97.2" fill="none"/>
    <text class="schrift"><textPath href="#schriftpfad" textLength="${(U - 2).toFixed(1)}" lengthAdjust="spacing">${T}</textPath></text>`;
}
// ---- Zeit: sieben Zyklen ----
$("zeit").innerHTML = ZYKLEN.map(([r], i) => { const [tx, ty] = pt(82, (i + .5) * SZ); return `<path class="seg zeit-seg" d="${sector(70, 94, i * SZ, (i + 1) * SZ)}"/><text class="roman" x="${tx}" y="${ty}">${r}</text>`; }).join("");
// ---- Form: vierzig Zeichen ----
$("form").innerHTML = `<circle class="form-disc" r="68"/><circle class="hair" r="68"/><circle class="hair" r="44"/>` +
  Array.from({ length: NF }, (_, i) => { const [x, y] = pt(56, (i + .5) * SF); return `<g transform="translate(${x} ${y})">${symbolMarkup(i, 4.4)}</g>`; }).join("");
// ---- Farbe: sieben Themen, dazu Goethes Eigenschaften (1809) entlang der Felder ----
$("farbe").innerHTML = THEMEN.map(([, c], i) => `<path class="seg" d="${sector(17, 42, i * SC, (i + 1) * SC)}" style="fill:${c}" opacity=".93"/>`).join("") +
  THEMEN.map((_, i) => { const [x0, y0] = pt(29.6, i * SC + 2), [x1, y1] = pt(29.6, (i + 1) * SC - 2);
    return `<path id="gp${i}" d="M${x0} ${y0} A29.6 29.6 0 0 1 ${x1} ${y1}" fill="none"/><text class="goethe"><textPath href="#gp${i}" startOffset="50%" text-anchor="middle">${GOETHE[i]}</textPath></text>`; }).join("") +
  `<circle class="hair" r="42"/><circle class="hair" r="17"/>`;
// ---- Siegel (steht still über den Ringen): Siebenstern, umgekehrtes Dreieck mit drei Zeichen ----
{
  const v = (k) => pt(94, k * 360 / 7), P = [0, 2, 4, 6, 1, 3, 5, 0].map((k) => v(k).join(",")), D = [60, 180, 300].map((a) => pt(68, a));
  const zeichen = [
    `<path class="zeichen" style="stroke-width:.5" d="M-2.2,-2.6 H2.2 L-2.2,2.6 H2.2 Z"/>`,                                                   // Sanduhr: Zeit
    `<path class="zeichen" style="stroke-width:.5" d="M-2.4,-2.4 H2.4 V2.4 H-2.4 Z M0,-2.4 L2.4,2.4 H-2.4 Z"/>`,                             // Dreieck im Quadrat: Form
    `<circle class="zeichen" style="stroke-width:.5" r="2.4"/><circle class="stern" r=".6"/>`,                                                 // Kreis mit Punkt: Farbe
  ];
  const [zeitPos, formPos, farbePos] = [D[2], D[0], D[1]];
  $("siegel").innerHTML = `<polyline class="siegel" points="${P.join(" ")}"/><polygon class="siegel" points="${D.map((p) => p.join(",")).join(" ")}"/>` +
    [zeitPos, formPos, farbePos].map((p, i) => `<g transform="translate(${p[0]} ${p[1]})"><circle class="siegel-scheibe" r="4.6"/>${zeichen[i]}</g>`).join("");
}
// ---- Sonne in der Mitte (Tierkreis): Strahlen lang und kurz im Wechsel ----
$("sonne").innerHTML = Array.from({ length: 24 }, (_, i) => { const [a, b] = pt(5.4, i * 15), [c, d] = pt(i % 2 ? 9.6 : 13, i * 15); return `<path class="hair" d="M${a} ${b}L${c} ${d}"/>`; }).join("") + `<circle r="4.2" fill="#f0d78f"/><circle class="hair" r="5.4"/>`;

// ---- Drehen ----
let busy = false, dz = 0, df = 0, dc = 0, cur = null;
const m = (x) => ((x % 360) + 360) % 360;
const land = (deg, idx, step, up) => { const t = -(idx + .2 + Math.random() * .6) * step; return up ? deg + 720 + m(t - deg) : deg - 720 - m(deg - t); };
const rest = (idx, step) => -(idx + .5) * step;
const apply = (ms) => [["zeit", dz, ms[0]], ["form", df, ms[1]], ["farbe", dc, ms[2]]].forEach(([id, d, t]) => { const g = $(id); g.style.transitionDuration = t + "ms"; g.style.transform = `rotate(${d}deg)`; });
const sperre = (an) => { busy = an; $("go").disabled = an; $("bridge").disabled = an; };

/** ziel: von bruecke() oder leer (Zufall). Die Karten erscheinen, wenn das Rad steht. */
function spin(ziel) {
  if (busy) return; sperre(true);
  const iz = ziel ? ZYKLEN.findIndex((c) => c[0] === ziel.strophe.c) : Math.floor(Math.random() * NZ);
  const i_f = ziel ? nrVon(ziel.person) : Math.floor(Math.random() * NF);
  const ic = ziel ? THEMEN.findIndex((t) => t[0] === ziel.uebung.t) : Math.floor(Math.random() * NC);
  const z = ziel || ziehung(iz, i_f, ic);
  dz = land(dz, iz, SZ, false); df = land(df, i_f, SF, true); dc = land(dc, ic, SC, false);
  apply([3200, 4400, 5600]);
  $("result").hidden = true;
  setTimeout(() => { cur = { iz, i_f, ic, s: z.strophe, c: z.paar, e: z.uebung, note: z.notiz || "" }; show(true); sperre(false); }, reduce() ? 50 : 5700);
}
const bruecken = () => spin(bruecke());

// ---- Karten ----
const ersterSatz = (t) => t.split(/(?<=[.!?])\s+/)[0];
function show(scroll) {
  const { iz, i_f, ic, s, c, e } = cur;
  try { history.replaceState(history.state, "", "?t=" + encodeURIComponent([s.s, c.id, e.id, ic, i_f].join("~"))); } catch { /* eingebettete Ansicht */ }
  // Zeit
  const verweise = [...new Set(s.r.map((r) => r.p))];
  $("cZeit").replaceChildren(
    h("small", { text: `Zeit · Zettelkasten · Zyklus ${ZYKLEN[iz][0]} · ${ZYKLEN[iz][1]}` }),
    h("h2", {}, h("a", { href: adresse.strophe(s), text: `${s.n} · ${s.t}` })),
    h("p", { class: "lead", text: s.b }),
    h("p", { class: "meta", text: "Verweise: " + verweise.join(" · ") }),
    h("span", { class: "go-on", text: "Den ganzen Text lesen" }));
  // Form
  const f = $("cForm");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", "-1.2 -1.2 2.4 2.4"); svg.setAttribute("aria-hidden", "true"); svg.innerHTML = symbolMarkup(i_f, 1);
  const titel = h("h2", {}, h("a", { href: adresse.paar(c) }));
  const a = titel.firstChild;
  [c.artistId, c.theoristId].forEach((id, k) => { if (k) a.append(" × "); const n = h("span", { text: nameVon(id) }); if (nrVon(id) === i_f) n.style.color = "var(--gold-hi)"; a.append(n); });
  f.replaceChildren(svg, h("div", {},
    h("small", { text: `Form · ORNA · das Rad zeigt ${PERSONEN[i_f].name}` }), titel,
    h("p", { class: "lead", text: ersterSatz(c.text) }), h("p", { class: "frage", text: c.question }),
    h("span", { class: "go-on", text: "Die ganze Begegnung in ORNA" })));
  // Farbe
  const col = THEMEN[ic][1];
  const dot = h("span", { class: "dot" }); dot.style.background = col; dot.style.color = col;
  $("cFarbe").replaceChildren(
    h("small", { text: "Farbe · OMNA COLOR" }),
    h("h2", {}, dot, h("a", { href: adresse.uebung(e), text: `${e.n} (${THEMEN[ic][0]})` })),
    h("div", { class: "chips" }, h("span", { class: "chip", text: `Goethe 1809: ${GOETHE[ic]}` }), h("span", { class: "chip", text: `${e.d} Min.` })),
    h("p", { class: "meta", text: "Material: " + e.m }),
    h("p", { text: e.a }),
    h("span", { class: "go-on", text: "Die Übung in OMNA COLOR" }));
  // Fäden
  const fz = faeden(s, c, e);
  $("faeden").replaceChildren(h("h3", { text: "Fäden" }),
    fz.length ? h("ul", {}, ...fz.map((t) => h("li", { text: t }))) : h("p", { class: "meta", text: "Kein Faden gefunden: ein Los. Auch das ist eine Brücke." }));
  $("note").hidden = !cur.note; $("note").textContent = cur.note || "";
  $("satz").value = ""; $("jevout").hidden = true; $("jevbox").hidden = !JEV_URL;
  $("result").hidden = false;
  if (scroll) $("result").scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: matchMedia("(min-width: 800px)").matches ? "nearest" : "start" });
}

// ---- Rückkehr (Zurück-Taste, Link): ?t=<Strophe>~<Konstellation>~<Übung>~<Farbe>~<Zeichen> stellt Ringe und Karten wieder her ----
(function restore() {
  const raw = new URLSearchParams(location.search).get("t"); if (!raw) return;
  const [sl, pid, eid, ic, i_f] = raw.split("~");
  const s = strophe(sl), c = paar(pid), e = uebung(eid), iz = s ? ZYKLEN.findIndex((x) => x[0] === s.c) : -1;
  if (!s || !c || !e || !(ic >= 0 && ic < NC) || !(i_f >= 0 && i_f < NF) || THEMEN[+ic][0] !== e.t) return;
  cur = { iz, i_f: +i_f, ic: +ic, s, c, e, note: "" };
  dz = rest(iz, SZ); df = rest(+i_f, SF); dc = rest(+ic, SC);
  apply([0, 0, 0]); show(false);
})();

$("go").addEventListener("click", () => spin());
$("bridge").addEventListener("click", bruecken);
$("again").addEventListener("click", () => { window.scrollTo({ top: 0, behavior: reduce() ? "auto" : "smooth" }); spin(); });
$("wheel").addEventListener("click", () => spin());
$("wheel").addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); spin(); } });

$("copy").addEventListener("click", async () => {
  if (!cur) return;
  const txt = ["Das Dritte Rad", `Zeit: ${cur.s.n} · ${cur.s.t}`, `Form: ${nameVon(cur.c.artistId)} × ${nameVon(cur.c.theoristId)}`, `Farbe: ${cur.e.n} (${THEMEN[cur.ic][0]})`, "", $("satz").value.trim()].join("\n");
  try { await navigator.clipboard.writeText(txt); $("copy").textContent = "Kopiert"; setTimeout(() => ($("copy").textContent = "Karte kopieren"), 1800); } catch { $("copy").textContent = "Kopieren nicht möglich"; }
});

// Gegenrad (freiwillig): sendet erst nach Haken und nur beim Verlassen des Satzfelds
$("satz").addEventListener("change", async () => {
  if (!JEV_URL || !$("jev").checked || !$("satz").value.trim() || !cur) return;
  const out = $("jevout"); out.hidden = false; out.textContent = "Gegenrad denkt …";
  try {
    const r = await fetch(JEV_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ satz: $("satz").value.trim(), strophe: cur.s.t, text: cur.s.b, zyklen: ZYKLEN.map((x) => x[1]) }) });
    if (!r.ok) throw 0;
    const j = await r.json();
    out.textContent = `Nähe zur Strophe: ${Math.round(j.score * 100)} % · passt am ehesten zu Zyklus ${j.zyklus}`;
  } catch { out.textContent = "Das Gegenrad ist gerade nicht erreichbar. Dein Satz bleibt, wie er ist."; }
});
</script>
