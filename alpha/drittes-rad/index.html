 jeweils nur drei sichtbare Merkmale.","m":"Objekt, Papier"},{"n":"Fünf Blickwinkel","t":"Form","a":"Betrachte denselben Gegenstand von oben, unten, vorne, hinten und schräg und zeichne je eine 30-Sekunden-Silhouette.","m":"Objekt, Papier, Stift"},{"n":"Fünf Helligkeiten","t":"Farbe","a":"Suche fünf Flächen von sehr hell bis sehr dunkel und ordne sie als Werteskala.","m":"Umgebung, Kamera/Papier"},{"n":"Geräuschlinien","t":"Linie","a":"Höre zwei Minuten lang und sammle fünf Geräusche als unterschiedliche Linien, ohne die Geräuschquelle zu zeichnen.","m":"Papier, Stift"},{"n":"Tasten ohne Schauen","t":"Raum & Material","a":"Ertaste drei ungefährliche kleine Gegenstände mit geschlossenen Augen und zeichne danach nur Form und Textur aus der Erinnerung.","m":"3 sichere Gegenstände, Papier"},{"n":"Papiersorten","t":"Raum & Material","a":"Sammle fünf Papiere und ordne sie nach Steifigkeit, Oberfläche und Lichtdurchlässigkeit.","m":"verschiedene Papiere"},{"n":"Natur / gemacht","t":"Form","a":"Sammle je fünf natürliche und hergestellte Formen und suche danach zwei, die sich formal stark ähneln.","m":"Umgebung, Kamera/Skizzenbuch"},{"n":"Farbgedächtnis","t":"Farbe","a":"Betrachte 20 Sekunden lang eine Farbe, wende dich ab und mische oder wähle aus mehreren Tönen die erinnerte Farbe.","m":"Farbmaterial oder digitale Farbwahl"},{"n":"Detail vergrößern","t":"Form","a":"Wähle einen sehr kleinen Ausschnitt eines Gegenstands oder Bildes und vergrößere ihn, bis er das ganze Format füllt.","m":"Vorlage, Papier, Zeichenmittel"},{"n":"Komplexes verkleinern","t":"Form","a":"Wähle ein Motiv mit vielen Einzelteilen (zum Beispiel einen Baum, ein Gesicht oder ein Foto). Zeichne es dreimal nacheinander mit immer weniger Formen: zuerst aus zehn Formen, dann aus fünf, dann aus drei. Jede Fassung entsteht aus der vorherigen, indem du Formen weglässt oder zusammenfasst.","m":"Vorlage, Papier"},{"n":"Drehen","t":"Form","a":"Drehe eine vorhandene Zeichnung um 90°, 180° und 270° und ergänze in jeder Lage genau eine Form.","m":"Zeichnung, Stift"},{"n":"Spiegeln","t":"Form","a":"Übertrage eine einfache Komposition gespiegelt und verändere anschließend nur ein Element.","m":"Vorlage, Papier"},{"n":"Neu rahmen","t":"Form","a":"Wähle aus einer vorhandenen Arbeit drei unterschiedliche Ausschnitte und behandle jeden als eigenständige Komposition.","m":"eigene Arbeit, Papierrahmen/Kamera"},{"n":"Figur wird Grund","t":"Form","a":"Zeichne eine einfache Form und gestalte anschließend nicht die Form, sondern nur den Raum um sie herum.","m":"Papier, Zeichen-/Farbmittel"},{"n":"Palette tauschen","t":"Farbe","a":"Übertrage eine kleine bestehende Arbeit mit vollständig anderer Farbpalette, ohne Formen zu verändern.","m":"Vorlage, Farbmittel"},{"n":"Gleiche Farbe, andere Nachbarschaft","t":"Farbe","a":"Setze zwei identische Farbfelder auf deutlich verschiedene Hintergründe und suche Kontexte, in denen sie möglichst verschieden erscheinen.","m":"Farbpapier oder digitale Flächen"},{"n":"Nachbild","t":"Farbe","a":"Betrachte längere Zeit eine kräftige Farbfläche und wechsle dann auf eine helle neutrale Fläche. Beobachte das entstehende Nachbild.","m":"Farbfläche, helle Fläche"},{"n":"Farbgradient","t":"Farbe","a":"Erzeuge zwischen zwei gewählten Farben mindestens sieben Zwischenschritte – gemischt oder durch Auswahl vorhandener Töne.","m":"Farbe/Farbpapier oder digital"},{"n":"Vier Farben – vier Welten","t":"Farbe","a":"Verwende dieselben vier Farben in vier kleinen Kompositionen, ändere nur Menge und Platzierung.","m":"vier Farben/Farbpapiere"},{"n":"Bild als Farbfelder","t":"Form","a":"Wähle ein Bild und übertrage es nur als wenige ausgeschnittene Farb- und Formflächen, ohne Details nachzuzeichnen.","m":"Bildvorlage, Farbpapier, Schere"},{"n":"Drei Abstraktionsstufen","t":"Form","a":"Zeichne einen Gegenstand beobachtend, vereinfache ihn in einer zweiten Version und reduziere ihn in einer dritten auf Zeichen/Flächen.","m":"Objekt, Papier"},{"n":"Fünf Formen reichen","t":"Form","a":"Übersetze ein Motiv in höchstens fünf ausgeschnittene Formen.","m":"Papier, Schere, Kleber"},{"n":"Linie wird Fläche","t":"Form","a":"Nimm eine Linienzeichnung und verwandle jede geschlossene Zone in eine ausgeschnittene oder gemalte Fläche.","m":"Linienzeichnung, Papier/Farbe"},{"n":"2D wird 3D","t":"Raum & Material","a":"Zeichne eine einfache Linie und baue sie anschließend mit Draht, Schnur oder Papierstreifen als räumliche Linie nach.","m":"Papier, Draht/Schnur/Papierstreifen"},{"n":"Eine Fläche wird Raum","t":"Raum & Material","a":"Verwandle ein einziges Blatt durch Falten, Schneiden und Stecken in eine stehende dreidimensionale Struktur.","m":"ein Blatt Papier, Schere"},{"n":"Material imitiert Material","t":"Raum & Material","a":"Versuche mit einem Material die Oberflächenwirkung eines anderen zu erzeugen, z. B. Papier wie Rinde oder Metall wie Stoff erscheinen zu lassen.","m":"2 Materialien als Referenz, 1 Arbeitsmaterial"},{"n":"Gegenqualität","t":"Raum & Material","a":"Nimm ein Material und gestalte es so, dass es möglichst gegensätzlich zu seiner üblichen Wirkung erscheint: weich/hart, leicht/schwer, ruhig/unruhig.","m":"ein Material"},{"n":"Zerschneiden und neu ordnen","t":"Form","a":"Zerschneide eine eigene Zeichnung in mindestens acht Teile und ordne sie zu einer neuen Komposition.","m":"eigene Zeichnung, Schere"},{"n":"Zufallsordnung","t":"Zufall","a":"Lass kleine Papierformen fallen, fixiere ihre zufällige Lage zunächst gedanklich und verändere anschließend nur drei Positionen bewusst.","m":"Papierformen"},{"n":"Automatische Linie – bewusste Form","t":"Zufall","a":"Führe eine Linie schnell und ohne Motivplanung über das Blatt. Suche danach zwei interessante Bereiche und arbeite nur dort weiter.","m":"Papier, Stift"},{"n":"Blind beginnen, sehend fortsetzen","t":"Zufall","a":"Beginne eine Zeichnung ohne aufs Papier zu schauen. Danach sieh hin und ergänze nur drei bewusste Eingriffe.","m":"Objekt, Papier, Stift"},{"n":"Abdruck und Spiegelung","t":"Form","a":"Erzeuge einen einfachen Druck oder Abdruck und vergleiche ihn mit der Druckplatte bzw. Ausgangsform. Ergänze im Abdruck eine neue Form.","m":"Schaumplatte/Stempel/Monoprintmaterial"},{"n":"Frottage wird Landschaft","t":"Raum & Material","a":"Erzeuge drei Frottagen verschiedener Oberflächen, schneide sie aus und kombiniere sie zu einer neuen nichtgegenständlichen Fläche.","m":"Papier, weicher Stift, Oberflächen, Schere"},{"n":"Ein Motiv – drei Medien","t":"Form","a":"Setze dasselbe einfache Motiv als Zeichnung, Collage und räumliche Miniatur um.","m":"Papier, Stift, Collagematerial, einfaches Baumaterial"},{"n":"Transparente Schichten","t":"Form","a":"Zeichne oder male zwei einfache Strukturen auf transparente/semitransparente Träger und untersuche verschiedene Überlagerungen.","m":"Transparentpapier/Folie, Stifte/Farbe"},{"n":"Raster verzerren","t":"Form","a":"Übertrage ein einfaches Motiv mit Hilfe eines Rasters und verändere im Zielraster Breite oder Höhe einzelner Felder.","m":"Vorlage, Papier, Lineal"},{"n":"Drei Zustände","t":"Zeit & Körper","a":"Gestalte dieselbe Form als vorher – während – nachher, ohne eine Geschichte zu erklären.","m":"Papier, Zeichen-/Farbmittel"},{"n":"Rest wird Ausgangspunkt","t":"Zufall","a":"Nimm einen Verschnitt, Farbfleck, Kleberest oder Papierrest aus einer früheren Arbeit und mache ihn zum Ausgangspunkt einer neuen Miniatur.","m":"Materialreste"},{"n":"Drei Farben","t":"Farbe","a":"Gestalte eine kleine Komposition mit genau drei Farben. Kein vierter Ton darf hinzukommen.","m":"Farbmittel/Farbpapier"},{"n":"Nur eine Form","t":"Form","a":"Wähle eine einzige Grundform und entwickle daraus eine Komposition nur durch Wiederholung, Größe, Drehung und Überlagerung.","m":"Papier, Schere oder Zeichenmittel"},{"n":"Linienkomposition","t":"Linie","a":"Baue eine Komposition nur aus Linien und entscheide bewusst über Richtung, Abstand, Schichtung und Dichte.","m":"Papier, Stifte/Klebeband"},{"n":"Geometrisch oder organisch","t":"Form","a":"Entscheide dich vor Beginn: nur geometrische oder nur organische Formen. Halte die Regel bis zum Ende.","m":"Papier, Zeichen-/Farbmittel"},{"n":"Offen oder geschlossen","t":"Form","a":"Arbeite ausschließlich mit offenen oder ausschließlich mit geschlossenen Formen.","m":"Papier, Stift"},{"n":"Symmetrie mit einem Fehler","t":"Form","a":"Baue eine symmetrische Komposition und durchbrich sie an genau einer Stelle.","m":"Papier, Zeichen-/Collagematerial"},{"n":"Asymmetrisches Gleichgewicht","t":"Form","a":"Verteile drei sehr unterschiedliche Formen so, dass die Komposition ausgewogen wirkt, ohne symmetrisch zu sein.","m":"Papier, Formen/Objekte"},{"n":"Mitte vermeiden","t":"Form","a":"Gestalte eine Komposition, in der kein wichtiges Element die geometrische Mitte berührt.","m":"Papier, beliebiges Material"},{"n":"Ein Hauptdarsteller","t":"Form","a":"Entscheide, welches Element eindeutig dominant sein soll, und ordne alle anderen diesem unter.","m":"Papier, Formen/Farbe"},{"n":"Kippfigur","t":"Form","a":"Baue mit zwei Formen oder zwei Tonwerten eine Figur-Grund-Situation, bei der beide Lesarten möglich bleiben.","m":"Papier, Schwarz/Weiß"},{"n":"Halb leer","t":"Form","a":"Lass mindestens die Hälfte des Formats vollständig ungestaltet und konzentriere alle Eingriffe auf den Rest.","m":"Papier, beliebiges Medium"},{"n":"Dichtegradient","t":"Form","a":"Erzeuge einen kontinuierlichen Übergang von sehr dicht zu fast leer, ohne die Art der Elemente zu wechseln.","m":"Papier, Stift/Formelemente"},{"n":"Rhythmus","t":"Zeit & Körper","a":"Wiederhole ein Element mindestens zwölfmal und entscheide über einen klaren visuellen Rhythmus.","m":"Papier, Stempel/Formen"},{"n":"Regel wird unregelmäßig","t":"Zeit & Körper","a":"Beginne mit einer streng regelmäßigen Folge und lasse sie schrittweise unregelmäßig werden.","m":"Papier, Formelemente"},{"n":"Drei Größen","t":"Form","a":"Verwende eine Form ausschließlich in drei festgelegten Größen: klein, mittel, groß.","m":"Papier, Formen"},{"n":"Proportion 1–2–4","t":"Form","a":"Arbeite mit drei Elementgrößen im ungefähren Verhältnis 1:2:4 und finde eine ausgewogene Verteilung.","m":"Papier, Formen"},{"n":"Nur zwei Materialien","t":"Raum & Material","a":"Wähle zwei Materialien mit deutlich unterschiedlichen Eigenschaften und erlaube dir kein drittes.","m":"2 Materialien"},{"n":"Ohne Klebstoff","t":"Raum & Material","a":"Baue eine kleine stabile Struktur ohne Klebstoff. Verbindungen dürfen nur durch Stecken, Falten, Klemmen, Druck oder Balance entstehen.","m":"Papier/Karton/geeignete Materialien"},{"n":"Nur Balance und Druck","t":"Raum & Material","a":"Verbinde mehrere Teile so, dass sie ausschließlich durch Eigengewicht, Druck oder Spannung zusammenhalten.","m":"geeignete leichte Materialien"},{"n":"Eine klare Idee","t":"Form","a":"Nimm nur ein Material und formuliere vor Beginn eine einzige formale Idee, z. B. 'aufsteigen', 'fächern', 'verdichten'. Alles muss dieser Idee dienen.","m":"ein Material"},{"n":"Zehn Schnitte","t":"Form","a":"Du hast genau zehn Schnitte, um aus einem Blatt eine eigenständige Komposition zu entwickeln.","m":"Papier, Schere"},{"n":"Keine Gerade","t":"Form","a":"Gestalte eine klar gegliederte Komposition, ohne eine einzige gerade Linie zu verwenden.","m":"Papier, Stift/Farbe"},{"n":"Keine Kurve","t":"Form","a":"Gestalte eine bewegte Komposition ausschließlich mit Geraden und Winkeln.","m":"Papier, Stift/Farbe"},{"n":"Eine durchgehende Linie","t":"Linie","a":"Gestalte ein ganzes Format mit einer einzigen ununterbrochenen Linie. Überkreuzungen sind erlaubt.","m":"Papier, Stift"},{"n":"Nur Schwarz und Weiß","t":"Raum & Material","a":"Erzeuge mit ausschließlich Schwarz und Weiß eine Komposition mit möglichst vielfältiger räumlicher Wirkung.","m":"Papier, schwarze Farbe/Stift"},{"n":"Fünf Grauwerte","t":"Farbe","a":"Lege fünf klar unterscheidbare Grauwerte fest und verwende ausschließlich diese.","m":"Papier, Bleistift/Grauwerte"},{"n":"Komplementärpaar","t":"Farbe","a":"Arbeite ausschließlich mit einem Komplementärpaar plus Weiß/Grund.","m":"Farbmittel"},{"n":"Nachbarfarben","t":"Farbe","a":"Wähle drei bis fünf benachbarte Farbtöne und erzeuge Tiefe ausschließlich durch Menge, Helligkeit und Position.","m":"Farbmittel"},{"n":"Gleiche Farben – ungleiche Mengen","t":"Farbe","a":"Verwende vier Farben; eine darf nur sehr wenig, eine sehr viel, zwei mittel vorkommen. Verändere anschließend nur die Mengenverhältnisse.","m":"vier Farben"},{"n":"Stoppregel","t":"Zufall","a":"Lege vor Beginn eine eindeutige Stoppregel fest, z. B. nach 20 Strichen, 12 Teilen oder 8 Minuten. Beende die Arbeit dann wirklich.","m":"beliebiges Material"},{"n":"Blindkontur","t":"Linie","a":"Wähle einen Gegenstand. Folge seiner Kontur sehr langsam mit den Augen und zeichne gleichzeitig, ohne aufs Papier zu sehen und ohne den Stift abzusetzen.","m":"Objekt, Papier, Stift"},{"n":"Langsame Kontur","t":"Linie","a":"Zeichne die Kontur eines Gegenstands so langsam, dass Auge und Hand möglichst gleichzeitig entlangwandern. Auf das Papier darfst du schauen.","m":"Objekt, Papier, Stift"},{"n":"30-Sekunden-Geste","t":"Zeit & Körper","a":"Zeichne ein Objekt oder eine Pose in 30 Sekunden nur als Bewegungs- und Richtungsstruktur. Wiederhole fünfmal.","m":"Objekt/Pose, Papier, Stift"},{"n":"Ungewohnte Hand","t":"Linie","a":"Zeichne dasselbe einfache Motiv zuerst mit der gewohnten, dann mit der ungewohnten Hand.","m":"Objekt, Papier, Stift"},{"n":"Ohne Absetzen","t":"Linie","a":"Zeichne fünf Minuten lang, ohne den Stift vom Papier zu heben. Motivwahl ist frei.","m":"Papier, Stift"},{"n":"Große Schulterlinie","t":"Zeit & Körper","a":"Arbeite auf möglichst großem Papier und zeichne Linien aus Schulter und Arm statt aus Fingern und Handgelenk.","m":"großes Papier, weiches Zeichenmittel"},{"n":"Druckskala","t":"Farbe","a":"Erzeuge mit demselben Stift zehn Linien von möglichst leicht bis möglichst kräftig, ohne die Linienbreite bewusst zu ändern.","m":"Papier, Bleistift/Kreide"},{"n":"Ein Pinsel – fünf Spuren","t":"Linie","a":"Finde mit demselben Pinsel fünf möglichst unterschiedliche Spuren: Spitze, Seite, trocken, nass, gedreht usw.","m":"Pinsel, Farbe, Papier"},{"n":"Werkzeugtausch","t":"Linie","a":"Trage Farbe nicht mit einem Pinsel, sondern nacheinander mit Karte, Schwamm, Stäbchen oder anderem ungefährlichem Werkzeug auf.","m":"Farbe, Papier, alternative Werkzeuge"},{"n":"Finger als Werkzeug","t":"Raum & Material","a":"Erzeuge eine kleine Tonwert- oder Texturfläche ausschließlich mit Fingerabdrücken.","m":"ungiftige Farbe/Stempelkissen, Papier"},{"n":"Durchkratzen","t":"Raum & Material","a":"Lege zwei unterschiedlich gefärbte Schichten an und kratze nach dem Trocknen Linien oder Flächen aus der oberen Schicht.","m":"geeignete ungiftige Farben/Kreiden, Kratzwerkzeug"},{"n":"Schwerkraftspur","t":"Zufall","a":"Setze flüssige Farbe am Rand einer Fläche an und lass ausschließlich die Schwerkraft die erste Bewegung bestimmen. Drehe den Träger höchstens dreimal.","m":"flüssige Farbe/Tinte, Papier"},{"n":"Punkt für Punkt","t":"Form","a":"Baue eine Form oder Fläche ausschließlich aus Punkten auf und variiere nur Abstand, Größe und Dichte.","m":"Papier, Stifte/Farbe"},{"n":"Schaumplattendruck","t":"Form","a":"Ritze eine einfache Form in weiches Druckmaterial, rolle Farbe auf und drucke mindestens zwei Varianten.","m":"Schaumdruckplatte, Stift, Druckfarbe, Papier, Walze/Farbroller"},{"n":"Gemaltes Papier collagieren","t":"Form","a":"Male zunächst mehrere Papierflächen unterschiedlich, schneide sie danach in Formen und setze daraus eine neue Komposition zusammen.","m":"Papier, Farbe, Schere, Kleber"},{"n":"Geschnittene Formen","t":"Form","a":"Erzeuge eine Komposition hauptsächlich durch geschnittene statt gezeichnete Formen. Verschiebe sie mehrfach, bevor du fixierst.","m":"Farbpapier, Schere, Kleber optional"},{"n":"Kartenwebrahmen","t":"Zeit & Körper","a":"Baue aus Karton einen kleinen einfachen Webrahmen und erzeuge ein Muster mit wenigen Fäden oder Papierstreifen.","m":"Karton, Faden/Papierstreifen, Schere"},{"n":"Salzspur","t":"Linie","a":"Zeichne oder ordne Linien und Flächen mit Salz auf einem dunklen Untergrund und verändere sie mit einfachen Werkzeugen.","m":"Salz, dunkles Papier/Tablett, Löffel/Karte"},{"n":"Papier steht","t":"Raum & Material","a":"Verwandle ein einziges Blatt durch Falten, Einschnitte und Stecken in eine selbststehende Form. Kein Kleber.","m":"Papier/Karton, Schere"},{"n":"Papier verzahnen","t":"Raum & Material","a":"Schneide mehrere Schlitze in Papierformen und verbinde sie durch Ineinanderstecken zu einer räumlichen Struktur.","m":"Papier/Karton, Schere"},{"n":"Ton: drücken, rollen, ziehen","t":"Raum & Material","a":"Erzeuge aus einem Stück Ton oder Knete mindestens sechs unterschiedliche Spuren bzw. Formveränderungen, ohne etwas Bestimmtes darstellen zu wollen.","m":"Ton/Knete, Unterlage"},{"n":"Bauen – verändern – bauen","t":"Form","a":"Baue aus Ton/Knete eine einfache Form, verändere sie radikal und entwickle aus dem veränderten Zustand eine zweite stabile Form.","m":"Ton/Knete"},{"n":"Fundstück-Assemblage","t":"Raum & Material","a":"Verbinde fünf gefundene ungefährliche Materialien zu einer kleinen Struktur. Mindestens zwei Verbindungen müssen ohne Kleber funktionieren.","m":"Fundmaterialien, optional Schnur/Klammern"},{"n":"Frottage-Serie","t":"Raum & Material","a":"Erzeuge von derselben Oberfläche vier Frottagen mit unterschiedlichen Stiften, Druckstärken oder Papieren.","m":"Papier, weiche Zeichenmittel, Oberfläche"},{"n":"Monoprint aus Restfarbe","t":"Linie","a":"Verteile dünn Farbe auf einer glatten ungefährlichen Platte, zeichne/entferne darin Spuren und drucke einmalig auf Papier.","m":"ungiftige Farbe, glatte Platte, Papier"},{"n":"Schablone: positiv / negativ","t":"Form","a":"Schneide eine einfache Schablone und nutze sowohl die ausgeschnittene Form als auch das Loch für zwei gegensätzliche Abdrücke.","m":"Papier/Karton, Schere, Farbe"},{"n":"Nass / trocken","t":"Raum & Material","a":"Erzeuge mit derselben Farbe je eine Fläche nass-in-nass und eine mit möglichst trockenem Werkzeug. Vergleiche die Ränder und Texturen.","m":"Aquarell/Gouache o. Ä., Papier, Pinsel"},{"n":"Schicht über Schicht","t":"Farbe","a":"Lege drei transparente oder halbtransparente Schichten übereinander und plane, wo neue Mischfarben oder Verdichtungen entstehen.","m":"Lasur/Farbfolie/Transparentpapier"},{"n":"30 Sekunden – 3 Minuten – 10 Minuten","t":"Zeit & Körper","a":"Setze dasselbe Motiv dreimal um: sehr kurz, mittel und langsam. Verwende dasselbe Werkzeug.","m":"Objekt, Papier, Zeichenmittel"},{"n":"Zwölf Variationen","t":"Form","a":"Erzeuge zwölf sehr kleine Versionen derselben Ausgangsform; jede darf sich nur in einem Merkmal verändern.","m":"Papier, Zeichen-/Collagemittel"},{"n":"Nur sehen","t":"Symbol & Würdigung","a":"Betrachte deine Arbeit eine Minute und notiere fünf rein sichtbare Tatsachen, ohne Bedeutung oder Bewertung.","m":"eigene Arbeit, Papier optional"},{"n":"Zweites Sehen","t":"Zeit & Körper","a":"Notiere beim ersten Blick fünf Dinge. Schau 30 Sekunden weiter und finde danach fünf neue Beobachtungen, die vorher fehlten.","m":"eigene Arbeit"},{"n":"Farbe – Form – Linie","t":"Symbol & Würdigung","a":"Beschreibe die Arbeit nacheinander nur unter drei Aspekten: Farben, Formen, Linien.","m":"eigene Arbeit"},{"n":"Erster Blick / zweiter Blick","t":"Symbol & Würdigung","a":"Halte deinen ersten Eindruck in drei Wörtern fest. Betrachte die Arbeit länger und ersetze danach mindestens eines der Wörter.","m":"eigene Arbeit"},{"n":"Überraschendste Stelle","t":"Zufall","a":"Finde eine Stelle, die nicht vollständig geplant war und dennoch wichtig geworden ist. Markiere oder fotografiere sie.","m":"eigene Arbeit, Kamera optional"},{"n":"Blickmagnet","t":"Symbol & Würdigung","a":"Beobachte, wohin dein Blick zuerst geht und wohin er danach wandert. Zeichne den Blickweg als Pfeile auf einer Kopie oder im Kopf nach.","m":"eigene Arbeit, optional Foto/Kopie"},{"n":"Drei Distanzen","t":"Symbol & Würdigung","a":"Betrachte die Arbeit nah, aus normaler Distanz und möglichst weit entfernt. Notiere je eine Veränderung.","m":"eigene Arbeit"},{"n":"Gedreht betrachten","t":"Form","a":"Drehe die Arbeit um 90°, 180° und 270°, ohne sie zu verändern.","m":"eigene Arbeit"},{"n":"Eigenständiger Ausschnitt","t":"Symbol & Würdigung","a":"Suche mit einem Rahmen den stärksten kleinen Ausschnitt der Arbeit und dokumentiere ihn separat.","m":"eigene Arbeit, Papierrahmen/Kamera"},{"n":"Titel danach","t":"Symbol & Würdigung","a":"Gib der Arbeit erst nach genauer Betrachtung einen kurzen Titel von höchstens vier Wörtern.","m":"eigene Arbeit"},{"n":"Drei Verben","t":"Zeit & Körper","a":"Beschreibe die Arbeit mit drei Verben statt mit Eigenschaftswörtern.","m":"eigene Arbeit"},{"n":"Fünf Formwörter","t":"Form","a":"Finde fünf präzise formale Wörter, z. B. dicht, offen, geknickt, transparent, schwer – ohne 'schön' oder 'hässlich'.","m":"eigene Arbeit"},{"n":"Wie wurde es gemacht?","t":"Symbol & Würdigung","a":"Betrachte die fertige Arbeit, als hättest du sie nicht selbst gemacht, und rekonstruiere fünf sichtbare Herstellungsschritte.","m":"eigene Arbeit"},{"n":"Drei Entscheidungen","t":"Zufall","a":"Identifiziere drei Stellen, an denen eine konkrete Entscheidung sichtbar ist: Farbe, Schnitt, Richtung, Ende, Überlagerung …","m":"eigene Arbeit"},{"n":"Drei Zufälle","t":"Zufall","a":"Finde drei Stellen, die nicht vollständig geplant waren. Entscheide bei jeder: behalten, verändern oder neutral.","m":"eigene Arbeit"},{"n":"Regelprüfung","t":"Form","a":"Erinnere dich an die zentrale Einschränkung der Übung und suche drei Stellen, an denen sie die Arbeit sichtbar geprägt hat.","m":"eigene Arbeit"},{"n":"Kontrastkarte","t":"Symbol & Würdigung","a":"Suche die drei stärksten Kontraste in der Arbeit und benenne jeweils, worin sie bestehen.","m":"eigene Arbeit"},{"n":"Rhythmuskarte","t":"Zeit & Körper","a":"Suche Wiederholungen und markiere gedanklich oder auf einer Kopie ihre Folge und Unterbrechungen.","m":"eigene Arbeit, optional Kopie"},{"n":"Figur-Grund-Test","t":"Form","a":"Benenne, was du zuerst als Figur und was als Hintergrund liest. Versuche danach, diese Lesart bewusst umzukehren.","m":"eigene Arbeit"},{"n":"Farbhierarchie","t":"Farbe","a":"Ordne alle verwendeten Farben danach, wie stark sie deine Aufmerksamkeit beanspruchen – nicht danach, wie viel Fläche sie einnehmen.","m":"eigene Arbeit"},{"n":"Fünf-Werte-Thumbnail","t":"Farbe","a":"Übertrage die Arbeit winzig klein nur in fünf Hell-Dunkel-Werten.","m":"eigene Arbeit, Papier, Bleistift"},{"n":"Fünf Linien","t":"Linie","a":"Reduziere die Komposition nachträglich auf höchstens fünf Richtungs- oder Struktur-Linien.","m":"eigene Arbeit, Papier"},{"n":"Zwei Versionen vergleichen","t":"Symbol & Würdigung","a":"Lege zwei Varianten derselben Aufgabe nebeneinander und notiere drei formale Unterschiede und eine unerwartete Gemeinsamkeit.","m":"zwei Arbeiten"},{"n":"Nur eine Änderung","t":"Symbol & Würdigung","a":"Wähle nach der Betrachtung genau eine Veränderung, die du noch vornehmen darfst. Alles andere bleibt.","m":"eigene Arbeit, Material"},{"n":"Ein Element wegdenken","t":"Form","a":"Stell dir vor, ein Element verschwände vollständig. Welches Weglassen würde die Komposition am stärksten verändern?","m":"eigene Arbeit"},{"n":"Ein Element verdoppeln","t":"Raum & Material","a":"Wähle ein Element und stell dir vor, es wäre ein zweites Mal vorhanden. Wo müsste es liegen, damit die Arbeit nicht kippt?","m":"eigene Arbeit"},{"n":"Ort wählen","t":"Symbol & Würdigung","a":"Probiere mindestens drei Orte oder Höhen aus, an denen die Arbeit liegen, stehen oder hängen könnte.","m":"eigene Arbeit"},{"n":"Dokumentationsblick","t":"Symbol & Würdigung","a":"Fotografiere die Arbeit aus drei leicht unterschiedlichen Distanzen oder Winkeln und wähle die sachlichste Dokumentation.","m":"eigene Arbeit, Kamera"},{"n":"Rekonstruktionsanweisung","t":"Form","a":"Schreibe eine kurze sachliche Anleitung, mit der jemand die sichtbare Struktur deiner Arbeit nachbauen könnte, ohne das Original zu sehen.","m":"eigene Arbeit, Papier"},{"n":"Zurück in die Sammlung","t":"Zeit & Körper","a":"Wähle aus der fertigen Arbeit ein Detail, eine Farbe, eine Linie oder ein Materialmerkmal, das zum Ausgangspunkt der nächsten Übung werden könnte.","m":"eigene Arbeit"},{"n":"Farbe und Wort getrennt","t":"Farbe","a":"Wähle drei Farben aus deiner Umgebung. Notiere zu jeder zuerst drei rein sichtbare Merkmale und erst danach drei kulturelle oder persönliche Assoziationen.","m":"Umgebung oder Farbmaterial, Papier"},{"n":"Farbassoziationen sammeln","t":"Farbe","a":"Wähle ein neutrales Wort wie 'laut', 'nah', 'kühl' oder 'feierlich' und sammle fünf Farben, die für dich dazu passen. Suche danach bewusst eine sechste, die der Erwartung widerspricht.","m":"Farbmaterial oder digitale Farbauswahl"},{"n":"Symbolfundstücke","t":"Symbol & Würdigung","a":"Finde fünf Zeichen oder Symbole in deiner Umgebung. Zeichne sie ohne Erklärung ab und notiere anschließend je zwei mögliche Lesarten aus unterschiedlichen Kontexten.","m":"Umgebung, Papier, Stift"},{"n":"Objekte ohne Funktion","t":"Form","a":"Wähle fünf Alltagsgegenstände ausschließlich nach Form, Material oder Oberfläche – ihre praktische Funktion soll bei der Auswahl keine Rolle spielen.","m":"Alltagsgegenstände"},{"n":"Materialeigenschaften statt Namen","t":"Raum & Material","a":"Sammle sechs ungefährliche Materialien und beschreibe sie nur durch Eigenschaften wie biegsam, dicht, federnd, stumpf, kühl, saugend oder brüchig.","m":"verschiedene ungefährliche Materialien"},{"n":"Bewegungsqualitäten sehen","t":"Zeit & Körper","a":"Beobachte fünf alltägliche Bewegungen und ordne jeder eine neutrale Qualität zu: fließend, kantig, wirbelnd, leicht, langsam oder eine eigene Bezeichnung.","m":"Umgebung, Notiz/Skizzenbuch"},{"n":"Farbe gegen Erwartung","t":"Farbe","a":"Nimm eine Farbe, die du spontan mit einer bestimmten Eigenschaft verbindest, und gestalte dieselbe Eigenschaft anschließend mit einer gegensätzlichen Farbe.","m":"Farbmittel"},{"n":"Impuls und Antwort","t":"Linie","a":"Setze ohne Vorzeichnung eine erste Spur. Betrachte sie kurz und füge nur eine zweite Spur hinzu, die auf die erste reagiert. Wiederhole diesen Wechsel zehnmal.","m":"Papier, Farb- oder Zeichenmittel"},{"n":"Schnelles Blatt wird Ausgangsmaterial","t":"Zufall","a":"Erzeuge in zwei Minuten eine ungeplante Farbfläche. Schneide danach einen interessanten Bereich heraus und entwickle nur diesen langsam weiter.","m":"Papier, Farbe, grober Pinsel, Schere"},{"n":"Ein Symbol – drei Kontexte","t":"Symbol & Würdigung","a":"Wähle ein einfaches Symbol oder Zeichen und setze es in drei völlig verschiedene bildnerische Umgebungen. Die Form des Symbols bleibt gleich.","m":"Papier, Zeichen-/Collagematerial"},{"n":"Zufallslinie wird Maß","t":"Zufall","a":"Lass eine Schnur aus geringer Höhe auf Papier fallen, zeichne ihre Lage nach und verwende diese zufällige Kurve anschließend als wiederkehrendes Maß oder Raster für eine Komposition.","m":"Schnur, Papier, Stift"},{"n":"Weich wird konstruktiv","t":"Raum & Material","a":"Nimm ein weiches oder flexibles Material und versuche, daraus eine möglichst klare, stabile geometrische Form zu erzeugen – ohne das Material dauerhaft zu verhärten.","m":"Stoff, Filz, Schnur, Papier o. Ä."},{"n":"Erste Entscheidung gilt","t":"Zufall","a":"Wähle ohne langes Abwägen eine Farbe und ein Werkzeug. Arbeite fünf Minuten ausschließlich damit; erst danach darfst du wechseln.","m":"Farbe/Zeichenmittel"},{"n":"Zwei-Minuten-Regel","t":"Zufall","a":"Lege für ein Blatt genau zwei Minuten fest. Innerhalb dieser Zeit entscheidest du schnell über Farbe, Richtung und Fläche; danach bleibt das Blatt unangetastet.","m":"Papier, flüssige Farbe, grobes Werkzeug"},{"n":"Figur folgt Interesse","t":"Form","a":"Lege zehn kleine Formen locker auf eine Fläche. Entscheide, welche eine Figur werden soll, und verändere nur Hintergrund, Abstand und Nachbarschaft – nicht die Figur selbst.","m":"Papierformen oder digitale Formen"},{"n":"Zufallsmaß anwenden","t":"Zufall","a":"Erzeuge drei zufällige Kurven mit Schnur. Wähle eine davon als 'Lineal' und benutze sie mindestens fünfmal in derselben Komposition.","m":"Schnur, Papier, Stift"},{"n":"Fünf Bewegungsqualitäten als Linien","t":"Linie","a":"Definiere fünf deutlich unterschiedliche Bewegungsqualitäten, z. B. fließend, kantig, wirbelnd, leicht, still. Lege für jede eine eigene Linienregel fest.","m":"Papier, Stifte"},{"n":"Nicht für ein Publikum","t":"Symbol & Würdigung","a":"Sage dir vor dem Start: Diese Arbeit muss weder gezeigt noch erklärt noch bewertet werden. Arbeite dann mit beliebigem Material und frage dich bei jedem Schritt nur: Was ist der nächste sinnvolle gestalterische Schritt für diese Arbeit?","m":"beliebiges Material"},{"n":"Serienmalen 5 × 2 Minuten","t":"Zeit & Körper","a":"Lege fünf Blätter bereit. Male jedes genau zwei Minuten ohne Themenvorgabe; wechsle unmittelbar zum nächsten Blatt. Verwende grobe Werkzeuge und arbeite möglichst im Stehen.","m":"5 Blätter, flüssige Farbe, grobe Pinsel/Spachtel"},{"n":"Malen ohne Motivvorgabe","t":"Zufall","a":"Beginne mit einer Farbe oder Spur, die dich spontan interessiert. Lass jeden nächsten Schritt aus dem gerade Sichtbaren entstehen, ohne vorher ein Motiv festzulegen.","m":"Papier/Leinwand, Farbe"},{"n":"Spur ohne Kommentar","t":"Linie","a":"Arbeite zehn Minuten mit Farbe oder Stift. Währenddessen und direkt danach gibst du der Arbeit keinen Titel und erklärst nichts. Erst später darf sie beschrieben werden.","m":"Papier, Farb-/Zeichenmittel"},{"n":"Dauerblick – eine Spur","t":"Zeit & Körper","a":"Betrachte fünf Minuten lang einen einfachen Gegenstand oder eine ruhige Szene. Setze nur alle 30 Sekunden eine einzige Linie oder Markierung auf das Blatt.","m":"Objekt/Szene, Papier, Stift"},{"n":"Bewegung wird Spur","t":"Linie","a":"Bewege dich nacheinander in fünf selbstgewählten Qualitäten, z. B. weich, kantig, ungeordnet, leicht, sehr langsam. Übertrage jede direkt anschließend in eine einminütige Zeichnung.","m":"Bewegungsraum, Papier, Stift"},{"n":"Denken als Diagramm","t":"Raum & Material","a":"Nimm einen einfachen Gedanken oder Ablauf und zeichne ihn fünf Minuten lang nur mit Pfeilen, Kreisen, Linien, Wörtern und Verbindungen auf eine große Fläche.","m":"großes Papier/Whiteboard, Stift/Kreide"},{"n":"Sehen oder deuten?","t":"Symbol & Würdigung","a":"Schreibe sechs Sätze über deine Arbeit. Markiere danach jeden Satz als 'sichtbare Beobachtung' oder 'Deutung/Assoziation'.","m":"eigene Arbeit, Papier"},{"n":"Farbwirkung prüfen","t":"Farbe","a":"Notiere spontan, welche Wirkung zwei dominante Farben für dich haben. Suche anschließend drei rein formale Gründe, die dieselbe Wirkung mitverursachen könnten: Menge, Helligkeit, Nachbarschaft, Position.","m":"eigene Arbeit"},{"n":"Symbol offen halten","t":"Symbol & Würdigung","a":"Wähle ein auffälliges Zeichen deiner Arbeit und formuliere drei verschiedene mögliche Bedeutungen, ohne eine davon zur 'richtigen' zu erklären.","m":"eigene Arbeit"},{"n":"Figur wechselt","t":"Form","a":"Betrachte die Arbeit und benenne zuerst das dominanteste Element. Bleib zwei Minuten dabei und suche dann bewusst ein anderes Element, das zur neuen Figur werden kann.","m":"eigene Arbeit"},{"n":"Drei Minuten Präsenz","t":"Zeit & Körper","a":"Sitze drei Minuten vor deiner fertigen Arbeit, ohne sie zu verändern, zu fotografieren oder zu benennen. Notiere erst danach drei neue Beobachtungen.","m":"eigene Arbeit, Timer"},{"n":"Zufall oder Entscheidung?","t":"Zufall","a":"Markiere gedanklich fünf auffällige Stellen deiner Arbeit und ordne jede einer Skala zu: eher Zufall – Mischform – eher bewusste Entscheidung.","m":"eigene Arbeit"}],"names":["Agnes Martin","Hanne Darboven","Eva Hesse","Louise Bourgeois","Marina Abramović","Rebecca Horn","Mona Hatoum","Doris Salcedo","On Kawara","Tehching Hsieh","Donald Judd","Sol LeWitt","Roman Opalka","Christian Marclay","Bruce Nauman","Robert Smithson","James Turrell","Dan Graham","Felix Gonzalez-Torres","William Kentridge","Karen Barad","Donna Haraway","N. Katherine Hayles","Elena Esposito","Susan Leigh Star","Lucy Suchman","Wendy Hui Kyong Chun","Judith Butler","Hannah Arendt","Henri Bergson","Niklas Luhmann","Jacques Derrida","Gilles Deleuze","Michel Foucault","George Spencer-Brown","Gregory Bateson","Michel Serres","Gilbert Simondon","Heinz von Foerster","Claude Shannon"]};
const JEV_URL = "";   // Adresse des Proxys zu api.typesafe.ai (der Schlüssel liegt nur dort); leer = Schalter bleibt verborgen
const THEMES = [["Farbe","--c0"],["Linie","--c1"],["Form","--c2"],["Raum & Material","--c3"],["Zeit & Körper","--c4"],["Zufall","--c5"],["Symbol & Würdigung","--c6"]];
const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const pt = (r, d) => { const a = d * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; };
const sector = (r1, r2, a0, a1) => { const [x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0); return `M${x1} ${y1} A${r2} ${r2} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 0 0 ${x4} ${y4} Z`; };
const NZ = D.cyc.length, NF = SYMBOL_COUNT, NC = THEMES.length;
const SZ = 360 / NZ, SF = 360 / NF, SC = 360 / NC;

// Aussen: Zeit, sieben Zyklen
$("zeit").innerHTML = D.cyc.map(([r], i) => {
  const [tx, ty] = pt(92, (i + .5) * SZ);
  return `<path class="seg seg-zeit" d="${sector(76, 108, i * SZ, (i + 1) * SZ)}"/><text class="roman" x="${tx}" y="${ty}">${r}</text>`;
}).join("");
// Mitte: Form, 40 Zeichen
$("form").innerHTML = `<circle class="ring" r="74"/><circle class="ring" r="44"/>` + Array.from({ length: NF }, (_, i) => {
  const [x, y] = pt(59, (i + .5) * SF);
  return `<g transform="translate(${x} ${y})">${symbolMarkup(i, 4.6)}</g>`;
}).join("");
// Innen: Farbe, sieben Themen
$("farbe").innerHTML = THEMES.map(([, v], i) => `<path class="seg" d="${sector(16, 42, i * SC, (i + 1) * SC)}" style="fill:var(${v})"/>`).join("");

let busy = false, dz = 0, df = 0, dc = 0, cur = null;
const m = (x) => ((x % 360) + 360) % 360;
// Drehrichtung wechselt je Ring, mindestens zwei Runden; der Sektor unter dem Zeiger (oben) ist der gezogene
const land = (deg, idx, step, up) => { const t = -(idx + .2 + Math.random() * .6) * step; return up ? deg + 720 + m(t - deg) : deg - 720 - m(deg - t); };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function spin() {
  if (busy) return; busy = true; $("go").disabled = true;
  const iz = Math.floor(Math.random() * NZ), i_f = Math.floor(Math.random() * NF), ic = Math.floor(Math.random() * NC);
  dz = land(dz, iz, SZ, false); df = land(df, i_f, SF, true); dc = land(dc, ic, SC, false);
  [["zeit", dz, 3200], ["form", df, 4400], ["farbe", dc, 5600]].forEach(([id, d, ms]) => { const g = $(id); g.style.transitionDuration = ms + "ms"; g.style.transform = `rotate(${d}deg)`; });
  cur = { iz, i_f, ic };
  $("result").hidden = true;
  setTimeout(() => { show(); busy = false; $("go").disabled = false; }, reduce() ? 50 : 5700);
}

function show() {
  const { iz, i_f, ic } = cur;
  const [rom, zname] = D.cyc[iz];
  const s = pick(D.strophen.filter((x) => x.c === rom));
  const th = THEMES[ic][0], e = pick(D.ex.filter((x) => x.t === th));
  cur.s = s; cur.e = e;
  $("cZeit").innerHTML = `<small>Zeit · Zu seiner Zeit</small><h2></h2><p class="meta"></p><p></p>`;
  const z = $("cZeit"); z.querySelector("h2").textContent = `${s.n} · ${s.t}`; z.querySelector(".meta").textContent = `Zyklus ${rom} · ${zname}`; z.querySelector("p:last-child").textContent = s.b;
  $("cForm").innerHTML = `<svg viewBox="-1.2 -1.2 2.4 2.4" aria-hidden="true">${symbolMarkup(i_f, 1)}</svg><div><small>Form · ORNA</small><h2></h2></div>`;
  $("cForm").querySelector("h2").textContent = D.names[i_f];
  $("cFarbe").innerHTML = `<small>Farbe · OMNA COLOR</small><h2></h2><p class="meta"></p><p></p>`;
  const f = $("cFarbe"); f.querySelector("h2").innerHTML = `<span class="dot" style="background:var(${THEMES[ic][1]})"></span>` ; f.querySelector("h2").append(`${e.n} (${th})`);
  f.querySelector(".meta").textContent = "Material: " + e.m; f.querySelector("p:last-child").textContent = e.a;
  $("satz").value = ""; $("jevout").hidden = true;
  $("jevbox").hidden = !JEV_URL;
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: matchMedia("(min-width: 800px)").matches ? "nearest" : "start" });
}

$("go").addEventListener("click", spin);
$("again").addEventListener("click", () => { window.scrollTo({ top: 0, behavior: reduce() ? "auto" : "smooth" }); spin(); });
$("wheel").addEventListener("click", spin);
$("wheel").addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); spin(); } });

$("copy").addEventListener("click", async () => {
  if (!cur || !cur.s) return;
  const txt = [`Das Dritte Rad`, `Zeit: ${cur.s.n} · ${cur.s.t}`, `Form: ${D.names[cur.i_f]}`, `Farbe: ${cur.e.n} (${THEMES[cur.ic][0]})`, ``, $("satz").value.trim()].join("\n");
  try { await navigator.clipboard.writeText(txt); $("copy").textContent = "Kopiert"; setTimeout(() => ($("copy").textContent = "Karte kopieren"), 1800); } catch { $("copy").textContent = "Kopieren nicht möglich"; }
});

// Gegenrad (freiwillig): sendet erst nach Haken und nur beim Verlassen des Satzfelds
$("satz").addEventListener("change", async () => {
  if (!JEV_URL || !$("jev").checked || !$("satz").value.trim() || !cur.s) return;
  const out = $("jevout"); out.hidden = false; out.textContent = "Gegenrad denkt …";
  try {
    const r = await fetch(JEV_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ satz: $("satz").value.trim(), strophe: cur.s.t, text: cur.s.b, zyklen: D.cyc.map((c) => c[1]) }) });
    if (!r.ok) throw 0;
    const j = await r.json();
    out.textContent = `Nähe zur Strophe: ${Math.round(j.score * 100)} % · passt am ehesten zu Zyklus ${j.zyklus}`;
  } catch { out.textContent = "Das Gegenrad ist gerade nicht erreichbar. Dein Satz bleibt, wie er ist."; }
});
</script>
