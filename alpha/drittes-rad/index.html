       Das Dritte Rad: Zeit (Zu seiner Zeit), Form (ORNA) und Farbe (OMNA COLOR) drehen auf einer Achse. Das Spiel bleibt auf dieser Seite im Design des Rads:
       Jede Karte öffnet ihr Stück (ganze Strophe, ganze Konstellation, ganze Übung), und in jedem Schritt gibt es vier Wege: zurück ins Rad, Zettelkasten, ORNA, OMNA COLOR.
       Auf den Originalseiten erscheint über ?rad=1 dieselbe Auswahl (weiter.js), sie führt ins Rad zurück.
       Das Rad dreht auf Tippen, Enter, «Drehen» und mit dem Finger: Der angefasste Ring folgt der Geste, die Nachbarn laufen gegenläufig, nach dem Loslassen läuft das Rad mit dem Schwung
       der Geste aus (Auslaufkurve aus ORNA, js/lib/spin.js). Die Geste bestimmt nur Richtung, Tempo und Dauer, welche Stücke das Rad zeigt, bleibt Zufall.
       Logik in engine.js, Daten in daten.js (erzeugt mit tools/build-drittes-rad.ts), Nähe nach jev in jev.js (erzeugt mit tools/build-jev-bruecken.ts), ORNA-Daten direkt aus dem Rad.
       Bewusst dunkel und mystisch gestaltet (auf Wunsch, 2. Oktober 2026), das Rad selbst ohne Text und Zahlen, die Schrift schlicht wie in den anderen Fassungen (Instrument Sans);
       die ruhige Gestaltung nach REGELN §5 gilt für ORNA, nicht für diese Seite.
       Symbolik in Anlehnung an drei alte Kreise: Tierkreis (Sternenband, zwölf Zeichen, Sonne), Alchemie-Kreis (Zeichen der Elemente, sieben Planetenzeichen, Dreieck, Siebenstern)
       und Goethes Farbenkreis von 1809 (Farben, Eigenschaften je Farbe auf den Karten).
       jev wird nur beim Bauen gefragt (jev.js), die Seite ruft keinen Dienst auf und sendet nichts.
