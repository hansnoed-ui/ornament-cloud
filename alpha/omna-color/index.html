/* Layout: Rad links, Übung rechts; auf dem Telefon untereinander. Farben nur im Rad, sonst ruhige kühle Neutrale. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --fg: #1c2030;
  --muted: #5d6477;
  --line: #d8dbe3;

  --ink: #2b2417; --paper2: #f3ead4;
  --c0: #e5484d; --c1: #f08a24; --c2: #f2c230; --c3: #3da35d; --c4: #2f7de1; --c5: #4b4fc4; --c6: #9b51c9;
  --display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --fg: #e8eaf1; --muted: #9aa1b5; --line: #2d3141;
    --btn-bg: #e8eaf1; --btn-fg: #12141b; --ink: #efe3c6; --paper2: #2a2418; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --fg: #e8eaf1; --muted: #9aa1b5; --line: #2d3141;
  --btn-bg: #e8eaf1; --btn-fg: #12141b; --ink: #efe3c6; --paper2: #2a2418; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); padding-inline: 16px; padding-block: 24px 40px; }
main { max-width: 980px; margin-inline: auto; margin-top: clamp(28px, 9vh, 104px); display: grid; gap: 28px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.stage { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.wheelbox { display: grid; gap: 16px; justify-items: center; }
.wheel { width: min(100%, 420px); aspect-ratio: 224 / 232; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.wheel svg { width: 100%; height: 100%; overflow: visible; display: block; }
.spin path.seg { stroke: var(--ink); stroke-width: .6; stroke-linejoin: round; }
.ring { fill: none; stroke: var(--ink); stroke-width: .6; }
.tick { fill: var(--ink); }
#mixdot { fill: var(--surface); stroke: var(--ink); stroke-width: .8; }
.spin { transition: transform 5.6s cubic-bezier(.45, 0, .15, 1); }
@media (prefers-reduced-motion: reduce) { .spin path { stroke: var(--bg); stroke-width: 1.5; }
.tick { fill: var(--fg); }
#mixdot { fill: var(--surface); stroke: var(--bg); stroke-width: 1.5; }
.spin { transition-duration: .01s; } }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center; }
button.go { font: 500 1rem var(--body); background: var(--btn-bg); color: var(--btn-fg); border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
button.go:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--c4); outline-offset: 3px; }
.mix { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--muted); cursor: pointer; }
.mix input { width: 18px; height: 18px; accent-color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; margin: 0; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.card { scroll-margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 14px; min-height: 280px; align-content: start; }
.card h2 { font: 500 1.7rem/1.15 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 9px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.task { margin: 0; max-width: 60ch; }
.end { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); max-width: 60ch; }
.end small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.idline { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); margin: 0; }
.again { justify-self: start; font: 500 .9rem var(--body); background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.crumb { max-width: 980px; margin: 0 auto 8px; font-size: .8rem; color: var(--muted); }
.crumb a { color: inherit; text-decoration: none; }
.crumb a:hover, .crumb a:focus-visible { color: var(--fg); text-decoration: underline; }
@media (min-width: 800px) {
  /* Rad und Knopf als eigene Rasterzellen, damit die Karte zur Radmitte ausgerichtet wird und nicht zur Mitte von Rad + Knopf */
  .stage { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); grid-template-areas: "rad karte" "knopf ."; row-gap: 16px; }
  .wheelbox { display: contents; }
  .wheel { grid-area: rad; align-self: center; justify-self: center; }
  .controls { grid-area: knopf; }
  /* Die Scheibe sitzt im SVG etwas unter der Mitte (Zeiger oben): 16px Rand oben schiebt die Kartenmitte um 8px nach */
  .card { grid-area: karte; align-self: center; margin-top: 16px; }
}
</style>

<script>
const EX = [{"id":"001","n":"Farbinventar","t":"Farbe","nb":[],"v":0,"s":0,"d":8,"a":"Suche in deiner unmittelbaren Umgebung zehn unterschiedliche Farben und lege oder fotografiere sie als kleine Sammlung.","m":"Umgebung, optional Kamera/Farbpapier","f":"Hat die Suche deinen Blick auf Farben verändert? Wie?"},{"id":"002","n":"Fast gleich","t":"Farbe","nb":[],"v":0,"s":1,"d":10,"a":"Finde fünf Farbtöne, die auf den ersten Blick fast gleich wirken, und ordne sie von wärmer zu kühler oder heller zu dunkler.","m":"Umgebung/Farbmaterial","f":"Ab welchem Paar konntest du den Unterschied sicher benennen – oder bei keinem?"},{"id":"003","n":"Komplementärfund","t":"Farbe","nb":[],"v":0,"s":0,"d":8,"a":"Suche drei Paare von Farben, die sich stark gegenseitig steigern. Lege jedes Paar nebeneinander.","m":"Umgebung/Farbpapier","f":"Welches Paar wirkt am stärksten, und was trägt dazu bei?"},{"id":"004","n":"Warm–kühl-Feld","t":"Farbe","nb":[],"v":0,"s":1,"d":10,"a":"Sammle je fünf warme und fünf kühle Farbfunde. Suche danach einen Farbton, der je nach Nachbarschaft kippt.","m":"Farbmaterial/Umgebung","f":"Gab es Farbtöne, die sich nicht eindeutig zuordnen ließen? Welche?"},{"id":"005","n":"Licht verändert Farbe","t":"Farbe","nb":[],"v":0,"s":0,"d":10,"a":"Beobachte denselben farbigen Gegenstand an drei Orten oder Lichtbedingungen und notiere/fotografiere die Veränderungen.","m":"ein farbiger Gegenstand","f":"Was blieb gleich, obwohl die Farbe anders erschien?"},{"id":"006","n":"Druckfarben-Archiv","t":"Farbe","nb":["Raum & Material"],"v":0,"s":0,"d":12,"a":"Schneide oder markiere zehn interessante Farben aus Verpackungen, Magazinen oder Drucksachen und sortiere sie ohne Farbnamen.","m":"Drucksachen, Schere","f":"Nach welchem visuellen Kriterium hast du tatsächlich sortiert?"},{"id":"007","n":"Linienbibliothek","t":"Linie","nb":[],"v":0,"s":0,"d":10,"a":"Finde zehn verschiedene Linien in Dingen um dich herum: gerade, geknickt, weich, unterbrochen, gespannt … Zeichne nur die Linien ab.","m":"Papier, Stift","f":"Welche Linie beschreibt ihren Gegenstand am wenigsten eindeutig?"},{"id":"008","n":"Bewegungslinien","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":1,"d":8,"a":"Beobachte drei Bewegungen im Alltag und übersetze jede in nur zwei oder drei Linien.","m":"Papier, Stift","f":"Welche Linie vermittelt Bewegung, obwohl nichts dargestellt ist?"},{"id":"009","n":"Geometrisch / organisch","t":"Form","nb":[],"v":0,"s":0,"d":8,"a":"Suche zehn Formen und teile sie in geometrisch, organisch oder unentscheidbar ein.","m":"Umgebung, Papier/Kamera","f":"Gab es Formen, die sich der Einteilung entzogen? Welche?"},{"id":"010","n":"Formen ohne Dinge","t":"Form","nb":["Linie"],"v":0,"s":0,"d":10,"a":"Suche fünf interessante Formen, ohne den Gegenstand zu benennen. Zeichne nur ihre Silhouette.","m":"Papier, Stift","f":"Ab wann hast du das Gebilde nur noch als Form gelesen – oder gelang das nicht?"},{"id":"011","n":"Texturquartett","t":"Raum & Material","nb":[],"v":0,"s":0,"d":12,"a":"Finde vier deutlich verschiedene Oberflächen und dokumentiere sie als Zeichnung, Frottage oder Foto.","m":"Papier, weicher Stift, Umgebung","f":"Welche Textur ließ sich visuell leichter, welche schwerer übertragen?"},{"id":"012","n":"Tastarchiv","t":"Raum & Material","nb":[],"v":0,"s":0,"d":8,"a":"Wähle fünf ungefährliche Materialien und ordne sie nur nach Tastqualität: glatt, rau, weich, hart, elastisch usw.","m":"fünf Materialien","f":"Welche Materialien fühlten sich ähnlich an, welche verschieden – und deckt sich das mit dem Aussehen?"},{"id":"013","n":"Ein Material – fünf Zustände","t":"Raum & Material","nb":[],"v":0,"s":0,"d":10,"a":"Sammle oder erzeuge fünf Zustände desselben Materials, z. B. Papier glatt, geknickt, gerissen, gerollt, zerknüllt.","m":"ein Material","f":"Welche Veränderung hat das Material am stärksten verwandelt?"},{"id":"014","n":"Kantenfinder","t":"Linie","nb":[],"v":0,"s":0,"d":8,"a":"Suche in deiner Umgebung fünf verschiedene Kanten: eine weiche, eine scharfe, eine gezackte, eine gebrochene und eine, an der sich zwei Dinge überlagern. Zeichne von jeder Kante frei von Hand, während du sie ansiehst, nur die Linie, an der zwei Flächen aufeinandertreffen – nicht die Gegenstände selbst.","m":"Papier, Stift","f":"Welche Kante gehört eigentlich zu zwei Dingen gleichzeitig?"},{"id":"015","n":"Negativräume","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":10,"a":"Suche fünf Zwischenräume zwischen Dingen und zeichne nur diese Leerformen.","m":"Papier, Stift","f":"Wann wirkt der Zwischenraum selbst wie ein Gegenstand?"},{"id":"016","n":"Wiederholungen finden","t":"Form","nb":[],"v":0,"s":0,"d":10,"a":"Suche eine wiederkehrende Form oder Struktur und sammle sechs Varianten davon.","m":"Umgebung, Kamera/Skizzenbuch","f":"Was muss gleich bleiben, damit du noch von Wiederholung sprichst?"},{"id":"017","n":"Symmetrie / Störung","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":8,"a":"Finde drei annähernd symmetrische Situationen und jeweils die Stelle, an der die Symmetrie bricht.","m":"Umgebung, Kamera/Skizzenbuch","f":"Welche kleine Abweichung verändert das Ganze am meisten?"},{"id":"018","n":"Zufallsspuren","t":"Form","nb":["Linie","Zufall"],"v":0,"s":0,"d":10,"a":"Suche fünf unbeabsichtigte Spuren: Flecken, Risse, Abrieb, Tropfen, Klebereste. Zeichne sie als reine Formen ab.","m":"Umgebung, Papier, Stift","f":"Wann wird eine Spur zur Komposition?"},{"id":"019","n":"Schattenformen","t":"Form","nb":["Linie"],"v":0,"s":0,"d":10,"a":"Sammle fünf Schatten als Umriss und vergleiche sie mit den Dingen, die sie erzeugen.","m":"Papier/Kamera, Licht","f":"Welcher Schatten wirkt eigenständiger als sein Gegenstand?"},{"id":"020","n":"Durchsicht und Spiegelung","t":"Raum & Material","nb":[],"v":0,"s":1,"d":10,"a":"Suche fünf Stellen, an denen du durch etwas hindurch oder in etwas hinein siehst: Glas, Wasser, Spiegel, Folie.","m":"Umgebung, Kamera/Skizzenbuch","f":"Wo sind Vordergrund und Hintergrund am schwersten zu trennen?"},{"id":"021","n":"Verbindungen","t":"Raum & Material","nb":[],"v":0,"s":1,"d":12,"a":"Finde fünf verschiedene Arten, wie Dinge verbunden sind: Knoten, Steckung, Scharnier, Klebung, Druck, Überlappung.","m":"Umgebung, Skizzenbuch","f":"Welche Verbindung nutzt das Material am unmittelbarsten?"},{"id":"022","n":"Drei Ausschnitte","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":8,"a":"Baue mit den Fingern oder einem Papierrahmen einen Sucher und sammle drei Ausschnitte derselben Szene.","m":"Papierrahmen optional","f":"Wie verändert der Rahmen, was wichtig erscheint?"},{"id":"023","n":"Fünf Distanzen","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":10,"a":"Betrachte dasselbe Objekt aus fünf Distanzen und notiere jeweils nur drei sichtbare Merkmale.","m":"Objekt, Papier","f":"Ab welcher Distanz verschwindet das Detail und entsteht die Gesamtform?"},{"id":"024","n":"Fünf Blickwinkel","t":"Form","nb":["Linie"],"v":0,"s":0,"d":8,"a":"Betrachte denselben Gegenstand von oben, unten, vorne, hinten und schräg und zeichne je eine 30-Sekunden-Silhouette.","m":"Objekt, Papier, Stift","f":"Welche Ansicht war am leichtesten, welche am schwersten wiederzuerkennen?"},{"id":"025","n":"Fünf Helligkeiten","t":"Farbe","nb":[],"v":0,"s":0,"d":8,"a":"Suche fünf Flächen von sehr hell bis sehr dunkel und ordne sie als Werteskala.","m":"Umgebung, Kamera/Papier","f":"Liegen die fünf Werte gleichmäßig auseinander, oder liegen manche näher beieinander?"},{"id":"026","n":"Geräuschlinien","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":0,"d":5,"a":"Höre zwei Minuten lang und sammle fünf Geräusche als unterschiedliche Linien, ohne die Geräuschquelle zu zeichnen.","m":"Papier, Stift","f":"Welche Linie lässt sich hören, obwohl sie stumm ist?"},{"id":"027","n":"Tasten ohne Schauen","t":"Raum & Material","nb":["Form"],"v":0,"s":1,"d":8,"a":"Ertaste drei ungefährliche kleine Gegenstände mit geschlossenen Augen und zeichne danach nur Form und Textur aus der Erinnerung.","m":"3 sichere Gegenstände, Papier","f":"Was hat die Hand wahrgenommen, und wie unterscheidet sich das vom Sehen?"},{"id":"028","n":"Papiersorten","t":"Raum & Material","nb":[],"v":1,"s":0,"d":8,"a":"Sammle fünf Papiere und ordne sie nach Steifigkeit, Oberfläche und Lichtdurchlässigkeit.","m":"verschiedene Papiere","f":"Welche Eigenschaft bestimmt am stärksten, was du damit machen möchtest?"},{"id":"029","n":"Natur / gemacht","t":"Form","nb":[],"v":0,"s":0,"d":12,"a":"Sammle je fünf natürliche und hergestellte Formen und suche danach zwei, die sich formal stark ähneln.","m":"Umgebung, Kamera/Skizzenbuch","f":"Welches Paar macht die Unterscheidung natur/gemacht überraschend unwichtig?"},{"id":"030","n":"Farbgedächtnis","t":"Farbe","nb":["Zeit & Körper"],"v":0,"s":1,"d":8,"a":"Betrachte 20 Sekunden lang eine Farbe, wende dich ab und mische oder wähle aus mehreren Tönen die erinnerte Farbe.","m":"Farbmaterial oder digitale Farbwahl","f":"War deine Erinnerung heller, dunkler, wärmer oder kühler?"},{"id":"031","n":"Detail vergrößern","t":"Form","nb":[],"v":0,"s":0,"d":12,"a":"Wähle einen sehr kleinen Ausschnitt eines Gegenstands oder Bildes und vergrößere ihn, bis er das ganze Format füllt.","m":"Vorlage, Papier, Zeichenmittel","f":"Erkennst du den Ausschnitt noch als Teil des Originals? Ab wann nicht mehr?"},{"id":"032","n":"Komplexes verkleinern","t":"Form","nb":[],"v":0,"s":1,"d":12,"a":"Wähle ein Motiv mit vielen Einzelteilen (zum Beispiel einen Baum, ein Gesicht oder ein Foto). Zeichne es dreimal nacheinander mit immer weniger Formen: zuerst aus zehn Formen, dann aus fünf, dann aus drei. Jede Fassung entsteht aus der vorherigen, indem du Formen weglässt oder zusammenfasst.","m":"Vorlage, Papier","f":"Welche Form musste bleiben, damit das Motiv zusammenhielt?"},{"id":"033","n":"Drehen","t":"Form","nb":["Linie"],"v":1,"s":0,"d":8,"a":"Drehe eine vorhandene Zeichnung um 90°, 180° und 270° und ergänze in jeder Lage genau eine Form.","m":"Zeichnung, Stift","f":"In welcher Lage ergab sich die Fortsetzung am leichtesten, in welcher am schwersten?"},{"id":"034","n":"Spiegeln","t":"Form","nb":[],"v":0,"s":0,"d":10,"a":"Übertrage eine einfache Komposition gespiegelt und verändere anschließend nur ein Element.","m":"Vorlage, Papier","f":"Was verändert sich, obwohl fast alles gleich geblieben ist?"},{"id":"035","n":"Neu rahmen","t":"Form","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":10,"a":"Wähle aus einer vorhandenen Arbeit drei unterschiedliche Ausschnitte und behandle jeden als eigenständige Komposition.","m":"eigene Arbeit, Papierrahmen/Kamera","f":"Welcher Ausschnitt wirkt vollständiger als das ganze Bild?"},{"id":"036","n":"Figur wird Grund","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":10,"a":"Zeichne eine einfache Form und gestalte anschließend nicht die Form, sondern nur den Raum um sie herum.","m":"Papier, Zeichen-/Farbmittel","f":"Wann beginnt der Leerraum selbst als Figur zu wirken?"},{"id":"037","n":"Palette tauschen","t":"Farbe","nb":[],"v":1,"s":1,"d":15,"a":"Übertrage eine kleine bestehende Arbeit mit vollständig anderer Farbpalette, ohne Formen zu verändern.","m":"Vorlage, Farbmittel","f":"Was verändert die Farbe, obwohl die Form identisch bleibt?"},{"id":"038","n":"Gleiche Farbe, andere Nachbarschaft","t":"Farbe","nb":[],"v":0,"s":1,"d":12,"a":"Setze zwei identische Farbfelder auf deutlich verschiedene Hintergründe und suche Kontexte, in denen sie möglichst verschieden erscheinen.","m":"Farbpapier oder digitale Flächen","f":"Wie verändert die Hintergrundfarbe die identische Farbe – bei welchem Hintergrund am stärksten, bei welchem kaum?"},{"id":"039","n":"Nachbild","t":"Farbe","nb":["Zeit & Körper"],"v":0,"s":0,"d":5,"a":"Betrachte längere Zeit eine kräftige Farbfläche und wechsle dann auf eine helle neutrale Fläche. Beobachte das entstehende Nachbild.","m":"Farbfläche, helle Fläche","f":"Welche Farbe erscheint im Nachbild, und wie deutlich?"},{"id":"040","n":"Farbgradient","t":"Farbe","nb":[],"v":0,"s":1,"d":12,"a":"Erzeuge zwischen zwei gewählten Farben mindestens sieben Zwischenschritte – gemischt oder durch Auswahl vorhandener Töne.","m":"Farbe/Farbpapier oder digital","f":"Wo nimmst du die Stufen als gleichmäßig wahr, wo als Sprung?"},{"id":"041","n":"Vier Farben – vier Welten","t":"Farbe","nb":["Form"],"v":0,"s":1,"d":18,"a":"Verwende dieselben vier Farben in vier kleinen Kompositionen, ändere nur Menge und Platzierung.","m":"vier Farben/Farbpapiere","f":"Wie unterscheiden sich die vier Ergebnisse, obwohl die Farben identisch sind – oder kaum?"},{"id":"042","n":"Bild als Farbfelder","t":"Form","nb":["Farbe"],"v":0,"s":1,"d":20,"a":"Wähle ein Bild und übertrage es nur als wenige ausgeschnittene Farb- und Formflächen, ohne Details nachzuzeichnen.","m":"Bildvorlage, Farbpapier, Schere","f":"Welche wenigen Farbfelder tragen die größte Ähnlichkeit?"},{"id":"043","n":"Drei Abstraktionsstufen","t":"Form","nb":[],"v":0,"s":1,"d":18,"a":"Zeichne einen Gegenstand beobachtend, vereinfache ihn in einer zweiten Version und reduziere ihn in einer dritten auf Zeichen/Flächen.","m":"Objekt, Papier","f":"Welche Stufe sagt mit den wenigsten Mitteln am meisten?"},{"id":"044","n":"Fünf Formen reichen","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":15,"a":"Übersetze ein Motiv in höchstens fünf ausgeschnittene Formen.","m":"Papier, Schere, Kleber","f":"Welche Form trägt die Komposition am stärksten, welche am wenigsten?"},{"id":"045","n":"Linie wird Fläche","t":"Form","nb":["Linie"],"v":0,"s":1,"d":15,"a":"Nimm eine Linienzeichnung und verwandle jede geschlossene Zone in eine ausgeschnittene oder gemalte Fläche.","m":"Linienzeichnung, Papier/Farbe","f":"Wo hat die Fläche etwas erzeugt, das die Linie nicht hatte?"},{"id":"046","n":"2D wird 3D","t":"Raum & Material","nb":["Linie"],"v":0,"s":1,"d":15,"a":"Zeichne eine einfache Linie und baue sie anschließend mit Draht, Schnur oder Papierstreifen als räumliche Linie nach.","m":"Papier, Draht/Schnur/Papierstreifen","f":"Was muss eine Linie können, wenn sie plötzlich im Raum steht?"},{"id":"047","n":"Eine Fläche wird Raum","t":"Raum & Material","nb":["Form"],"v":0,"s":1,"d":20,"a":"Verwandle ein einziges Blatt durch Falten, Schneiden und Stecken in eine stehende dreidimensionale Struktur.","m":"ein Blatt Papier, Schere","f":"Welche Veränderung gibt dem flachen Material die größte räumliche Stabilität?"},{"id":"048","n":"Material imitiert Material","t":"Raum & Material","nb":[],"v":0,"s":1,"d":15,"a":"Versuche mit einem Material die Oberflächenwirkung eines anderen zu erzeugen, z. B. Papier wie Rinde oder Metall wie Stoff erscheinen zu lassen.","m":"2 Materialien als Referenz, 1 Arbeitsmaterial","f":"Was musstest du am Material anpassen, damit es als ein anderes erscheint?"},{"id":"049","n":"Gegenqualität","t":"Raum & Material","nb":[],"v":0,"s":1,"d":15,"a":"Nimm ein Material und gestalte es so, dass es möglichst gegensätzlich zu seiner üblichen Wirkung erscheint: weich/hart, leicht/schwer, ruhig/unruhig.","m":"ein Material","f":"Welche Eigenschaft des Materials ließ sich nicht überreden?"},{"id":"050","n":"Zerschneiden und neu ordnen","t":"Form","nb":["Raum & Material"],"v":1,"s":0,"d":15,"a":"Zerschneide eine eigene Zeichnung in mindestens acht Teile und ordne sie zu einer neuen Komposition.","m":"eigene Zeichnung, Schere","f":"Was bleibt vom ursprünglichen Bild erhalten, obwohl die Ordnung zerstört ist?"},{"id":"051","n":"Zufallsordnung","t":"Zufall","nb":["Form"],"v":0,"s":0,"d":10,"a":"Lass kleine Papierformen fallen, fixiere ihre zufällige Lage zunächst gedanklich und verändere anschließend nur drei Positionen bewusst.","m":"Papierformen","f":"Welche deiner drei Entscheidungen hatte die größte kompositorische Wirkung?"},{"id":"052","n":"Automatische Linie – bewusste Form","t":"Zufall","nb":["Linie"],"v":0,"s":0,"d":10,"a":"Führe eine Linie schnell und ohne Motivplanung über das Blatt. Suche danach zwei interessante Bereiche und arbeite nur dort weiter.","m":"Papier, Stift","f":"Was wurde erst durch deine spätere Auswahl zur Form?"},{"id":"053","n":"Blind beginnen, sehend fortsetzen","t":"Zufall","nb":["Linie"],"v":0,"s":0,"d":10,"a":"Beginne eine Zeichnung ohne aufs Papier zu schauen. Danach sieh hin und ergänze nur drei bewusste Eingriffe.","m":"Objekt, Papier, Stift","f":"Gibt es unbeabsichtigte Stellen, die du erhalten möchtest? Welche und warum?"},{"id":"054","n":"Abdruck und Spiegelung","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":18,"a":"Erzeuge einen einfachen Druck oder Abdruck und vergleiche ihn mit der Druckplatte bzw. Ausgangsform. Ergänze im Abdruck eine neue Form.","m":"Schaumplatte/Stempel/Monoprintmaterial","f":"Was hat sich durch den Druck an Richtung oder Form verändert – oder blieb es gleich?"},{"id":"055","n":"Frottage wird Landschaft","t":"Raum & Material","nb":["Form"],"v":0,"s":0,"d":15,"a":"Erzeuge drei Frottagen verschiedener Oberflächen, schneide sie aus und kombiniere sie zu einer neuen nichtgegenständlichen Fläche.","m":"Papier, weicher Stift, Oberflächen, Schere","f":"Welche ursprüngliche Oberfläche ist in der neuen Ordnung noch erkennbar?"},{"id":"056","n":"Ein Motiv – drei Medien","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":25,"a":"Setze dasselbe einfache Motiv als Zeichnung, Collage und räumliche Miniatur um.","m":"Papier, Stift, Collagematerial, einfaches Baumaterial","f":"Welche Eigenschaft des Motivs überlebt jeden Medienwechsel?"},{"id":"057","n":"Transparente Schichten","t":"Form","nb":["Farbe","Raum & Material"],"v":0,"s":1,"d":15,"a":"Zeichne oder male zwei einfache Strukturen auf transparente/semitransparente Träger und untersuche verschiedene Überlagerungen.","m":"Transparentpapier/Folie, Stifte/Farbe","f":"Welche neue Form existiert nur durch die Überlagerung?"},{"id":"058","n":"Raster verzerren","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":18,"a":"Übertrage ein einfaches Motiv mit Hilfe eines Rasters und verändere im Zielraster Breite oder Höhe einzelner Felder.","m":"Vorlage, Papier, Lineal","f":"Wo kippt Wiedererkennbarkeit in Verfremdung?"},{"id":"059","n":"Drei Zustände","t":"Zeit & Körper","nb":["Form"],"v":0,"s":0,"d":15,"a":"Gestalte dieselbe Form als vorher – während – nachher, ohne eine Geschichte zu erklären.","m":"Papier, Zeichen-/Farbmittel","f":"Welche minimale Veränderung erzeugt den stärksten Eindruck von Zeit?"},{"id":"060","n":"Rest wird Ausgangspunkt","t":"Zufall","nb":["Farbe","Raum & Material"],"v":1,"s":0,"d":12,"a":"Nimm einen Verschnitt, Farbfleck, Kleberest oder Papierrest aus einer früheren Arbeit und mache ihn zum Ausgangspunkt einer neuen Miniatur.","m":"Materialreste","f":"Wann hörte der Rest auf, Rest zu sein?"},{"id":"061","n":"Drei Farben","t":"Farbe","nb":[],"v":0,"s":0,"d":12,"a":"Gestalte eine kleine Komposition mit genau drei Farben. Kein vierter Ton darf hinzukommen.","m":"Farbmittel/Farbpapier","f":"Welche Farbe übernimmt die größte Rolle – wegen Menge oder Position?"},{"id":"062","n":"Nur eine Form","t":"Form","nb":[],"v":0,"s":0,"d":15,"a":"Wähle eine einzige Grundform und entwickle daraus eine Komposition nur durch Wiederholung, Größe, Drehung und Überlagerung.","m":"Papier, Schere oder Zeichenmittel","f":"Welche Veränderung erzeugt Vielfalt, ohne die Grundform zu verlieren?"},{"id":"063","n":"Linienkomposition","t":"Linie","nb":["Form"],"v":0,"s":0,"d":15,"a":"Baue eine Komposition nur aus Linien und entscheide bewusst über Richtung, Abstand, Schichtung und Dichte.","m":"Papier, Stifte/Klebeband","f":"Wo beginnt eine Gruppe von Linien als Fläche zu wirken?"},{"id":"064","n":"Geometrisch oder organisch","t":"Form","nb":[],"v":0,"s":0,"d":12,"a":"Entscheide dich vor Beginn: nur geometrische oder nur organische Formen. Halte die Regel bis zum Ende.","m":"Papier, Zeichen-/Farbmittel","f":"Was vermisst du durch die gewählte Einschränkung?"},{"id":"065","n":"Offen oder geschlossen","t":"Form","nb":["Linie"],"v":0,"s":0,"d":10,"a":"Arbeite ausschließlich mit offenen oder ausschließlich mit geschlossenen Formen.","m":"Papier, Stift","f":"Wann entsteht trotz offener Linie eine geschlossene Form?"},{"id":"066","n":"Symmetrie mit einem Fehler","t":"Form","nb":[],"v":0,"s":0,"d":15,"a":"Baue eine symmetrische Komposition und durchbrich sie an genau einer Stelle.","m":"Papier, Zeichen-/Collagematerial","f":"Wie klein kann die Störung werden, bevor sie nicht mehr auffällt?"},{"id":"067","n":"Asymmetrisches Gleichgewicht","t":"Form","nb":[],"v":0,"s":1,"d":12,"a":"Verteile drei sehr unterschiedliche Formen so, dass die Komposition ausgewogen wirkt, ohne symmetrisch zu sein.","m":"Papier, Formen/Objekte","f":"Welche Form wiegt visuell mehr als ihre Größe vermuten lässt?"},{"id":"068","n":"Mitte vermeiden","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":12,"a":"Gestalte eine Komposition, in der kein wichtiges Element die geometrische Mitte berührt.","m":"Papier, beliebiges Material","f":"Wo befindet sich das visuelle Zentrum, wenn es nicht in der Mitte liegt?"},{"id":"069","n":"Ein Hauptdarsteller","t":"Form","nb":[],"v":0,"s":0,"d":12,"a":"Entscheide, welches Element eindeutig dominant sein soll, und ordne alle anderen diesem unter.","m":"Papier, Formen/Farbe","f":"Wodurch dominiert das Hauptelement tatsächlich?"},{"id":"070","n":"Kippfigur","t":"Form","nb":[],"v":0,"s":1,"d":15,"a":"Baue mit zwei Formen oder zwei Tonwerten eine Figur-Grund-Situation, bei der beide Lesarten möglich bleiben.","m":"Papier, Schwarz/Weiß","f":"Wann kippt dein Blick von der einen in die andere Lesart?"},{"id":"071","n":"Halb leer","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":12,"a":"Lass mindestens die Hälfte des Formats vollständig ungestaltet und konzentriere alle Eingriffe auf den Rest.","m":"Papier, beliebiges Medium","f":"Ist die leere Fläche passiv – oder gestaltet sie mit?"},{"id":"072","n":"Dichtegradient","t":"Form","nb":["Linie"],"v":0,"s":0,"d":12,"a":"Erzeuge einen kontinuierlichen Übergang von sehr dicht zu fast leer, ohne die Art der Elemente zu wechseln.","m":"Papier, Stift/Formelemente","f":"Wo genau wird aus dicht 'leer genug'?"},{"id":"073","n":"Rhythmus","t":"Zeit & Körper","nb":["Form"],"v":0,"s":0,"d":12,"a":"Wiederhole ein Element mindestens zwölfmal und entscheide über einen klaren visuellen Rhythmus.","m":"Papier, Stempel/Formen","f":"Wodurch entsteht der Rhythmus: Abstand, Größe, Richtung oder etwas anderes?"},{"id":"074","n":"Regel wird unregelmäßig","t":"Zeit & Körper","nb":["Form"],"v":0,"s":0,"d":12,"a":"Beginne mit einer streng regelmäßigen Folge und lasse sie schrittweise unregelmäßig werden.","m":"Papier, Formelemente","f":"Ab welchem Schritt erkennst du die ursprüngliche Regel nicht mehr sofort?"},{"id":"075","n":"Drei Größen","t":"Form","nb":[],"v":0,"s":0,"d":12,"a":"Verwende eine Form ausschließlich in drei festgelegten Größen: klein, mittel, groß.","m":"Papier, Formen","f":"Welche Größe strukturiert die anderen?"},{"id":"076","n":"Proportion 1–2–4","t":"Form","nb":[],"v":0,"s":1,"d":15,"a":"Arbeite mit drei Elementgrößen im ungefähren Verhältnis 1:2:4 und finde eine ausgewogene Verteilung.","m":"Papier, Formen","f":"Wirkt das Verhältnis geordnet oder spannungsreich?"},{"id":"077","n":"Nur zwei Materialien","t":"Raum & Material","nb":[],"v":0,"s":0,"d":15,"a":"Wähle zwei Materialien mit deutlich unterschiedlichen Eigenschaften und erlaube dir kein drittes.","m":"2 Materialien","f":"Welche Beziehung entsteht gerade aus der Begrenzung auf zwei?"},{"id":"078","n":"Ohne Klebstoff","t":"Raum & Material","nb":[],"v":0,"s":1,"d":20,"a":"Baue eine kleine stabile Struktur ohne Klebstoff. Verbindungen dürfen nur durch Stecken, Falten, Klemmen, Druck oder Balance entstehen.","m":"Papier/Karton/geeignete Materialien","f":"Welche Verbindung ist zugleich einfach und stabil?"},{"id":"079","n":"Nur Balance und Druck","t":"Raum & Material","nb":[],"v":0,"s":1,"d":15,"a":"Verbinde mehrere Teile so, dass sie ausschließlich durch Eigengewicht, Druck oder Spannung zusammenhalten.","m":"geeignete leichte Materialien","f":"Wo arbeitet die Schwerkraft für deine Form statt gegen sie?"},{"id":"080","n":"Eine klare Idee","t":"Form","nb":["Raum & Material"],"v":1,"s":1,"d":18,"a":"Nimm nur ein Material und formuliere vor Beginn eine einzige formale Idee, z. B. 'aufsteigen', 'fächern', 'verdichten'. Alles muss dieser Idee dienen.","m":"ein Material","f":"Welcher Eingriff trägt die Idee – und welcher wäre nur Dekoration?"},{"id":"081","n":"Zehn Schnitte","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":12,"a":"Du hast genau zehn Schnitte, um aus einem Blatt eine eigenständige Komposition zu entwickeln.","m":"Papier, Schere","f":"Welcher Schnitt war nicht rückgängig zu machen und deshalb entscheidend?"},{"id":"082","n":"Keine Gerade","t":"Form","nb":["Linie"],"v":0,"s":0,"d":12,"a":"Gestalte eine klar gegliederte Komposition, ohne eine einzige gerade Linie zu verwenden.","m":"Papier, Stift/Farbe","f":"Wie erzeugst du Ordnung ohne Geraden?"},{"id":"083","n":"Keine Kurve","t":"Form","nb":["Linie"],"v":0,"s":0,"d":12,"a":"Gestalte eine bewegte Komposition ausschließlich mit Geraden und Winkeln.","m":"Papier, Stift/Farbe","f":"Welche Winkel erzeugen die stärkste Bewegung?"},{"id":"084","n":"Eine durchgehende Linie","t":"Linie","nb":["Form","Raum & Material"],"v":0,"s":0,"d":10,"a":"Gestalte ein ganzes Format mit einer einzigen ununterbrochenen Linie. Überkreuzungen sind erlaubt.","m":"Papier, Stift","f":"Wo wird die Linie zum Raum oder zur Fläche?"},{"id":"085","n":"Nur Schwarz und Weiß","t":"Raum & Material","nb":["Farbe","Form"],"v":0,"s":0,"d":15,"a":"Erzeuge mit ausschließlich Schwarz und Weiß eine Komposition mit möglichst vielfältiger räumlicher Wirkung.","m":"Papier, schwarze Farbe/Stift","f":"Wie viel Raum kann ohne Grau entstehen?"},{"id":"086","n":"Fünf Grauwerte","t":"Farbe","nb":[],"v":0,"s":1,"d":15,"a":"Lege fünf klar unterscheidbare Grauwerte fest und verwende ausschließlich diese.","m":"Papier, Bleistift/Grauwerte","f":"Welcher Wert verbindet – welcher trennt?"},{"id":"087","n":"Komplementärpaar","t":"Farbe","nb":[],"v":0,"s":0,"d":15,"a":"Arbeite ausschließlich mit einem Komplementärpaar plus Weiß/Grund.","m":"Farbmittel","f":"Wo beginnen die beiden Farben miteinander zu 'vibrieren'?"},{"id":"088","n":"Nachbarfarben","t":"Farbe","nb":["Raum & Material"],"v":0,"s":1,"d":15,"a":"Wähle drei bis fünf benachbarte Farbtöne und erzeuge Tiefe ausschließlich durch Menge, Helligkeit und Position.","m":"Farbmittel","f":"Wie viel Raumwirkung erzeugen kleine Differenzen zwischen den Nachbarfarben?"},{"id":"089","n":"Gleiche Farben – ungleiche Mengen","t":"Farbe","nb":[],"v":0,"s":1,"d":15,"a":"Verwende vier Farben; eine darf nur sehr wenig, eine sehr viel, zwei mittel vorkommen. Verändere anschließend nur die Mengenverhältnisse.","m":"vier Farben","f":"Welche Farbe wird durch geringe Menge stärker statt schwächer?"},{"id":"090","n":"Stoppregel","t":"Zufall","nb":["Zeit & Körper"],"v":0,"s":0,"d":8,"a":"Lege vor Beginn eine eindeutige Stoppregel fest, z. B. nach 20 Strichen, 12 Teilen oder 8 Minuten. Beende die Arbeit dann wirklich.","m":"beliebiges Material","f":"Was bleibt offen, weil die Regel stärker war als dein Wunsch weiterzumachen?"},{"id":"091","n":"Blindkontur","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":0,"d":8,"a":"Wähle einen Gegenstand. Folge seiner Kontur sehr langsam mit den Augen und zeichne gleichzeitig, ohne aufs Papier zu sehen und ohne den Stift abzusetzen.","m":"Objekt, Papier, Stift","f":"Wie genau ist die Zeichnung im Vergleich zu deiner Erwartung?"},{"id":"092","n":"Langsame Kontur","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":0,"d":10,"a":"Zeichne die Kontur eines Gegenstands so langsam, dass Auge und Hand möglichst gleichzeitig entlangwandern. Auf das Papier darfst du schauen.","m":"Objekt, Papier, Stift","f":"Wo wolltest du schneller werden als dein Blick?"},{"id":"093","n":"30-Sekunden-Geste","t":"Zeit & Körper","nb":["Linie"],"v":0,"s":0,"d":5,"a":"Zeichne ein Objekt oder eine Pose in 30 Sekunden nur als Bewegungs- und Richtungsstruktur. Wiederhole fünfmal.","m":"Objekt/Pose, Papier, Stift","f":"Welche Information bleibt übrig, wenn für Details keine Zeit ist?"},{"id":"094","n":"Ungewohnte Hand","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":0,"d":8,"a":"Zeichne dasselbe einfache Motiv zuerst mit der gewohnten, dann mit der ungewohnten Hand.","m":"Objekt, Papier, Stift","f":"Welche Linienqualität entsteht nur durch die geringere Kontrolle?"},{"id":"095","n":"Ohne Absetzen","t":"Linie","nb":["Zeit & Körper"],"v":0,"s":0,"d":5,"a":"Zeichne fünf Minuten lang, ohne den Stift vom Papier zu heben. Motivwahl ist frei.","m":"Papier, Stift","f":"Wie hat die Regel deine Verbindungen beeinflusst?"},{"id":"096","n":"Große Schulterlinie","t":"Zeit & Körper","nb":["Linie"],"v":0,"s":0,"d":8,"a":"Arbeite auf möglichst großem Papier und zeichne Linien aus Schulter und Arm statt aus Fingern und Handgelenk.","m":"großes Papier, weiches Zeichenmittel","f":"Welche Bewegung sieht man der Linie noch an?"},{"id":"097","n":"Druckskala","t":"Farbe","nb":["Linie"],"v":0,"s":0,"d":6,"a":"Erzeuge mit demselben Stift zehn Linien von möglichst leicht bis möglichst kräftig, ohne die Linienbreite bewusst zu ändern.","m":"Papier, Bleistift/Kreide","f":"Wo beginnt Druck als Tonwert zu wirken?"},{"id":"098","n":"Ein Pinsel – fünf Spuren","t":"Linie","nb":["Raum & Material"],"v":0,"s":0,"d":10,"a":"Finde mit demselben Pinsel fünf möglichst unterschiedliche Spuren: Spitze, Seite, trocken, nass, gedreht usw.","m":"Pinsel, Farbe, Papier","f":"Welche Spur widerspricht am stärksten deiner Vorstellung davon, was ein Pinsel 'macht'?"},{"id":"099","n":"Werkzeugtausch","t":"Linie","nb":["Raum & Material"],"v":0,"s":0,"d":12,"a":"Trage Farbe nicht mit einem Pinsel, sondern nacheinander mit Karte, Schwamm, Stäbchen oder anderem ungefährlichem Werkzeug auf.","m":"Farbe, Papier, alternative Werkzeuge","f":"Welches Werkzeug erzeugt die reichste Spur mit dem kleinsten Eingriff?"},{"id":"100","n":"Finger als Werkzeug","t":"Raum & Material","nb":["Form","Zeit & Körper"],"v":0,"s":0,"d":10,"a":"Erzeuge eine kleine Tonwert- oder Texturfläche ausschließlich mit Fingerabdrücken.","m":"ungiftige Farbe/Stempelkissen, Papier","f":"Wann wird der einzelne Abdruck zur Fläche?"},{"id":"101","n":"Durchkratzen","t":"Raum & Material","nb":["Farbe","Linie"],"v":0,"s":1,"d":15,"a":"Lege zwei unterschiedlich gefärbte Schichten an und kratze nach dem Trocknen Linien oder Flächen aus der oberen Schicht.","m":"geeignete ungiftige Farben/Kreiden, Kratzwerkzeug","f":"Ist die freigelegte Spur eher Linie, Farbe oder Materialereignis?"},{"id":"102","n":"Schwerkraftspur","t":"Zufall","nb":["Farbe","Linie"],"v":0,"s":0,"d":12,"a":"Setze flüssige Farbe am Rand einer Fläche an und lass ausschließlich die Schwerkraft die erste Bewegung bestimmen. Drehe den Träger höchstens dreimal.","m":"flüssige Farbe/Tinte, Papier","f":"Welche Entscheidung war wichtiger: der Tropfen oder das Drehen?"},{"id":"103","n":"Punkt für Punkt","t":"Form","nb":["Linie"],"v":0,"s":0,"d":15,"a":"Baue eine Form oder Fläche ausschließlich aus Punkten auf und variiere nur Abstand, Größe und Dichte.","m":"Papier, Stifte/Farbe","f":"Wann verbinden sich einzelne Punkte optisch zu einer Fläche?"},{"id":"104","n":"Schaumplattendruck","t":"Form","nb":["Farbe","Raum & Material"],"v":0,"s":1,"d":20,"a":"Ritze eine einfache Form in weiches Druckmaterial, rolle Farbe auf und drucke mindestens zwei Varianten.","m":"Schaumdruckplatte, Stift, Druckfarbe, Papier, Walze/Farbroller","f":"Was ist im Druck anders als in der Platte?"},{"id":"105","n":"Gemaltes Papier collagieren","t":"Form","nb":["Farbe","Raum & Material"],"v":0,"s":1,"d":25,"a":"Male zunächst mehrere Papierflächen unterschiedlich, schneide sie danach in Formen und setze daraus eine neue Komposition zusammen.","m":"Papier, Farbe, Schere, Kleber","f":"Welche Spuren des Malens bleiben nach dem Schneiden wichtig?"},{"id":"106","n":"Geschnittene Formen","t":"Form","nb":["Raum & Material"],"v":0,"s":0,"d":18,"a":"Erzeuge eine Komposition hauptsächlich durch geschnittene statt gezeichnete Formen. Verschiebe sie mehrfach, bevor du fixierst.","m":"Farbpapier, Schere, Kleber optional","f":"Wie hat das wiederholte Verschieben die Platzierung der Formen verändert?"},{"id":"107","n":"Kartenwebrahmen","t":"Zeit & Körper","nb":["Raum & Material"],"v":0,"s":1,"d":25,"a":"Baue aus Karton einen kleinen einfachen Webrahmen und erzeuge ein Muster mit wenigen Fäden oder Papierstreifen.","m":"Karton, Faden/Papierstreifen, Schere","f":"Welche Ordnung entsteht allein durch das Über-und-Unter?"},{"id":"108","n":"Salzspur","t":"Linie","nb":["Raum & Material"],"v":0,"s":0,"d":12,"a":"Zeichne oder ordne Linien und Flächen mit Salz auf einem dunklen Untergrund und verändere sie mit einfachen Werkzeugen.","m":"Salz, dunkles Papier/Tablett, Löffel/Karte","f":"Was verändert sich, weil die Zeichnung jederzeit verschiebbar bleibt?"},{"id":"109","n":"Papier steht","t":"Raum & Material","nb":["Form"],"v":0,"s":1,"d":20,"a":"Verwandle ein einziges Blatt durch Falten, Einschnitte und Stecken in eine selbststehende Form. Kein Kleber.","m":"Papier/Karton, Schere","f":"Wo trägt das Papier sich selbst?"},{"id":"110","n":"Papier verzahnen","t":"Raum & Material","nb":["Form"],"v":0,"s":1,"d":20,"a":"Schneide mehrere Schlitze in Papierformen und verbinde sie durch Ineinanderstecken zu einer räumlichen Struktur.","m":"Papier/Karton, Schere","f":"Welche Steckung gibt mit dem wenigsten Material die meiste Stabilität?"},{"id":"111","n":"Ton: drücken, rollen, ziehen","t":"Raum & Material","nb":["Zeit & Körper"],"v":0,"s":0,"d":12,"a":"Erzeuge aus einem Stück Ton oder Knete mindestens sechs unterschiedliche Spuren bzw. Formveränderungen, ohne etwas Bestimmtes darstellen zu wollen.","m":"Ton/Knete, Unterlage","f":"Welche Bewegung beantwortet das Material am deutlichsten?"},{"id":"112","n":"Bauen – verändern – bauen","t":"Form","nb":["Raum & Material"],"v":0,"s":1,"d":18,"a":"Baue aus Ton/Knete eine einfache Form, verändere sie radikal und entwickle aus dem veränderten Zustand eine zweite stabile Form.","m":"Ton/Knete","f":"Was aus der ersten Form blieb in der zweiten erhalten?"},{"id":"113","n":"Fundstück-Assemblage","t":"Raum & Material","nb":[],"v":1,"s":1,"d":20,"a":"Verbinde fünf gefundene ungefährliche Materialien zu einer kleinen Struktur. Mindestens zwei Verbindungen müssen ohne Kleber funktionieren.","m":"Fundmaterialien, optional Schnur/Klammern","f":"Welche Verbindung wirkt materialgerecht statt nur praktisch?"},{"id":"114","n":"Frottage-Serie","t":"Raum & Material","nb":["Linie"],"v":0,"s":0,"d":12,"a":"Erzeuge von derselben Oberfläche vier Frottagen mit unterschiedlichen Stiften, Druckstärken oder Papieren.","m":"Papier, weiche Zeichenmittel, Oberfläche","f":"Welche Kombination macht die Oberfläche am sichtbarsten?"},{"id":"115","n":"Monoprint aus Restfarbe","t":"Linie","nb":["Farbe","Raum & Material"],"v":0,"s":1,"d":18,"a":"Verteile dünn Farbe auf einer glatten ungefährlichen Platte, zeichne/entferne darin Spuren und drucke einmalig auf Papier.","m":"ungiftige Farbe, glatte Platte, Papier","f":"Welche Spur gehört der Platte und welche erst dem Druck?"},{"id":"116","n":"Schablone: positiv / negativ","t":"Form","nb":["Farbe","Raum & Material"],"v":0,"s":0,"d":18,"a":"Schneide eine einfache Schablone und nutze sowohl die ausgeschnittene Form als auch das Loch für zwei gegensätzliche Abdrücke.","m":"Papier/Karton, Schere, Farbe","f":"Welche Version liest sich schneller als Figur?"},{"id":"117","n":"Nass / trocken","t":"Raum & Material","nb":["Farbe"],"v":0,"s":0,"d":12,"a":"Erzeuge mit derselben Farbe je eine Fläche nass-in-nass und eine mit möglichst trockenem Werkzeug. Vergleiche die Ränder und Texturen.","m":"Aquarell/Gouache o. Ä., Papier, Pinsel","f":"Wo entscheidet das Wasser stärker als deine Hand?"},{"id":"118","n":"Schicht über Schicht","t":"Farbe","nb":["Raum & Material"],"v":0,"s":1,"d":15,"a":"Lege drei transparente oder halbtransparente Schichten übereinander und plane, wo neue Mischfarben oder Verdichtungen entstehen.","m":"Lasur/Farbfolie/Transparentpapier","f":"Welche Farbe oder Form existiert erst durch die Überlagerung?"},{"id":"119","n":"30 Sekunden – 3 Minuten – 10 Minuten","t":"Zeit & Körper","nb":["Form"],"v":0,"s":0,"d":15,"a":"Setze dasselbe Motiv dreimal um: sehr kurz, mittel und langsam. Verwende dasselbe Werkzeug.","m":"Objekt, Papier, Zeichenmittel","f":"Was kommt erst mit Zeit hinzu – und was geht dabei verloren?"},{"id":"120","n":"Zwölf Variationen","t":"Form","nb":["Zeit & Körper"],"v":0,"s":1,"d":20,"a":"Erzeuge zwölf sehr kleine Versionen derselben Ausgangsform; jede darf sich nur in einem Merkmal verändern.","m":"Papier, Zeichen-/Collagemittel","f":"Welche kleine Veränderung hat die größte Wirkung?"},{"id":"121","n":"Nur sehen","t":"Symbol & Würdigung","nb":[],"v":1,"s":0,"d":5,"a":"Betrachte deine Arbeit eine Minute und notiere fünf rein sichtbare Tatsachen, ohne Bedeutung oder Bewertung.","m":"eigene Arbeit, Papier optional","f":"Welche Tatsache hattest du beim Machen nicht bemerkt?"},{"id":"122","n":"Zweites Sehen","t":"Zeit & Körper","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Notiere beim ersten Blick fünf Dinge. Schau 30 Sekunden weiter und finde danach fünf neue Beobachtungen, die vorher fehlten.","m":"eigene Arbeit","f":"Was hat sich durch längeres Sehen verändert – oder nichts?"},{"id":"123","n":"Farbe – Form – Linie","t":"Symbol & Würdigung","nb":["Farbe","Form"],"v":1,"s":0,"d":5,"a":"Beschreibe die Arbeit nacheinander nur unter drei Aspekten: Farben, Formen, Linien.","m":"eigene Arbeit","f":"Welche Kategorie erzählt am meisten über die Arbeit?"},{"id":"124","n":"Erster Blick / zweiter Blick","t":"Symbol & Würdigung","nb":[],"v":1,"s":0,"d":5,"a":"Halte deinen ersten Eindruck in drei Wörtern fest. Betrachte die Arbeit länger und ersetze danach mindestens eines der Wörter.","m":"eigene Arbeit","f":"Was hat sich zwischen erstem und zweitem Blick verändert, und was nicht?"},{"id":"125","n":"Überraschendste Stelle","t":"Zufall","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Finde eine Stelle, die nicht vollständig geplant war und dennoch wichtig geworden ist. Markiere oder fotografiere sie.","m":"eigene Arbeit, Kamera optional","f":"Möchtest du diese Stelle behalten? Warum oder warum nicht?"},{"id":"126","n":"Blickmagnet","t":"Symbol & Würdigung","nb":["Linie"],"v":1,"s":0,"d":5,"a":"Beobachte, wohin dein Blick zuerst geht und wohin er danach wandert. Zeichne den Blickweg als Pfeile auf einer Kopie oder im Kopf nach.","m":"eigene Arbeit, optional Foto/Kopie","f":"Was zieht an – Größe, Kontrast, Farbe, Lage oder etwas anderes?"},{"id":"127","n":"Drei Distanzen","t":"Symbol & Würdigung","nb":["Raum & Material"],"v":1,"s":0,"d":5,"a":"Betrachte die Arbeit nah, aus normaler Distanz und möglichst weit entfernt. Notiere je eine Veränderung.","m":"eigene Arbeit","f":"Welche Distanz zeigt dir die Arbeit am klarsten?"},{"id":"128","n":"Gedreht betrachten","t":"Form","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":4,"a":"Drehe die Arbeit um 90°, 180° und 270°, ohne sie zu verändern.","m":"eigene Arbeit","f":"Welche Ausrichtung wirkt überraschend stabil?"},{"id":"129","n":"Eigenständiger Ausschnitt","t":"Symbol & Würdigung","nb":["Form"],"v":1,"s":0,"d":6,"a":"Suche mit einem Rahmen den stärksten kleinen Ausschnitt der Arbeit und dokumentiere ihn separat.","m":"eigene Arbeit, Papierrahmen/Kamera","f":"Was besitzt der Ausschnitt, das im Ganzen weniger sichtbar ist?"},{"id":"130","n":"Titel danach","t":"Symbol & Würdigung","nb":[],"v":1,"s":0,"d":4,"a":"Gib der Arbeit erst nach genauer Betrachtung einen kurzen Titel von höchstens vier Wörtern.","m":"eigene Arbeit","f":"Bezeichnet der Titel das Sichtbare oder verändert er dessen Lesart?"},{"id":"131","n":"Drei Verben","t":"Zeit & Körper","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":4,"a":"Beschreibe die Arbeit mit drei Verben statt mit Eigenschaftswörtern.","m":"eigene Arbeit","f":"Was tut die Arbeit, wenn du sie als Vorgang statt als Ding beschreibst?"},{"id":"132","n":"Fünf Formwörter","t":"Form","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Finde fünf präzise formale Wörter, z. B. dicht, offen, geknickt, transparent, schwer – ohne 'schön' oder 'hässlich'.","m":"eigene Arbeit","f":"Welches Wort passt nur auf einen kleinen Teil und prägt trotzdem das Ganze?"},{"id":"133","n":"Wie wurde es gemacht?","t":"Symbol & Würdigung","nb":["Linie","Zeit & Körper"],"v":1,"s":1,"d":6,"a":"Betrachte die fertige Arbeit, als hättest du sie nicht selbst gemacht, und rekonstruiere fünf sichtbare Herstellungsschritte.","m":"eigene Arbeit","f":"Welche Arbeitsspur verrät am meisten über den Prozess?"},{"id":"134","n":"Drei Entscheidungen","t":"Zufall","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Identifiziere drei Stellen, an denen eine konkrete Entscheidung sichtbar ist: Farbe, Schnitt, Richtung, Ende, Überlagerung …","m":"eigene Arbeit","f":"Welche Entscheidung war am folgenreichsten für alles Weitere?"},{"id":"135","n":"Drei Zufälle","t":"Zufall","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Finde drei Stellen, die nicht vollständig geplant waren. Entscheide bei jeder: behalten, verändern oder neutral.","m":"eigene Arbeit","f":"Wann wird ein Zufall durch dein Behalten zur Entscheidung?"},{"id":"136","n":"Regelprüfung","t":"Form","nb":["Symbol & Würdigung","Zufall"],"v":1,"s":0,"d":5,"a":"Erinnere dich an die zentrale Einschränkung der Übung und suche drei Stellen, an denen sie die Arbeit sichtbar geprägt hat.","m":"eigene Arbeit","f":"Wo hat die Regel etwas ermöglicht, das ohne sie nicht entstanden wäre?"},{"id":"137","n":"Kontrastkarte","t":"Symbol & Würdigung","nb":["Form"],"v":1,"s":0,"d":5,"a":"Suche die drei stärksten Kontraste in der Arbeit und benenne jeweils, worin sie bestehen.","m":"eigene Arbeit","f":"Welcher Kontrast strukturiert das Ganze am stärksten?"},{"id":"138","n":"Rhythmuskarte","t":"Zeit & Körper","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Suche Wiederholungen und markiere gedanklich oder auf einer Kopie ihre Folge und Unterbrechungen.","m":"eigene Arbeit, optional Kopie","f":"Wo wird Wiederholung zum Rhythmus – und wo nur zum Muster?"},{"id":"139","n":"Figur-Grund-Test","t":"Form","nb":["Symbol & Würdigung"],"v":1,"s":1,"d":5,"a":"Benenne, was du zuerst als Figur und was als Hintergrund liest. Versuche danach, diese Lesart bewusst umzukehren.","m":"eigene Arbeit","f":"Welche Bereiche lassen sich nicht eindeutig einer Seite zuordnen?"},{"id":"140","n":"Farbhierarchie","t":"Farbe","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":5,"a":"Ordne alle verwendeten Farben danach, wie stark sie deine Aufmerksamkeit beanspruchen – nicht danach, wie viel Fläche sie einnehmen.","m":"eigene Arbeit","f":"Welche kleine Farbfläche ist stärker als eine große?"},{"id":"141","n":"Fünf-Werte-Thumbnail","t":"Farbe","nb":["Form"],"v":1,"s":1,"d":8,"a":"Übertrage die Arbeit winzig klein nur in fünf Hell-Dunkel-Werten.","m":"eigene Arbeit, Papier, Bleistift","f":"Bleibt die Komposition ohne Farbe verständlich?"},{"id":"142","n":"Fünf Linien","t":"Linie","nb":["Form"],"v":1,"s":1,"d":6,"a":"Reduziere die Komposition nachträglich auf höchstens fünf Richtungs- oder Struktur-Linien.","m":"eigene Arbeit, Papier","f":"Welche Linie trägt die Gesamtbewegung?"},{"id":"143","n":"Zwei Versionen vergleichen","t":"Symbol & Würdigung","nb":["Form"],"v":1,"s":0,"d":6,"a":"Lege zwei Varianten derselben Aufgabe nebeneinander und notiere drei formale Unterschiede und eine unerwartete Gemeinsamkeit.","m":"zwei Arbeiten","f":"Welche Entscheidungen erklären die Unterschiede zwischen den Versionen?"},{"id":"144","n":"Nur eine Änderung","t":"Symbol & Würdigung","nb":["Zufall"],"v":1,"s":1,"d":5,"a":"Wähle nach der Betrachtung genau eine Veränderung, die du noch vornehmen darfst. Alles andere bleibt.","m":"eigene Arbeit, Material","f":"Warum ist genau diese eine Änderung wichtiger als alle anderen?"},{"id":"145","n":"Ein Element wegdenken","t":"Form","nb":["Symbol & Würdigung"],"v":1,"s":0,"d":4,"a":"Stell dir vor, ein // Gouache-Pigmente, in der Reihenfolge des Farbkreises
const THEMES = [
  { name: "Farbe", c: "#b3304d" },
  { name: "Linie", c: "#d9782d" },
  { name: "Form", c: "#e4b83c" },
  { name: "Raum & Material", c: "#4f8a5b" },
  { name: "Zeit & Körper", c: "#3f6ba8" },
  { name: "Zufall", c: "#4e4a94" },
  { name: "Symbol & Würdigung", c: "#85508f" }
];
const N = THEMES.length, S = 360 / N, SPIN_MS = 5600;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

function pt(r, deg) { const a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; }
function sector(r1, r2, a0, a1) {
  const [x1, y1] = pt(r2, a0), [x2, y2] = pt(r2, a1), [x3, y3] = pt(r1, a1), [x4, y4] = pt(r1, a0);
  return `M${x1} ${y1} A${r2} ${r2} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 0 0 ${x4} ${y4} Z`;
}
function build(g, r1, r2) {
  THEMES.forEach((t, i) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("class", "seg");
    p.setAttribute("d", sector(r1, r2, i * S, (i + 1) * S));
    p.setAttribute("fill", t.c);
    g.appendChild(p);
  });
}
// Äusseres Rad: Farbring plus Namensring mit den Themen
build($("outer"), 64, 94);
(function labels() {
  const g = $("outer");
  const band = document.createElementNS(NS, "path");
  band.setAttribute("d", sector(94, 107, 0, 359.99));
  band.setAttribute("fill", "none");
  const c1 = document.createElementNS(NS, "circle"); c1.setAttribute("r", 94); c1.setAttribute("class", "ring");
  g.appendChild(c1);
  THEMES.forEach((t, i) => {
    const a0 = i * S + 1.5, a1 = (i + 1) * S - 1.5;
    const [x0, y0] = pt(99.5, a0), [x1, y1] = pt(99.5, a1);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("id", "arc" + i);
    path.setAttribute("d", `M${x0} ${y0} A99.5 99.5 0 0 1 ${x1} ${y1}`);
    path.setAttribute("fill", "none");
    g.appendChild(path);
  });
})();
build($("inner"), 28, 58);


let outerDeg = 0, innerDeg = 0, busy = false, outerIdx = null, innerIdx = null;
const seen = {};

function hex(c) { return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); }
function blend(a, b) {
  const x = hex(a), y = hex(b);
  return "rgb(" + x.map((v, i) => Math.round((v + y[i]) / 2)).join(",") + ")";
}
// Zielwinkel so wählen, dass das Rad in Drehrichtung mindestens zwei Runden läuft
function landing(cur, idx, outer, up) {
  const a = (idx + 0.2 + Math.random() * 0.6) * S;
  const t = outer ? -a : a;
  const m = (x) => ((x % 360) + 360) % 360;
  return up ? cur + 720 + m(t - cur) : cur - 720 - m(cur - t);
}

function pick(a, b) {
  let pool = EX.filter((e) => e.t === a && (b === null || e.nb.includes(b)));
  if (b !== null && !pool.length) pool = EX.filter((e) => e.t === b && e.nb.includes(a));
  if (!pool.length) pool = EX.filter((e) => e.t === a);
  pool = pool.slice().sort((x, y) => x.v - y.v || x.s - y.s || x.d - y.d || x.id.localeCompare(y.id));
  const key = a + "|" + b;
  const used = (seen[key] = seen[key] || new Set());
  let next = pool.find((e) => !used.has(e.id));
  if (!next) { used.clear(); next = pool[0]; }
  used.add(next.id);
  return next;
}

function show(e, a, b) {
  const chip = (i) => `<span class="chip"><span class="dot" style="background:${THEMES[i].c}"></span>${THEMES[i].name}</span>`;
  const idx = (name) => THEMES.findIndex((t) => t.name === name);
  const chips = [chip(a)].concat(b !== null ? [chip(b)] : []).join("");
  $("card").hidden = false;
  $("card").innerHTML = `
    <div class="chips">${chips}</div>
    <h2></h2>
    <div class="meta"><span>${e.d} Min.</span><span class="mat"></span></div>
    <p class="task"></p>
    <p class="end"><small>Zum Schluss</small><span class="q"></span></p>
    <span class="idline">Übung ${e.id} · Thema ${THEMES[idx(e.t)].name}</span>`;
  const c = $("card");
  c.querySelector("h2").textContent = e.n;
  c.querySelector(".mat").textContent = "Material: " + e.m;
  c.querySelector(".task").textContent = e.a;
  c.querySelector(".q").textContent = e.f;
}

// Nach dem Wischen läuft das Rad sofort mit Schwung weiter und bremst nur aus
const FLICK = "transform 5.2s cubic-bezier(.22, .6, .15, 1)";
function spin(dir = 1, flick = false) {
  $("outer").style.transition = flick ? FLICK : "";
  $("inner").style.transition = flick ? FLICK : "";
  if (busy) return;
  busy = true; $("go").disabled = true;
  outerIdx = Math.floor(Math.random() * N);
  innerIdx = Math.floor(Math.random() * N);
  outerDeg = landing(outerDeg, outerIdx, true, dir > 0);
  innerDeg = landing(innerDeg, innerIdx, false, dir > 0);
  $("outer").style.transform = `rotate(${outerDeg}deg)`;
  $("inner").style.transform = `rotate(${-innerDeg}deg)`;
  $("mixdot").style.fill = outerIdx === innerIdx ? THEMES[outerIdx].c : blend(THEMES[outerIdx].c, THEMES[innerIdx].c);
  const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : SPIN_MS + 80;
  setTimeout(() => {
    const pure = outerIdx === innerIdx;
    const b = pure ? null : innerIdx;
    show(pick(THEMES[outerIdx].name, b === null ? null : THEMES[b].name), outerIdx, b);
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("card").scrollIntoView({ behavior: still ? "auto" : "smooth", block: matchMedia("(min-width: 800px)").matches ? "nearest" : "start" });
    busy = false; $("go").disabled = false;
  }, wait);
}

$("go").addEventListener("click", () => spin(1));

// Mit dem Daumen: Rad mitziehen und loslassen; kurzes Tippen dreht ebenfalls
const wheel = $("wheel");
let drag = null;
function angleAt(e) {
  const r = wheel.getBoundingClientRect();
  const cx = r.left + r.width * 112 / 224, cy = r.top + r.height * 120 / 232;
  return Math.atan2(e.clientX - cx, -(e.clientY - cy)) * 180 / Math.PI;
}
function setTransition(on) { $("outer").style.transition = on ? "" : "none"; $("inner").style.transition = on ? "" : "none"; }
wheel.addEventListener("pointerdown", (e) => {
  if (busy) return;
  wheel.setPointerCapture(e.pointerId);
  drag = { last: angleAt(e), moved: 0 };
  setTransition(false);
});
wheel.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const a = angleAt(e);
  let d = a - drag.last;
  if (d > 180) d -= 360; if (d < -180) d += 360;
  drag.last = a; drag.moved += d;
  outerDeg += d; innerDeg += d;
  $("outer").style.transform = `rotate(${outerDeg}deg)`;
  $("inner").style.transform = `rotate(${-innerDeg}deg)`;
});
function release() {
  if (!drag) return;
  const moved = drag.moved; drag = null;
  setTransition(true);
  requestAnimationFrame(() => spin(moved < -3 ? -1 : 1, Math.abs(moved) > 3));
}
wheel.addEventListener("pointerup", release);
wheel.addEventListener("pointercancel", release);
</script>
