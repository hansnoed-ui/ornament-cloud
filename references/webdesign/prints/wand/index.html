<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prints – Wand</title>
<meta name="robots" content="noindex">
<meta name="description" content="Einstiegsseite für Prints als Referenz: Ein Print hängt gerahmt an einer Wand in seiner eigenen Grundfarbe, Fensterlicht und der Schatten eines Zweigs wandern darüber.">
<link rel="stylesheet" href="../../../../vendor/fonts/animationen.css">
<style>
/* Referenz «Prints – Wand» (22. November 2026). Ein Raum statt einer Seite: Die Wand nimmt die Grundfarbe des Prints auf
   (Arbeitsname «Kopf in Blau»), der Print hängt gerahmt mit Passepartout. Fensterlicht und der Schatten eines Zweigs
   ziehen langsam darüber; der Zeiger neigt den Rahmen kaum merklich und verschiebt den Glanz auf dem Glas. */
:root{
  --wand:#cfe3f1;
  --tinte:#13243a;
  --leise:rgba(19,36,58,.62);
  --linie:rgba(19,36,58,.22);
  --rahmen:#1c1d20;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rand:40px;
  --nx:0; --ny:0;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--wand);color:var(--tinte);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background-color 1.2s}
a{color:inherit}
:focus-visible{outline:2px solid var(--tinte);outline-offset:4px;border-radius:3px}

/* Wand: oben etwas heller, unten zur Fussleiste dunkler, leichtes Korn */
.wand{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(10,30,50,.10)),
             radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.18),transparent 60%)}
.korn{position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply}

.rahmen{--gr:min(52vh,38vw);position:fixed;left:54%;top:47%;width:var(--gr);height:var(--gr);box-sizing:border-box;margin:0;
  transform:translate(-50%,-50%) perspective(1400px) rotateY(calc(var(--nx) * 2.2deg)) rotateX(calc(var(--ny) * -1.6deg));
  border:clamp(7px,.9vh,11px) solid var(--rahmen);background:#fbfbf8;padding:calc(var(--gr) * .14);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 2px 6px rgba(0,0,0,.12),
             calc(var(--nx) * -6px) 3px 4px rgba(10,25,40,.22),
             calc(var(--nx) * -14px) 22px 34px -6px rgba(10,25,40,.30),
             calc(var(--nx) * -24px) 60px 90px -30px rgba(10,25,40,.35);
  transition:opacity 1.2s;opacity:0}
.rahmen.da{opacity:1}
.rahmen img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.08),inset 0 0 0 1px rgba(0,0,0,.1)}
/* Passepartout-Fase */
.rahmen::before{content:"";position:absolute;inset:calc(var(--gr) * .14 - 14px);border:3px solid #f2f1ec;box-shadow:inset 1px 1px 0 rgba(0,0,0,.08);pointer-events:none}
/* Glas: ein breiter, schräger Glanz, der mit dem Zeiger wandert */
.rahmen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent calc(30% + var(--nx) * 12%),rgba(255,255,255,.22) calc(38% + var(--nx) * 12%),transparent calc(52% + var(--nx) * 12%));mix-blend-mode:screen}

/* Fensterlicht: vier Scheiben, schräg und weich, wandern sehr langsam */
.licht{position:fixed;left:-10vw;top:-12vh;width:70vw;height:110vh;pointer-events:none;mix-blend-mode:soft-light;filter:blur(16px);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3.2vw;padding:2vw;
  transform:translate(calc(var(--nx) * -1.5vw),0) skewX(-22deg) rotate(-6deg);animation:wandern 70s ease-in-out infinite alternate}
.licht i{background:rgba(255,250,232,.95);border-radius:2px}
@keyframes wandern{from{translate:-4vw 0}to{translate:22vw 2vh}}
.zweig{position:fixed;right:-6vw;top:-8vh;width:min(62vw,720px);pointer-events:none;mix-blend-mode:multiply;filter:blur(5px);opacity:.28;
  transform-origin:90% 8%;animation:wiegen 9s ease-in-out infinite alternate}
@keyframes wiegen{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}

.marke{position:fixed;left:max(var(--rand),env(safe-area-inset-left,0px));top:calc(30px + env(safe-area-inset-top,0px));font-weight:600;font-size:15px;text-decoration:none}
.text{position:fixed;left:max(var(--rand),env(safe-area-inset-left,0px));bottom:calc(var(--rand) + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-width:min(420px,calc(100vw - 2 * var(--rand)))}
.text h1{margin:0;font-weight:300;font-size:clamp(60px,8vw,132px);line-height:.86;letter-spacing:-.05em}
.text p{margin:0;font-size:16px;line-height:1.45;color:var(--leise);max-width:30ch}
.wege{display:flex;flex-wrap:wrap;gap:10px 22px}
.wege a{font-weight:600;font-size:16px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.wege a.still{font-weight:400;color:var(--leise);border-bottom-color:var(--linie)}
.schild{position:fixed;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--leise);line-height:1.5;pointer-events:none}
@media (max-width:760px){
  :root{--rand:20px}
  .marke{top:calc(22px + env(safe-area-inset-top,0px))}
  .rahmen{--gr:min(74vw,44vh);left:50%;top:36%}
  .text h1{font-size:60px}
  .text p{font-size:15px}
  .schild{display:none}
}
@media (prefers-reduced-motion:reduce){ .licht,.zweig{animation:none} .rahmen{transition:none} }
</style>
</head>
<body>
<div class="wand" aria-hidden="true"></div>
<canvas class="korn" id="korn" aria-hidden="true"></canvas>
<figure class="rahmen" id="rahmen"><img id="bild" src="/b/bilder/fotografie/print-kopf-blau-1600.jpg" alt="Ein gemalter Kopf mit blauem Gesicht, roten Lippen und zwei verschiedenen Augen vor hellblauem Grund, darüber zwei gelbe Scheiben an einem schwarzen Stab" width="1600" height="1600"></figure>
<div class="licht" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<svg class="zweig" id="zweig" viewBox="0 0 600 520" aria-hidden="true"></svg>
<span class="schild" id="schild" aria-hidden="true">Print · gerahmt</span>

<a class="marke" href="/start/">ornament.cloud</a>
<section class="text">
  <h1>Prints</h1>
  <p>Acht Motive. Format, Papier und Preis auf Anfrage.</p>
  <div class="wege"><a href="/werke/">Alle Prints</a><a class="still" href="mailto:hansnoed@gmail.com?subject=Prints">Anfragen</a></div>
</section>

<script>
(() => {
"use strict";
const root = document.documentElement, bild = document.getElementById("bild"), rahmen = document.getElementById("rahmen");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Die Wand nimmt die Grundfarbe des Prints auf: Mittel der Randpixel, eine Spur gedämpft
function wandfarbe() {
  try {
    const c = document.createElement("canvas"), n = 40; c.width = c.height = n;
    const x = c.getContext("2d"); x.drawImage(bild, 0, 0, n, n);
    const d = x.getImageData(0, 0, n, n).data; let r = 0, g = 0, b = 0, z = 0;
    for (let i = 0; i < n; i++) for (const [px, py] of [[i, 0], [i, n - 1], [0, i], [n - 1, i]]) { const k = (py * n + px) * 4; r += d[k]; g += d[k + 1]; b += d[k + 2]; z++; }
    const f = .93; r = Math.round(r / z * f); g = Math.round(g / z * f); b = Math.round(b / z * f);
    root.style.setProperty("--wand", `rgb(${r},${g},${b})`);
    // Schrift: dieselbe Farbe, sehr dunkel
    root.style.setProperty("--tinte", `rgb(${Math.round(r * .14)},${Math.round(g * .17)},${Math.round(b * .24)})`);
  } catch (e) {}
}
function zeigen() { wandfarbe(); rahmen.classList.add("da"); schild(); }
if (bild.complete && bild.naturalWidth) zeigen(); else bild.addEventListener("load", zeigen);

// Schildchen rechts unter dem Rahmen
function schild() {
  const r = rahmen.getBoundingClientRect(), s = document.getElementById("schild");
  s.style.left = (r.right + 22) + "px"; s.style.top = (r.bottom - 26) + "px";
}
addEventListener("resize", schild);

// Korn der Wand
(() => {
  const c = document.getElementById("korn"), n = 180; c.width = c.height = n; c.style.width = "100%"; c.style.height = "100%"; c.style.imageRendering = "pixelated";
  const x = c.getContext("2d"), d = x.createImageData(n, n);
  for (let i = 0; i < d.data.length; i += 4) { const v = 150 + Math.random() * 105; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  c.style.backgroundImage = `url(${c.toDataURL()})`; c.style.backgroundSize = "180px 180px"; x.clearRect(0, 0, n, n);
})();

// Zweig: ein Ast mit Blättern als Schatten
(() => {
  const svg = document.getElementById("zweig"), NS = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(NS, "g"); g.setAttribute("fill", "#0f2236"); g.setAttribute("stroke", "#0f2236");
  const ast = document.createElementNS(NS, "path");
  ast.setAttribute("d", "M600 30 C 470 60 380 120 300 210 S 170 380 90 470"); ast.setAttribute("fill", "none"); ast.setAttribute("stroke-width", "7"); g.append(ast);
  let zufall = 7; const rnd = () => (zufall = (zufall * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 34; i++) {
    const t = i / 34, x = 600 - 510 * t + Math.sin(t * 5) * 20, y = 30 + 440 * t + Math.cos(t * 4) * 18;
    const w = 26 + rnd() * 22, h = 9 + rnd() * 6, dreh = (i % 2 ? 40 : -50) + rnd() * 40 - 20 + t * 30, abst = 22 + rnd() * 16, s = i % 2 ? 1 : -1;
    const blatt = document.createElementNS(NS, "ellipse");
    blatt.setAttribute("cx", (x + s * abst * .6).toFixed(1)); blatt.setAttribute("cy", (y - s * abst * .4).toFixed(1));
    blatt.setAttribute("rx", w.toFixed(1)); blatt.setAttribute("ry", h.toFixed(1)); blatt.setAttribute("stroke", "none");
    blatt.setAttribute("transform", `rotate(${dreh.toFixed(1)} ${(x + s * abst * .6).toFixed(1)} ${(y - s * abst * .4).toFixed(1)})`);
    g.append(blatt);
  }
  svg.append(g);
})();

// Zeiger: Rahmen neigt sich kaum merklich, Glanz und Schatten wandern
let nx = 0, ny = 0, zx = 0, zy = 0;
addEventListener("pointermove", e => { zx = (e.clientX / innerWidth - .5) * 2; zy = (e.clientY / innerHeight - .5) * 2; });
function schleife() {
  nx += (zx - nx) * .05; ny += (zy - ny) * .05;
  root.style.setProperty("--nx", nx.toFixed(3)); root.style.setProperty("--ny", ny.toFixed(3));
  requestAnimationFrame(schleife);
}
if (!reduce) requestAnimationFrame(schleife);
})();
</script>
</body>
</html>
