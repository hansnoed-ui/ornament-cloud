<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prints</title>
<meta name="robots" content="noindex">
<meta name="description" content="Einstiegsseite für Prints als Referenz: ein Motiv als Vierfarbenraster auf dem Druckbogen, darunter acht Motive, jedes mit Lupe, Raster und Ansicht an der Wand.">
<meta name="theme-color" content="#f4f4f1">
<link rel="stylesheet" href="../../../vendor/fonts/animationen.css">
<style>
/* Referenz «Prints» (22. November 2026; Christian: «A find ich super. C würd ich dann für die einzelnen prints nehmen»).
   Oben ein Druckbogen: das Motiv als Vierfarbenraster (Rasterwinkel C 15°, M 75°, Y 0°, K 45°), die Platten fallen
   nacheinander ins Register, der Zeiger verschiebt sie leicht (Passer). Darunter die acht Motive als Bögen; beim
   Darüberfahren werden sie gerastert. Jedes öffnet eine dunkle Ansicht mit zwei Arten zu schauen: Lupe und Wand (das Raster dort seit 22. November 2026
   heraus, Christian: «Das Raster kannst du als Möglichkeit rausnehmen bei der presentation der einzelnen prints»). */
:root{
  --papier:#f4f4f1;
  --bogen:#fbfbf9;
  --tinte:#141416;
  --leise:rgba(20,20,22,.58);
  --linie:rgba(20,20,22,.16);
  --magenta:#e6007e;
  --nacht:#0b0b0c;
  --hell:#f1efe9;
  --hell-leise:rgba(241,239,233,.6);
  --hell-linie:rgba(241,239,233,.2);
  --wand:#2a2a2c;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rand:40px;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.innen{padding-left:max(var(--rand),env(safe-area-inset-left,0px));padding-right:max(var(--rand),env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:4px;border-radius:3px}
.nurleser{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Bogen oben ---------- */
.kopf{position:relative;height:100vh;height:100svh;min-height:560px}
#bogen{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.marke{position:absolute;left:max(var(--rand),env(safe-area-inset-left,0px));top:calc(30px + env(safe-area-inset-top,0px));font-weight:600;font-size:15px;text-decoration:none}
.text{position:absolute;right:max(var(--rand),env(safe-area-inset-right,0px));bottom:var(--rand);width:min(380px,calc(100vw - 2 * var(--rand)));display:grid;gap:18px}
.text h1{margin:0;font-weight:600;font-size:clamp(64px,9vw,150px);line-height:.86;letter-spacing:-.055em}
.text h1 span{color:var(--magenta)}
.text p{margin:0;font-size:16px;line-height:1.45;color:var(--leise);max-width:30ch}
.wege{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.wege a{font-weight:600;font-size:16px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.wege a.still{font-weight:400;color:var(--leise);border-bottom-color:var(--linie)}
.zurueck{position:absolute;right:max(var(--rand),env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));z-index:2;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--linie);background:var(--bogen);display:grid;place-items:center;text-decoration:none;font-size:20px;line-height:1;color:var(--tinte)}
.zurueck:hover{border-color:var(--leise)}
.zurueck[hidden]{display:none}
.schalter{position:absolute;display:flex;border:1px solid var(--linie);border-radius:999px;padding:3px;background:var(--bogen);transform:translateX(-50%);visibility:hidden}
.schalter.da{visibility:visible}
.schalter button,.modi button{appearance:none;border:0;background:none;border-radius:999px;padding:6px 13px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--leise);cursor:pointer}
.schalter button[aria-pressed="true"]{background:var(--tinte);color:var(--bogen)}

/* ---------- Acht Motive ---------- */
.motive{padding-block:120px 140px}
.motive-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:48px;border-top:1px solid var(--linie);padding-top:18px}
.motive-kopf h2{margin:0;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.motive-kopf span{font-family:var(--mono);font-size:12px;color:var(--leise)}
.raster-feld{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 40px;align-items:end}
.blatt{display:grid;gap:12px}
.blatt button{appearance:none;border:0;padding:9%;background:var(--bogen);cursor:zoom-in;position:relative;display:block;width:100%;
  box-shadow:0 1px 2px rgba(20,20,30,.08),0 14px 30px -12px rgba(20,20,30,.22);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.blatt button:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 1px 2px rgba(20,20,30,.08),0 26px 44px -16px rgba(20,20,30,.3)}
.blatt .flaeche{position:relative;display:block}
.blatt img{display:block;width:100%;height:auto}
.blatt canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none}
.blatt .zahl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--leise);display:flex;justify-content:space-between}
.fuss{padding-block:28px 40px;border-top:1px solid var(--linie);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--leise)}
.fuss a{text-decoration:none}

/* ---------- Ansicht eines Motivs ---------- */
.ansicht{position:fixed;inset:0;z-index:10;background:var(--nacht);color:var(--hell);display:grid;grid-template-rows:auto 1fr auto;
  opacity:0;visibility:hidden;transition:background-color .8s,color .8s,opacity .35s,visibility 0s .35s}
.ansicht.offen{opacity:1;visibility:visible;transition:background-color .8s,color .8s,opacity .35s}
.ansicht.wand{background:var(--wand);color:var(--tinte)}
.a-kopf,.a-fuss{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 0}
.a-fuss{padding-block:0 calc(22px + env(safe-area-inset-bottom,0px))}
.a-zahl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.7}
.rund{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid currentColor;background:none;cursor:pointer;font-size:18px;line-height:1;opacity:.75;display:grid;place-items:center}
.rund:hover{opacity:1}
.a-buehne{position:relative;overflow:hidden;touch-action:none}
.modi{display:flex;border:1px solid var(--hell-linie);border-radius:999px;padding:3px}
.ansicht.wand .modi{border-color:var(--linie)}
.modi button{color:inherit;opacity:.65}
.modi button[aria-pressed="true"]{opacity:1;background:var(--hell);color:var(--nacht)}
.ansicht.wand .modi button[aria-pressed="true"]{background:var(--tinte);color:var(--bogen)}
.a-kopf .rechts{display:flex;gap:20px;align-items:center}
.a-kopf a{font-weight:600;font-size:15px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.ebene{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
.ebene.an{opacity:1}
.ansicht.offen .ebene.an{pointer-events:auto}
/* Lupe */
.tisch{position:absolute;cursor:none}
.tisch img{display:block;width:100%;height:100%;filter:brightness(.45) saturate(.75);transition:filter 1s}
.tisch.wach img{filter:brightness(.55) saturate(.85)}
.lupe{position:absolute;left:var(--lx);top:var(--ly);width:calc(var(--lr) * 2);height:calc(var(--lr) * 2);margin:calc(var(--lr) * -1) 0 0 calc(var(--lr) * -1);
  border-radius:50%;pointer-events:none;background-repeat:no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 0 7px rgba(255,255,255,.05),0 18px 50px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.35)}
.lupe::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.16),transparent 38%)}
.schein{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle at var(--lx) var(--ly),rgba(255,236,220,.16),transparent calc(var(--lr) * 3))}
.lupe-mass{position:absolute;left:var(--lx);top:var(--ly);transform:translate(calc(var(--lr) * .74),calc(var(--lr) * .74));font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;opacity:.6;pointer-events:none}
/* Wand */
.rahmen{position:absolute;margin:0;box-sizing:border-box;border:10px solid #1c1d20;background:#fbfbf8;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 2px 6px rgba(0,0,0,.12),0 3px 4px rgba(10,20,30,.22),0 22px 34px -6px rgba(10,20,30,.3),0 60px 90px -30px rgba(10,20,30,.35)}
.rahmen img{display:block;width:100%;height:100%;object-fit:contain}
.rahmen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.2) 40%,transparent 54%);mix-blend-mode:screen}
.licht{position:absolute;left:-15%;top:-20%;width:75%;height:140%;pointer-events:none;mix-blend-mode:soft-light;filter:blur(18px);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4%;transform:skewX(-22deg) rotate(-6deg);animation:wandern 60s ease-in-out infinite alternate}
.licht i{background:rgba(255,250,232,.9)}
@keyframes wandern{from{translate:-6% 0}to{translate:30% 2%}}

@media (max-width:980px){ .raster-feld{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 22px} }
@media (max-width:760px){
  :root{--rand:20px}
  .marke{top:calc(22px + env(safe-area-inset-top,0px))}
  .text{left:max(var(--rand),env(safe-area-inset-left,0px));width:auto;gap:12px;bottom:28px}
  .text h1{font-size:64px}
  .text p{font-size:15px}
  .motive{padding-block:80px 100px}
  .modi button{padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .licht{animation:none} .blatt button,.ebene,.ansicht{transition:none} }
</style>
</head>
<body>
<header class="kopf" id="kopf">
  <canvas id="bogen" role="img" aria-label="Ein Print im Vierfarbenraster: ein gerasterter Frauenkopf in Schwarz und Weiss vor zwei grossen Kreisen aus feinen Ringen in Pink und Gelb."></canvas>
  <a class="marke" href="/start/">ornament.cloud</a>
  <a class="zurueck" id="zurueck" href="/angebot/" aria-label="Zurück zum Angebot" hidden>×</a>
  <div class="schalter" id="schalter" role="group" aria-label="Darstellung des Motivs">
    <button type="button" id="s-raster" aria-pressed="true">Raster</button><button type="button" id="s-bild" aria-pressed="false">Bild</button>
  </div>
  <section class="text">
    <h1>Prints<span>.</span></h1>
    <p>Acht Motive. Format, Papier und Preis auf Anfrage.</p>
    <div class="wege"><a href="#motive">Alle Prints</a><a class="still" href="mailto:hansnoed@gmail.com?subject=Prints">Anfragen</a><a class="still" id="briefing" href="/angebot/produkte/" hidden>Briefing</a></div>
  </section>
</header>

<main class="motive innen" id="motive">
  <div class="motive-kopf"><h2>Acht Motive</h2><span>Antippen für Lupe und Wand</span></div>
  <ol class="raster-feld" id="feld"></ol>
</main>
<footer class="fuss innen"><a href="/start/">ornament.cloud</a><a href="mailto:hansnoed@gmail.com?subject=Prints">Prints anfragen</a></footer>

<div class="ansicht" id="ansicht" role="dialog" aria-modal="true" aria-labelledby="a-zahl" aria-hidden="true">
  <div class="a-kopf innen"><span class="a-zahl" id="a-zahl">01 / 08</span><div class="rechts"><a id="a-anfrage" href="mailto:hansnoed@gmail.com?subject=Prints">Anfragen</a><button type="button" class="rund" id="a-zu" aria-label="Schliessen">×</button></div></div>
  <div class="a-buehne" id="buehne">
    <div class="ebene an" id="e-lupe">
      <div class="tisch" id="tisch"><img id="l-bild" alt=""><div class="schein" aria-hidden="true"></div><div class="lupe" id="lupe" aria-hidden="true"></div><span class="lupe-mass" aria-hidden="true">× 2</span></div>
    </div>
    <div class="ebene" id="e-wand"><div class="licht" aria-hidden="true"><i></i><i></i><i></i><i></i></div><figure class="rahmen" id="rahmen"><img id="w-bild" alt=""></figure></div>
  </div>
  <div class="a-fuss innen">
    <button type="button" class="rund" id="a-zurueck" aria-label="Vorheriges Motiv">←</button>
    <div class="modi" role="group" aria-label="Ansicht">
      <button type="button" data-modus="lupe" aria-pressed="true">Lupe</button><button type="button" data-modus="wand" aria-pressed="false">Wand</button>
    </div>
    <button type="button" class="rund" id="a-vor" aria-label="Nächstes Motiv">→</button>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const BILD = (slug, g) => `/b/bilder/fotografie/print-${slug}-${g}.jpg`;
// Die acht Motive wie auf «Werke» (src/b/fotos.mjs, Bildbeschreibungen von dort)
const PRINTS = [
  ["kueste", "Geometrische Flächen in Orange, Blau und Braun: eine Küste mit Häusern, eine orange Sonne, in der blauen Mitte kleine Segel und ein Gesicht"],
  ["linien", "Weisse Linien auf Schwarz: ein dichtes Geflecht aus Schraffuren, Spiralen und Bändern, aus dem ein Gesicht im Profil tritt"],
  ["kopf-blau", "Ein gemalter Kopf mit blauem Gesicht, roten Lippen und zwei verschiedenen Augen vor hellblauem Grund, darüber zwei gelbe Scheiben an einem schwarzen Stab"],
  ["fragmente", "Vier farbige Formen auf Schwarz, aus Feldern in Pink, Rot, Orange und Blau gefügt, mit feiner Schraffur"],
  ["gruen", "Eine abstrakte Fläche: oben Grün in Flecken, zur Mitte hin hell, unten Blaugrün, wie ein Garten im Wasser gespiegelt"],
  ["kopf-pink", "Ein grob gerasterter Frauenkopf in Schwarz und Weiss vor zwei grossen Kreisen aus feinen Ringen in Pink und Gelb"],
  ["schwarzweiss", "Eine schwarze Form auf Weiss, von weissen Linien geteilt: Augen, ein Fisch, Zähne, Spiralen und Fächer greifen ineinander"],
  ["raster", "Weiche Farbfelder in Rot, Gelb, Blau und Weiss hinter einem feinen Raster, wie durch geriffeltes Glas gesehen"],
].map(([slug, alt], i) => ({ slug, alt, nr: String(i + 1).padStart(2, "0") }));
const KOPF = PRINTS.findIndex(p => p.slug === "kopf-pink");

/* ---------- Druckwerk: Farbtrennung und Rasterplatten ---------- */
// Druckfarben (Euroskala), Rasterwinkel, Herkunft beim Einfliegen und Gewicht des Passerfehlers
const PLATTEN = [
  { k: "y", farbe: "rgb(255,236,0)", winkel: 0, von: [70, -30], passer: [1.0, -.5] },
  { k: "m", farbe: "rgb(230,0,126)", winkel: 75, von: [-60, 40], passer: [-.8, .7] },
  { k: "c", farbe: "rgb(0,158,224)", winkel: 15, von: [50, 60], passer: [.6, .9] },
  { k: "k", farbe: "rgb(28,26,30)", winkel: 45, von: [0, -50], passer: [0, 0] },
];
function trennen(img, lang = 260) {
  const v = img.naturalWidth / img.naturalHeight, nw = v >= 1 ? lang : Math.round(lang * v), nh = v >= 1 ? Math.round(lang / v) : lang;
  const c = document.createElement("canvas"); c.width = nw; c.height = nh;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, nw, nh);
  const d = x.getImageData(0, 0, nw, nh).data, n = nw * nh, w = { nw, nh, c: new Float32Array(n), m: new Float32Array(n), y: new Float32Array(n), k: new Float32Array(n) };
  for (let i = 0; i < n; i++) {
    const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, b = d[i * 4 + 2] / 255, k = 1 - Math.max(r, g, b), q = 1 - k || 1;
    w.c[i] = (1 - r - k) / q; w.m[i] = (1 - g - k) / q; w.y[i] = (1 - b - k) / q; w.k[i] = k;
  }
  return w;
}
function platten(w, B, H, dpr, zelle) {
  const R = Math.hypot(B, H) * .56, cx = B / 2, cy = H / 2;
  return PLATTEN.map(p => {
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(B * dpr)); c.height = Math.max(1, Math.round(H * dpr));
    const x = c.getContext("2d"); x.scale(dpr, dpr); x.fillStyle = p.farbe; x.beginPath();
    const ca = Math.cos(p.winkel * DEG), sa = Math.sin(p.winkel * DEG), a = w[p.k];
    for (let v = -R; v <= R; v += zelle) for (let u = -R; u <= R; u += zelle) {
      const px = cx + u * ca - v * sa, py = cy + u * sa + v * ca;
      if (px < 0 || py < 0 || px >= B || py >= H) continue;
      const deck = (a[Math.floor(py / H * w.nh) * w.nw + Math.floor(px / B * w.nw)] - .07) / .93;   // Papierweiss druckt nicht
      if (deck <= .02) continue;
      const r = zelle * .5 * Math.sqrt(deck) * 1.28;
      x.moveTo(px + r, py); x.arc(px, py, r, 0, TAU);
    }
    x.fill();
    return c;
  });
}
// Platten auf den Bogen bringen: nacheinander einfliegen (t in ms seit Beginn), dann mit Passerfehler nach dem Zeiger
function drucken(ctx, pl, x, y, B, H, t, z, alpha, fehler, takt = 650, flug = 1) {
  ctx.globalCompositeOperation = "multiply";
  const f = PLATTEN.map((p, i) => {
    const e = reduce ? 1 : ease((t - 250 - i * takt) / (takt * 1.55));
    if (e > 0) {
      const ox = p.von[0] * (1 - e) * flug + p.passer[0] * z[0] * fehler, oy = p.von[1] * (1 - e) * flug + p.passer[1] * z[1] * fehler;
      ctx.globalAlpha = e * alpha; ctx.drawImage(pl[i], x + ox, y + oy, B, H);
    }
    return e;
  });
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  return f;
}
let kornMuster = null;
function korn(ctx) {
  if (!kornMuster) {
    const k = document.createElement("canvas"); k.width = k.height = 160; const kx = k.getContext("2d"), id = kx.createImageData(160, 160);
    for (let i = 0; i < id.data.length; i += 4) { const v = 120 + Math.random() * 135; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
    kx.putImageData(id, 0, 0); kornMuster = k;
  }
  return ctx.createPattern(kornMuster, "repeat");
}
function schnittmarken(ctx, x, y, B, H, farbe) {
  ctx.strokeStyle = farbe; ctx.lineWidth = .8; ctx.beginPath();
  for (const [cx, cy, sx, sy] of [[x, y, -1, -1], [x + B, y, 1, -1], [x, y + H, -1, 1], [x + B, y + H, 1, 1]]) {
    ctx.moveTo(cx + sx * 8, cy); ctx.lineTo(cx + sx * 26, cy); ctx.moveTo(cx, cy + sy * 8); ctx.lineTo(cx, cy + sy * 26);
  }
  ctx.stroke();
}
const laden = src => new Promise((ok, nein) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nein; i.src = src; });

/* ---------- Aus dem Angebot geöffnet (?von=angebot): Kreuz zurück und Weg zum Briefing ---------- */
if (new URLSearchParams(location.search).get("von") === "angebot") {
  const zu = $("zurueck"); zu.hidden = false; $("briefing").hidden = false;
  zu.addEventListener("click", e => {
    let gleich = false; try { gleich = new URL(document.referrer).origin === location.origin; } catch (x) {}
    if (gleich && history.length > 1) { e.preventDefault(); history.back(); }
  });
}

/* ---------- Bogen oben ---------- */
const cv = $("bogen"), ctx = cv.getContext("2d"), kopfEl = $("kopf"), schalter = $("schalter");
const B = { W: 0, H: 0, dpr: 1, x: 0, y: 0, S: 0, bild: null, werte: null, pl: [], t0: 0, z: [0, 0], weich: [0, 0], anteil: 0, ziel: 0, sichtbar: true };
function bogenOrdnen() {
  B.W = kopfEl.clientWidth; B.H = kopfEl.clientHeight; B.dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(B.W * B.dpr); cv.height = Math.round(B.H * B.dpr);
  const mobil = B.W < 760;
  // Bogen = Motiv + 9 % Rand rundum + Farbstreifen (34 px); darunter der Schalter (46 px)
  if (mobil) { B.S = Math.min((B.W - 40) / 1.18, (B.H - 420) / 1.18); B.x = (B.W - B.S) / 2; B.y = 76 + B.S * .09; }
  else {
    const textBreite = 420; B.S = Math.min((B.H - 190) / 1.18, (B.W - textBreite - 220) / 1.18);
    const T = B.S * 1.18 + 34 + 46;
    B.x = Math.max(80 + B.S * .09, (B.W - textBreite - B.S) / 2); B.y = Math.max(76, (B.H - T) / 2) + B.S * .09;
  }

function darstellung(bild) {

kopfEl.addEventListener("pointermove", e => { B.z = [clamp((e.clientX / B.W - .5) * 2, -1, 1), clamp((e.clientY / B.H - .5) * 2, -1, 1)]; });

/* ---------- Acht Motive ---------- */
const feld = $("feld"), aktive = new Set();
PRINTS.forEach((p, i) => {
  const li = document.createElement("li"); li.className = "blatt"; li.id = "print-" + p.slug;
  li.innerHTML = `<button type="button" aria-label="Motiv ${p.nr} ansehen: ${p.alt}"><span class="flaeche"><img src="${BILD(p.slug, 800)}" alt="" loading="lazy"><canvas aria-hidden="true"></canvas></span></button><span class="zahl"><span>${p.nr}</span><span>Print</span></span>`;
  const knopf = li.querySelector("button"), img = li.querySelector("img"), c = li.querySelector("canvas");
  p.kachel = { knopf, img, c, pl: null, t0: 0, an: false, alpha: 0, z: [0, 0], weich: [0, 0] };

      k.pl = platten(k.w, k.b, k.h, dpr, Math.max(3.2, k.b / 70));
      c.width = Math.round(k.b * dpr); c.height = Math.round(k.h * dpr); k.dpr = dpr;

  knopf.addEventListener("pointermove", e => { const r = img.getBoundingClientRect(); p.kachel.z = [clamp(((e.clientX - r.left) / r.width - .5) * 2, -1, 1), clamp(((e.clientY - r.top) / r.height - .5) * 2, -1, 1)]; });
  knopf.addEventListener("pointerleave", () => { p.kachel.an = false; c.style.opacity = 0; });

function kachelnZeichnen(zeit) {

}

/* ---------- Ansicht eines Motivs ---------- */
const ansicht = $("ansicht"), buehne = $("buehne"), tisch = $("tisch"), lupe = $("lupe"), lBild = $("l-bild"), wBild = $("w-bild"), rahmen = $("rahmen");
const A = { i: -1, modus: "lupe", bild: null, rect: null, lx: .5, ly: .45, zx: .5, zy: .45, r: 120, folgt: false, ruhe: 0, w: null, pl: null, t0: 0, z: [0, 0], weich: [0, 0], vorher: null };
const ZOOM = 2;
async function oeffnen(i, ohneVerlauf) {

  $("a-anfrage").href = `mailto:hansnoed@gmail.com?subject=${encodeURIComponent("Prints – Motiv " + p.nr)}`;
  lBild.alt = p.alt; wBild.alt = p.alt;

    setTimeout(() => $("a-zu").focus(), 50);

  try { A.bild = await laden(BILD(p.slug, 1600)); } catch (e) { return; }

  lBild.src = A.bild.src; wBild.src = A.bild.src; lupe.style.backgroundImage = `url("${A.bild.src}")`;
  wandfarbe(A.bild);

}
function schliessen() {
  ansicht.classList.remove("offen"); ansicht.setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
  const p = PRINTS[A.i]; (p && p.kachel.knopf || A.vorher)?.focus({ preventScroll: true }); A.vorher = null;
}
// Die Wand nimmt den Grundton des Motivs auf (Mittel der Randpixel, etwas gedämpft)
function wandfarbe(img) {
  const c = document.createElement("canvas"), n = 40; c.width = c.height = n; const x = c.getContext("2d"); x.drawImage(img, 0, 0, n, n);

// Lupe: folgt Maus oder Finger, sonst wandert sie von selbst

function ansichtZeichnen(zeit) {

/* ---------- Eine Schleife für alles ---------- */
let laeuft = false;
function los() { if (!laeuft) { laeuft = true; requestAnimationFrame(schleife); } }
function schleife(zeit) {

  const offen = ansicht.classList.contains("offen");
  if (B.sichtbar && !offen) bogenZeichnen(zeit);
  if (aktive.size) kachelnZeichnen(zeit);

}
los();

let rs = 0; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(() => { bogenOrdnen(); if (ansicht.classList.contains("offen")) { ordnen(); modus(A.modus, true); } }, 120); });
bogenOrdnen();

const start = PRINTS.findIndex(p => "#print-" + p.slug === location.hash);
if (start >= 0) oeffnen(start, true);
})();
