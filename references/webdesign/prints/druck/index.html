<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prints – Druck</title>
<meta name="robots" content="noindex">
<meta name="description" content="Einstiegsseite für Prints als Referenz: Ein Motiv entsteht aus vier Rasterplatten in Cyan, Magenta, Gelb und Schwarz, die nacheinander ins Register fallen.">
<meta name="theme-color" content="#f4f4f1">
<link rel="stylesheet" href="../../../../vendor/fonts/animationen.css">
<style>
/* Referenz «Prints – Druck» (22. November 2026). Ein Druckbogen auf Papier: das Motiv (Arbeitsname «Kopf in Pink») als
   Vierfarbenraster mit den üblichen Rasterwinkeln, Schnittmarken, Passerkreuzen und Farbkontrollstreifen. Die Platten
   kommen nacheinander, der Zeiger verschiebt sie leicht gegeneinander (Passer). Antippen zeigt das Bild selbst. */
:root{
  --papier:#f4f4f1;
  --tinte:#141416;
  --leise:rgba(20,20,22,.58);
  --linie:rgba(20,20,22,.16);
  --magenta:#e6007e;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rand:40px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:4px;border-radius:3px}
#bogen{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.marke{position:fixed;left:max(var(--rand),env(safe-area-inset-left,0px));top:calc(30px + env(safe-area-inset-top,0px));font-weight:600;font-size:15px;text-decoration:none}
.text{position:fixed;right:max(var(--rand),env(safe-area-inset-right,0px));bottom:calc(var(--rand) + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 2 * var(--rand)));display:grid;gap:18px}
.text h1{margin:0;font-weight:600;font-size:clamp(64px,9vw,150px);line-height:.86;letter-spacing:-.055em}
.text h1 span{color:var(--magenta)}
.text p{margin:0;font-size:16px;line-height:1.45;color:var(--leise);max-width:30ch}
.wege{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.wege a{font-weight:600;font-size:16px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.wege a.still{font-weight:400;color:var(--leise);border-bottom-color:var(--linie)}
.schalter{appearance:none;border:1px solid var(--linie);background:none;border-radius:999px;padding:7px 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--leise);cursor:pointer;justify-self:start}
.schalter:hover{color:var(--tinte);border-color:var(--leise)}
.winkel{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--leise)}
@media (max-width:760px){
  :root{--rand:20px}
  .marke{top:calc(22px + env(safe-area-inset-top,0px))}
  .text{left:max(var(--rand),env(safe-area-inset-left,0px));width:auto;gap:12px}
  .text h1{font-size:64px}
  .text p{font-size:15px}
  .winkel{display:none}
}
</style>
</head>
<body>
<canvas id="bogen" role="img" aria-label="Ein Print im Vierfarbenraster: ein gerasterter Frauenkopf in Schwarz und Weiss vor zwei grossen Kreisen aus feinen Ringen in Pink und Gelb. Antippen zeigt das Bild ohne Raster."></canvas>
<a class="marke" href="/start/">ornament.cloud</a>
<section class="text">
  <h1>Prints<span>.</span></h1>
  <p>Acht Motive. Format, Papier und Preis auf Anfrage.</p>
  <div class="wege"><a href="/werke/">Alle Prints</a><a class="still" href="mailto:hansnoed@gmail.com?subject=Prints">Anfragen</a></div>
  <button type="button" class="schalter" id="schalter" aria-pressed="false">Raster · Bild</button>
  <span class="winkel" aria-hidden="true">C 15° · M 75° · Y 0° · K 45°</span>
</section>

<script>
(() => {
"use strict";
const QUELLE = "/b/bilder/fotografie/print-kopf-pink-1600.jpg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const cv = document.getElementById("bogen"), ctx = cv.getContext("2d");
// Druckfarben (Euroskala), Rasterwinkel, Herkunft beim Einfliegen und Gewicht des Passerfehlers
const PLATTEN = [
  { k: "y", farbe: "rgb(255,236,0)", winkel: 0, von: [70, -30], passer: [1.0, -.5] },
  { k: "m", farbe: "rgb(230,0,126)", winkel: 75, von: [-60, 40], passer: [-.8, .7] },
  { k: "c", farbe: "rgb(0,158,224)", winkel: 15, von: [50, 60], passer: [.6, .9] },
  { k: "k", farbe: "rgb(28,26,30)", winkel: 45, von: [0, -50], passer: [0, 0] },
];
const st = { W: 0, H: 0, dpr: 1, x: 0, y: 0, S: 0, mobil: false, bild: null, werte: null, n: 0, platten: [], t0: 0, zeiger: [0, 0], weich: [0, 0], bildAnteil: 0, bildZiel: 0 };

function anordnen() {
  st.W = innerWidth; st.H = innerHeight; st.dpr = Math.min(2, devicePixelRatio || 1); st.mobil = st.W < 760;
  cv.width = Math.round(st.W * st.dpr); cv.height = Math.round(st.H * st.dpr);
  // Bogen = Motiv + Rand von 9 % rundum + Farbstreifen (34 px)
  if (st.mobil) { st.S = Math.min((st.W - 40) / 1.18, (st.H - 400) / 1.18); st.x = (st.W - st.S) / 2; st.y = 78 + st.S * .09; }
  else {
    const textBreite = 420;
    st.S = Math.min((st.H - 150) / 1.18, (st.W - textBreite - 220) / 1.18);
    const T = st.S * 1.18 + 34;
    st.x = Math.max(80 + st.S * .09, (st.W - textBreite - st.S) / 2); st.y = Math.max(76, (st.H - T) / 2) + st.S * .09;
  }
  if (st.bild) platten();
}
// Bild in Cyan, Magenta, Gelb und Schwarz zerlegen (einfache Trennung mit Schwarzaufbau)
function zerlegen() {
  const n = 260, c = document.createElement("canvas"); c.width = c.height = n;
  const x = c.getContext("2d"); x.drawImage(st.bild, 0, 0, n, n);
  const d = x.getImageData(0, 0, n, n).data, w = { c: new Float32Array(n * n), m: new Float32Array(n * n), y: new Float32Array(n * n), k: new Float32Array(n * n) };
  for (let i = 0; i < n * n; i++) {
    const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, b = d[i * 4 + 2] / 255, k = 1 - Math.max(r, g, b), q = 1 - k || 1;
    w.c[i] = (1 - r - k) / q; w.m[i] = (1 - g - k) / q; w.y[i] = (1 - b - k) / q; w.k[i] = k;
  }
  st.werte = w; st.n = n;
}
function platten() {
  const S = st.S, zelle = Math.max(4.2, S / 120), n = st.n, R = S * .72, cx = S / 2;
  st.platten = PLATTEN.map(p => {
    const c = document.createElement("canvas"); c.width = Math.round(S * st.dpr); c.height = Math.round(S * st.dpr);
    const x = c.getContext("2d"); x.scale(st.dpr, st.dpr); x.fillStyle = p.farbe; x.beginPath();
    const ca = Math.cos(p.winkel * DEG), sa = Math.sin(p.winkel * DEG), w = st.werte[p.k];
    for (let v = -R; v <= R; v += zelle) for (let u = -R; u <= R; u += zelle) {
      const px = cx + u * ca - v * sa, py = cx + u * sa + v * ca;
      if (px < 0 || py < 0 || px >= S || py >= S) continue;
      const val = w[Math.floor(py / S * n) * n + Math.floor(px / S * n)];
      const deck = (val - .07) / .93;   // helle Töne (Papierweiss des Motivs) drucken nicht
      if (deck <= .02) continue;
      const r = zelle * .5 * Math.sqrt(deck) * 1.28;
      x.moveTo(px + r, py); x.arc(px, py, r, 0, TAU);
    }
    x.fill();
    return c;
  });
  // Papierkorn
  const k = document.createElement("canvas"); k.width = k.height = 160; const kx = k.getContext("2d"), id = kx.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) { const v = 120 + Math.random() * 135; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  kx.putImageData(id, 0, 0); st.korn = ctx.createPattern(k, "repeat");
}

function passerkreuz(x, y, farbe) {
  ctx.strokeStyle = farbe; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.moveTo(x - 13, y); ctx.lineTo(x + 13, y); ctx.moveTo(x, y - 13); ctx.lineTo(x, y + 13); ctx.stroke();
}
function zeichnen(zeit) {
  const d = st.dpr, { x, y, S } = st;
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "#f4f4f1"; ctx.fillRect(0, 0, st.W, st.H);
  if (!st.platten.length) return;
  // Bogen: etwas weisser als der Grund, mit weichem Schatten
  const b = S * .09;
  ctx.save(); ctx.shadowColor = "rgba(30,30,40,.16)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = "#fbfbf9"; ctx.fillRect(x - b, y - b, S + 2 * b, S + 2 * b + 34); ctx.restore();
  // Zeiger -> Passerfehler (weich nachgeführt)
  st.weich[0] += (st.zeiger[0] - st.weich[0]) * .08; st.weich[1] += (st.zeiger[1] - st.weich[1]) * .08;
  const t = zeit - st.t0, fehler = reduce ? 0 : 7, k = Math.min(30, S / 11.5), kw = k * .74;   // Farbstreifen: Schritt und Feldbreite
  ctx.globalCompositeOperation = "multiply";
  PLATTEN.forEach((p, i) => {
    const f = reduce ? 1 : ease((t - 250 - i * 650) / 1000);
    if (f <= 0) return;
    const ox = p.von[0] * (1 - f) + p.passer[0] * st.weich[0] * fehler, oy = p.von[1] * (1 - f) + p.passer[1] * st.weich[1] * fehler;
    ctx.globalAlpha = f * (1 - st.bildAnteil * .95);
    ctx.drawImage(st.platten[i], x + ox, y + oy, S, S);
    // Passerkreuze und Farbfelder druckt jede Platte mit
    ctx.globalAlpha = f;
    for (const [px, py] of [[x + S / 2, y - b / 2], [x + S / 2, y + S + b / 2], [x - b / 2, y + S / 2], [x + S + b / 2, y + S / 2]]) passerkreuz(px + ox * .6, py + oy * .6, p.farbe);
    const fx = x + i * k, fy = y + S + b + 6;
    ctx.fillStyle = p.farbe; ctx.fillRect(fx + ox * .6, fy + oy * .6, kw, 14);
    ctx.globalAlpha = f * .5; ctx.fillRect(fx + 4 * k + ox * .6, fy + oy * .6, kw, 14);
  });
  // Übereinanderdruck: Rot, Grün, Blau aus je zwei Platten
  ctx.globalAlpha = 1;
  [[1, 0], [2, 0], [2, 1]].forEach(([a, c], j) => {
    const fa = reduce ? 1 : ease((t - 250 - 3 * 650) / 1000); if (fa <= 0) return;
    const fx = x + (8 + j) * k + k * .3, fy = y + S + b + 6;
    ctx.globalAlpha = fa; ctx.fillStyle = PLATTEN[a].farbe; ctx.fillRect(fx, fy, kw, 14); ctx.fillStyle = PLATTEN[c].farbe; ctx.fillRect(fx, fy, kw, 14);
  });
  // Das Bild selbst
  ctx.globalCompositeOperation = "source-over";
  st.bildAnteil += (st.bildZiel - st.bildAnteil) * (reduce ? 1 : .1);
  if (st.bildAnteil > .01) { ctx.globalAlpha = st.bildAnteil; ctx.drawImage(st.bild, x, y, S, S); }
  ctx.globalAlpha = 1;
  // Schnittmarken
  ctx.strokeStyle = "rgba(20,20,22,.55)"; ctx.lineWidth = .8; ctx.beginPath();
  for (const [cx, cy, sx, sy] of [[x, y, -1, -1], [x + S, y, 1, -1], [x, y + S, -1, 1], [x + S, y + S, 1, 1]]) {
    ctx.moveTo(cx + sx * 8, cy); ctx.lineTo(cx + sx * 26, cy); ctx.moveTo(cx, cy + sy * 8); ctx.lineTo(cx, cy + sy * 26);
  }
  ctx.stroke();
  ctx.fillStyle = st.korn; ctx.globalCompositeOperation = "multiply"; ctx.fillRect(x - b, y - b, S + 2 * b, S + 2 * b + 34);
  ctx.globalCompositeOperation = "source-over";
}
function schleife(zeit) { if (!st.t0) st.t0 = zeit; zeichnen(zeit); requestAnimationFrame(schleife); }

addEventListener("pointermove", e => { st.zeiger = [clamp((e.clientX / st.W - .5) * 2, -1, 1), clamp((e.clientY / st.H - .5) * 2, -1, 1)]; });
addEventListener("pointerleave", () => { st.zeiger = [0, 0]; });
const schalter = document.getElementById("schalter");
function umschalten() { st.bildZiel = st.bildZiel ? 0 : 1; schalter.setAttribute("aria-pressed", String(!!st.bildZiel)); }
cv.addEventListener("click", umschalten); schalter.addEventListener("click", umschalten);
let rs = 0; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(anordnen, 120); });

const img = new Image();
img.onload = () => { st.bild = img; zerlegen(); anordnen(); st.t0 = 0; };
img.src = QUELLE;
anordnen();
requestAnimationFrame(schleife);
})();
</script>
</body>
</html>
