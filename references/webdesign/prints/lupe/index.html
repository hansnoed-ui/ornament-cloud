<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prints – Lupe</title>
<meta name="robots" content="noindex">
<meta name="description" content="Einstiegsseite für Prints als Referenz: Ein Print liegt im Dunkeln, eine Lupe wandert über die Oberfläche und zeigt Pinselspur, Schraffur und Papier.">
<link rel="stylesheet" href="../../../../vendor/fonts/animationen.css">
<style>
/* Referenz «Prints – Lupe» (22. November 2026). Der Print (Arbeitsname «Fragmente») liegt gedämpft im Dunkeln wie auf
   einem Leuchttisch; nur unter der Lupe hat er volles Licht und die doppelte Grösse. Ohne Zeiger wandert die Lupe von
   selbst über das Bild; am Handy zieht man sie mit dem Finger. */
:root{
  --nacht:#0b0b0c;
  --tinte:#f1efe9;
  --leise:rgba(241,239,233,.6);
  --linie:rgba(241,239,233,.2);
  --rosa:#ff5fa2;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rand:40px;
  --lx:50%; --ly:50%; --lr:120px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--nacht);color:var(--tinte);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:4px;border-radius:3px}

.tisch{position:fixed;touch-action:none;cursor:none}
.tisch img{display:block;width:100%;height:100%;filter:brightness(.42) saturate(.7);transition:filter 1.4s}
.tisch.wach img{filter:brightness(.5) saturate(.8)}
/* Unter der Lupe: dasselbe Bild in voller Helligkeit und doppelter Grösse */
.lupe{position:absolute;left:var(--lx);top:var(--ly);width:calc(var(--lr) * 2);height:calc(var(--lr) * 2);margin:calc(var(--lr) * -1) 0 0 calc(var(--lr) * -1);
  border-radius:50%;pointer-events:none;background-repeat:no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 0 7px rgba(255,255,255,.05),0 18px 50px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.35)}
.lupe::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.16),transparent 38%)}
.mass{position:absolute;left:var(--lx);top:var(--ly);transform:translate(calc(var(--lr) * .72),calc(var(--lr) * .72));font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--leise);pointer-events:none;white-space:nowrap}
/* Licht von oben: ein weicher Schein um die Lupe auf dem Tisch */
.schein{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--lx) var(--ly),rgba(255,236,220,.16),transparent calc(var(--lr) * 3))}

.marke{position:fixed;left:max(var(--rand),env(safe-area-inset-left,0px));top:calc(30px + env(safe-area-inset-top,0px));font-weight:600;font-size:15px;text-decoration:none}
.text{position:fixed;left:max(var(--rand),env(safe-area-inset-left,0px));bottom:calc(var(--rand) + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-width:min(380px,calc(100vw - 2 * var(--rand)))}
.text h1{margin:0;font-weight:600;font-size:clamp(60px,8vw,132px);line-height:.86;letter-spacing:-.055em}
.text h1 em{font-style:normal;font-weight:300;color:var(--rosa)}
.text p{margin:0;font-size:16px;line-height:1.45;color:var(--leise);max-width:30ch}
.wege{display:flex;flex-wrap:wrap;gap:10px 22px}
.wege a{font-weight:600;font-size:16px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.wege a.still{font-weight:400;color:var(--leise);border-bottom-color:var(--linie)}
@media (max-width:760px){
  :root{--rand:20px}
  .marke{top:calc(22px + env(safe-area-inset-top,0px))}
  .text h1{font-size:60px}
  .text p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){ .tisch img{transition:none} }
</style>
</head>
<body>
<div class="tisch" id="tisch">
  <img id="bild" src="/b/bilder/fotografie/print-fragmente-1600.jpg" alt="Vier farbige Formen auf Schwarz, aus Feldern in Pink, Rot, Orange und Blau gefügt, mit feiner Schraffur">
  <div class="schein" aria-hidden="true"></div>
  <div class="lupe" id="lupe" aria-hidden="true"></div>
  <span class="mass" id="mass" aria-hidden="true">× 2</span>
</div>
<a class="marke" href="/start/">ornament.cloud</a>
<section class="text">
  <h1>Prints<em>.</em></h1>
  <p>Acht Motive. Format, Papier und Preis auf Anfrage.</p>
  <div class="wege"><a href="/werke/">Alle Prints</a><a class="still" href="mailto:hansnoed@gmail.com?subject=Prints">Anfragen</a></div>
</section>

<script>
(() => {
"use strict";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tisch = document.getElementById("tisch"), bild = document.getElementById("bild"), lupe = document.getElementById("lupe");
const ZOOM = 2;
const st = { b: 0, h: 0, x: .5, y: .45, zx: .5, zy: .45, r: 120, folgt: false, ruhe: 0 };

function anordnen() {
  const W = innerWidth, H = innerHeight, mobil = W < 760, v = (bild.naturalWidth || 1374) / (bild.naturalHeight || 1465);
  let h, b, l, t;
  if (mobil) { h = Math.min(H - 330, (W - 40) / v); b = h * v; l = (W - b) / 2; t = 80; }
  else { h = H - 120; b = h * v; if (b > W * .56) { b = W * .56; h = b / v; } l = W - b - Math.max(60, (W - b) * .18); t = (H - h) / 2; }
  Object.assign(tisch.style, { left: l + "px", top: t + "px", width: b + "px", height: h + "px" });
  st.b = b; st.h = h; st.r = mobil ? Math.min(90, b * .26) : Math.min(150, b * .2);
  lupe.style.backgroundImage = `url("${bild.currentSrc || bild.src}")`;
  lupe.style.backgroundSize = `${b * ZOOM}px ${h * ZOOM}px`;
  tisch.style.setProperty("--lr", st.r + "px");
}
function setzen() {
  const px = st.x * st.b, py = st.y * st.h;
  tisch.style.setProperty("--lx", px + "px"); tisch.style.setProperty("--ly", py + "px");
  lupe.style.backgroundPosition = `${-(px * ZOOM - st.r)}px ${-(py * ZOOM - st.r)}px`;
}
// Ohne Zeiger wandert die Lupe langsam über die Formen (Lissajous-Bahn)
function schleife(zeit) {
  if (!st.folgt && !reduce && performance.now() > st.ruhe) {
    const t = zeit / 1000;
    st.zx = .5 + .34 * Math.sin(t * .23) + .06 * Math.sin(t * .71);
    st.zy = .5 + .34 * Math.sin(t * .17 + 1.3) + .05 * Math.cos(t * .53);
  }
  st.x += (st.zx - st.x) * (st.folgt ? .22 : .04); st.y += (st.zy - st.y) * (st.folgt ? .22 : .04);
  setzen();
  requestAnimationFrame(schleife);
}
function ziel(e) {
  const r = tisch.getBoundingClientRect();
  st.zx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); st.zy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
}
tisch.addEventListener("pointerenter", e => { st.folgt = true; tisch.classList.add("wach"); ziel(e); });
tisch.addEventListener("pointermove", e => { st.folgt = true; ziel(e); });
tisch.addEventListener("pointerdown", e => { tisch.setPointerCapture(e.pointerId); st.folgt = true; ziel(e); });
const los = () => { st.folgt = false; st.ruhe = performance.now() + 2500; tisch.classList.remove("wach"); };
tisch.addEventListener("pointerleave", los); tisch.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") los(); });

function start() { anordnen(); setzen(); requestAnimationFrame(schleife); }
if (bild.complete && bild.naturalWidth) start(); else bild.addEventListener("load", start);
let rs = 0; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(() => { anordnen(); setzen(); }, 100); });
})();
</script>
</body>
</html>
