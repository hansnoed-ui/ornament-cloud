# Social-Paket zu einer Musik-Veröffentlichung unter listen/<slug>/ (tools/social-paket.mjs, Anleitung: docs/social-paket.md): je Track ein
# kurzer Film mit Ton in 9:16 und 1:1, ein Standbild und die Beitragstexte. Läuft nur von Hand («Run workflow»), auch vom Handy.
# Die Audiodatei ist nicht in Git; der Workflow holt sie vom Webserver (https://ornament.cloud/listen/<slug>/<«audio» aus ep.json>).
# Das Ergebnis liegt 14 Tage als Artefakt «social-<slug>» beim Lauf. Keine Secrets nötig, nichts wird ins Repository geschrieben.
name: Social-Paket

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Veröffentlichung (Ordner unter listen/)"
        type: string
        default: directer
      sekunden:
        description: "Länge der Filme in Sekunden"
        type: string
        default: "24"

concurrency:
  group: social-${{ inputs.slug }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rechnen:
    name: Filme, Standbilder und Texte rechnen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
      SEKUNDEN: ${{ inputs.sekunden }}
    steps:
      - name: Eingaben prüfen
        run: |
          if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9-]+$'; then echo "::error::slug darf nur Kleinbuchstaben, Ziffern und Bindestriche enthalten"; exit 1; fi
          if ! printf '%s' "$SEKUNDEN" | grep -Eq '^[0-9]{1,3}$' || [ "$SEKUNDEN" -lt 1 ]; then echo "::error::sekunden muss eine ganze Zahl von 1 bis 999 sein"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright und Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Audiodatei vom Webserver holen
        run: |
          if [ ! -f "listen/$SLUG/ep.json" ]; then echo "::error::listen/$SLUG/ep.json gibt es nicht"; exit 1; fi
          AUDIO=$(node -e 'const a = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).audio || ""; if (!/^[A-Za-z0-9._-]+(\/[A-Za-z0-9._-]+)*$/.test(a) || a.includes("..")) process.exit(1); console.log(a)' "listen/$SLUG/ep.json") \
            || { echo "::error::listen/$SLUG/ep.json nennt keine brauchbare Audiodatei («audio»)"; exit 1; }
          URL="https://ornament.cloud/listen/$SLUG/$AUDIO"
          mkdir -p "$(dirname "listen/$SLUG/$AUDIO")"
          if ! curl --fail --location --silent --show-error --retry 3 --retry-delay 5 --max-time 1200 -o "listen/$SLUG/$AUDIO" "$URL"; then
            echo "::error::Die Audiodatei liess sich nicht holen: $URL – liegt sie auf dem Webserver (docs/ep-directer.md) und stimmt «audio» in ep.json?"
            exit 1
          fi
          ls -l "listen/$SLUG/$AUDIO"

      - name: Social-Paket rechnen
        run: node tools/social-paket.mjs "$SLUG" --sekunden "$SEKUNDEN"

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ inputs.slug }}
          path: docs/social/${{ inputs.slug }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
