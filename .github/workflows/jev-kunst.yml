# «Kunst» (alpha/kunst/): jev schätzt einmal je freigegebenem Beitrag ein, welcher Zettel und welche ORNA-Konstellation ihm am nächsten stehen,
# und legt das Ergebnis in alpha/kunst/jev.js ab (tools/build-jev-kunst.ts). Läuft, wenn sich alpha/kunst/beitraege.js oder das Werkzeug ändert, und von Hand.
# Braucht das Secret TYPESAFE_API_KEY (dasselbe wie für jev im ORNAMENT LAB); fehlt es, tut der Workflow nichts und die Seite wählt nach der Regel.
# Der Workflow schreibt jev.js zurück auf den Branch, auf dem er läuft. Kosten: zwei Aufrufe je Beitrag, bei rund 900 Beiträgen etwa 0,5 $.
name: jev Kunst

on:
  push:
    paths: [alpha/kunst/beitraege.js, tools/build-jev-kunst.ts]
  workflow_dispatch:

concurrency:
  group: jev-kunst-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bewerten:
    name: jev bewertet die Beiträge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bewerten
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "::notice::Kein Secret TYPESAFE_API_KEY – jev bleibt aus, die Seite wählt nach der Regel."; exit 0; fi
          node --experimental-strip-types --no-warnings tools/build-jev-kunst.ts
      - name: jev.js zurückschreiben
        run: |
          if git diff --quiet -- alpha/kunst/jev.js; then echo "jev.js unverändert"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add alpha/kunst/jev.js
          git commit -m "Kunst: jev hat die Beiträge bewertet"
          git push
