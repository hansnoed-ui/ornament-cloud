# Veröffentlicht die Website auf dem Webspace bei Hostpoint (Umzug von GitHub Pages, seit 20. Oktober 2026; Anleitung: docs/hostpoint-umzug.md).
# Läuft nach jedem Push auf main und von Hand («Run workflow», wahlweise als Probelauf). Solange die Variablen im Repository fehlen
# (Settings → Secrets and variables → Actions), tut der Workflow nichts – so kann er vor dem Umzug schon im Repository liegen.
#
#   Variables:  HOSTPOINT_HOST  (konto.ssh.cloud.hostpoint.ch)   HOSTPOINT_USER  (Benutzername des Webhostings)   HOSTPOINT_PFAD  (www/ornament.cloud)
#   Secret:     HOSTPOINT_SSH_KEY  (privater Schlüssel; der öffentliche liegt bei Hostpoint unter Advanced → SSH-Zugang)
#   Secret:     TYPESAFE_API_KEY   (optional: jev live im ORNAMENT LAB; landet ausserhalb der Website, alpha/lab/docs/JEV-STATUS.md)
#   Secrets:    STIMME_PASSWORT, STIMME_GITHUB_TOKEN, Variable STIMME_REPO  (optional: die Stimme in alpha/voice/, docs/stimme.md)
name: Hostpoint

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur Probelauf (rsync --dry-run): zeigt, was sich ändern würde"
        type: boolean
        default: false

concurrency:
  group: hostpoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hochladen:
    name: Auf den Webspace laden
    runs-on: ubuntu-latest
    if: vars.HOSTPOINT_HOST != ''
    env:
      HOSTPOINT_HOST: ${{ vars.HOSTPOINT_HOST }}
      HOSTPOINT_USER: ${{ vars.HOSTPOINT_USER }}
      HOSTPOINT_PFAD: ${{ vars.HOSTPOINT_PFAD }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTPOINT_SSH_KEY }}" > ~/.ssh/hostpoint
          chmod 600 ~/.ssh/hostpoint
          printf 'Host %s\n  IdentityFile ~/.ssh/hostpoint\n  IdentitiesOnly yes\n' "$HOSTPOINT_HOST" > ~/.ssh/config
          ssh-keyscan -T 20 "$HOSTPOINT_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verbindung und Ziel prüfen
        run: |
          ssh -o BatchMode=yes "$HOSTPOINT_USER@$HOSTPOINT_HOST" "command -v rsync >/dev/null || { echo 'rsync fehlt auf dem Server'; exit 1; }; test -d '$HOSTPOINT_PFAD' || { echo 'Document Root $HOSTPOINT_PFAD fehlt: im Control Panel unter Websites anlegen'; exit 1; }; echo 'Server bereit:' \$(uname -s) \$(rsync --version | head -1)"

      - name: Hochladen
        env:
          PROBE: ${{ inputs.probe && '1' || '' }}
        run: tools/hostpoint/deploy.sh

      # jev live im ORNAMENT LAB: den Schlüssel aus dem Secret TYPESAFE_API_KEY ausserhalb der Website ablegen (fehlt das Secret: löschen, jev aus).
      # Anleitung: alpha/lab/docs/JEV-STATUS.md
      - name: jev-Schlüssel für das Lab
        if: ${{ !inputs.probe }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: tools/hostpoint/jev-schluessel.sh

      # Die Stimme in alpha/voice/: Passwort (nur als Hash) und Schlüssel für das private Repository ausserhalb der Website ablegen.
      # Anleitung: docs/stimme.md
      - name: Zugang für die Stimme
        if: ${{ !inputs.probe }}
        env:
          STIMME_PASSWORT: ${{ secrets.STIMME_PASSWORT }}
          STIMME_GITHUB_TOKEN: ${{ secrets.STIMME_GITHUB_TOKEN }}
          STIMME_REPO: ${{ vars.STIMME_REPO }}
        run: tools/hostpoint/stimme-zugang.sh

      - name: Nachsehen
        if: ${{ !inputs.probe }}
        run: |
          # Erst aussagekräftig, wenn die Domain auf Hostpoint zeigt; vorher antwortet noch GitHub Pages.
          for p in / /b/ /sitemap.xml /alpha/orma/ /nicht-da; do printf '%-16s %s\n' "$p" "$(curl -sS -o /dev/null -w '%{http_code} %{content_type} (%{time_total}s)' "https://ornament.cloud$p" || echo 'keine Antwort')"; done
          printf '%-16s %s\n' "jev im Lab" "$(curl -sS https://ornament.cloud/alpha/lab/jev/wahl.php | head -c 160 || echo 'keine Antwort')"
          printf '%-16s %s\n' "Stimme" "$(curl -sS https://ornament.cloud/alpha/voice/stimme.php | head -c 160 || echo 'keine Antwort')"
          curl -sSI https://ornament.cloud/ | grep -iE '^(server|cache-control|content-encoding|strict-transport|x-content-type):' || true
          # nach dem Umstellen (docs/hostpoint-umzug.md, Schritt 4.3): www leitet um, komprimiert wird, das Manifest hat seinen Typ, das Zertifikat
          printf '%-16s %s\n' "www" "$(curl -sS -o /dev/null -w '%{http_code} → %{redirect_url}' http://www.ornament.cloud/ || echo 'keine Antwort')"
          printf '%-16s %s\n' "www https" "$(curl -sS -o /dev/null -w '%{http_code} → %{redirect_url}' https://www.ornament.cloud/b/ || echo 'keine Antwort')"
          printf '%-16s %s\n' "Kompression" "$(curl -sS -o /dev/null -H 'Accept-Encoding: br, gzip' -D - https://ornament.cloud/b/ | grep -i '^content-encoding' | tr -d '\r' || echo 'keine')"
          printf '%-16s %s\n' "Manifest" "$(curl -sS -o /dev/null -w '%{content_type}' https://ornament.cloud/alpha/orma/manifest.webmanifest || echo 'keine Antwort')"
          echo | openssl s_client -connect ornament.cloud:443 -servername ornament.cloud 2>/dev/null | openssl x509 -noout -issuer -subject -enddate -ext subjectAltName 2>/dev/null || echo 'Zertifikat: keine Antwort'
          # Direkt beim Webhosting, an der Domain vorbei (vor dem Umstellen der DNS: zeigt, was Hostpoint ausliefern wird). Die Adresse des
          # Webservers: die von KONTO.myhostpoint.ch, zum Vergleich die des SSH-Servers; -k, weil FreeSSL erst nach der DNS-Änderung kommt.
          for name in "$HOSTPOINT_USER.myhostpoint.ch" "$HOSTPOINT_HOST"; do
            ip=$(getent ahostsv4 "$name" | awk 'NR==1{print $1}')
            [ -n "$ip" ] || { echo "$name: keine Adresse"; continue; }
            echo "== direkt bei $name ($ip)"
            printf '%-16s %s\n' "http /" "$(curl -sS -o /dev/null --resolve ornament.cloud:80:$ip -w '%{http_code} → %{redirect_url}' http://ornament.cloud/ || echo 'keine Antwort')"
            for p in / /b/ /sitemap.xml /alpha/orma/ /b/apps/phorma-ii/ /nicht-da; do printf '%-16s %s\n' "$p" "$(curl -sSk -o /dev/null --resolve ornament.cloud:443:$ip -w '%{http_code} %{content_type} %{size_download} B (%{time_total}s)' "https://ornament.cloud$p" || echo 'keine Antwort')"; done
            curl -sSkI --resolve ornament.cloud:443:$ip https://ornament.cloud/b/ | grep -iE '^(server|cache-control|content-encoding|strict-transport|x-content-type):' || true
          done
